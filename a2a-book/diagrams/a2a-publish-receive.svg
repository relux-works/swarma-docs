<!-- message a2a -> mailbox -->
<path d="M 385.7 748 L 562.6 748" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a2a" data-to="mailbox" data-edge="m11"/>
<polygon points="568.6,748 558.6,743.5 558.6,752.5" fill="#3a3f47"/>
<rect x="403" y="701" width="148.4" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m11">
<rect x="407" y="702.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="411.5" y="716.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="436.7" y="716.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">квитанция после</tspan></text>
<text x="436.7" y="735.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записи вывода</tspan></text>
