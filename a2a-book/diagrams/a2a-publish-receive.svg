<path d="M 385.7 571 L 672.6 571" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a2a" data-to="session" data-edge="m8"/>
<polygon points="678.6,571 668.6,566.5 668.6,575.5" fill="#3a3f47"/>
<rect x="459.8" y="524" width="144.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m8">
<circle cx="472.8" cy="534.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="469.2" y="539.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="487.8" y="539.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонок: счётчики</tspan></text>
<text x="487.8" y="558.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">без текста</tspan></text>
</g>
<!-- message session -> a2a -->
<path d="M 678.6 610.5 L 391.7 610.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="session" data-to="a2a" data-edge="m9"/>
<polygon points="385.7,610.5 395.7,615 395.7,606" fill="#3a3f47"/>
<rect x="478.2" y="583" width="107.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m9">
<circle cx="491.2" cy="593.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="487.6" y="598.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="506.2" y="598.2" font-size="15" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">a2a</tspan><tspan x="537" font-family="PT Mono, monospace" font-weight="bold">inbox</tspan></text>
</g>
<!-- message a2a -> session -->
<path d="M 385.7 689 L 672.6 689" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a2a" data-to="session" data-edge="m10"/>
