<svg xmlns="http://www.w3.org/2000/svg" width="839.3" height="798" viewBox="0 0 839.3 798">
<title>Публикация и приём в a2a: идентификатор события доказывает публикацию, потребитель сохраняет пачку в почтовый ящик до сдвига курсора, звонок несёт только счётчики, а квитанция ставится после записи вывода входящих.</title>
<rect width="839.3" height="798" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(66.7 0)">
<!-- group recipient -->
<rect x="315.7" y="0" width="432.9" height="774" rx="16" fill="none" stroke="#7c4ddb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="recipient"/>
<!-- group label recipient -->
<rect x="327.7" y="10" width="237.1" height="18.9" fill="#ffffff" class="plate"/>
<text x="333.7" y="24.4" font-size="13" fill="#6a3fc8" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ПОЛЬЗОВАТЕЛЬ ОС АДРЕСАТА</tspan></text>
<line x1="0" y1="83.1" x2="0" y2="766" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="166.7" y1="83.1" x2="166.7" y2="766" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="383.7" y1="83.1" x2="383.7" y2="766" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="570.6" y1="83.1" x2="570.6" y2="766" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="680.6" y1="83.1" x2="680.6" y2="766" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node post -->
<rect x="-66.7" y="37.7" width="133.5" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="post"/>
<text x="-50.7" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Отправитель</tspan></text>
<!-- node carrier -->
<rect x="113.8" y="37.7" width="105.7" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="carrier"/>
<text x="129.8" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Носитель</tspan></text>
<!-- node a2a -->
<rect x="333.7" y="37.7" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="a2a"/>
<text x="369.7" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">a2a</tspan></text>
<!-- node mailbox -->
<rect x="520.6" y="37.7" width="100" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="mailbox"/>
<text x="549" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ящик</tspan></text>
<!-- node session -->
<rect x="630.6" y="37.7" width="100" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="session"/>
<text x="653.8" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сессия</tspan></text>
<!-- divider -->
<line x1="-66.7" y1="121.2" x2="748.6" y2="121.2" stroke="#868e99" stroke-width="1.2"/>
<rect x="323.7" y="107.1" width="100.8" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="337.7" y="125.4" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">публикация</tspan></text>
<!-- message post -> carrier -->
<path d="M 2 194.3 L 158.7 194.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="post" data-to="carrier" data-edge="m1"/>
<polygon points="164.7,194.3 154.7,189.8 154.7,198.8" fill="#3a3f47"/>
<rect x="24" y="147.3" width="118.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="37" cy="158.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="33.3" y="162.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="52" y="162.6" font-size="15" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">a2a</tspan><tspan x="82.8" font-family="PT Mono, monospace" font-weight="bold">post</tspan></text>
<text x="52" y="182.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с заголовком</tspan></text>
</g>
<!-- message carrier -> post -->
<path d="M 164.7 253.3 L 8 253.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="carrier" data-to="post" data-edge="m2"/>
<polygon points="2,253.3 12,257.8 12,248.8" fill="#3a3f47"/>
<rect x="16" y="206.3" width="134.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="29" cy="217.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="221.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="44" y="221.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">идентификатор</tspan></text>
<text x="44" y="241.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">события</tspan></text>
</g>
<!-- divider -->
<line x1="-66.7" y1="279.4" x2="748.6" y2="279.4" stroke="#868e99" stroke-width="1.2"/>
<rect x="323.7" y="265.3" width="67.1" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="337.7" y="283.6" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">приём</tspan></text>
