<text x="493.9" y="637.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записи в рамке</tspan></text>
<text x="493.9" y="657.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">недоверенных</tspan></text>
<text x="493.9" y="676.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">данных</tspan></text>
