<circle cx="187.7" cy="316.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="184" y="320.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="202.7" y="320.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">синхронизация</tspan></text>
<text x="202.7" y="340.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с курсора</tspan></text>
</g>
<!-- message carrier -> a2a -->
<path d="M 168.7 392 L 375.7 392" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="carrier" data-to="a2a" data-edge="m5"/>
<polygon points="381.7,392 371.7,387.5 371.7,396.5" fill="#3a3f47"/>
<rect x="176.5" y="364.5" width="129.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="189.5" cy="375.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="185.8" y="379.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="204.5" y="379.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">пачка событий</tspan></text>
</g>
<!-- message a2a -> mailbox -->
<path d="M 385.7 451 L 562.6 451" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a2a" data-to="mailbox" data-edge="m6"/>
<polygon points="568.6,451 558.6,446.5 558.6,455.5" fill="#3a3f47"/>
<rect x="399.7" y="404" width="154.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="412.7" cy="414.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="409" y="419.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="427.7" y="419.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">события личности,</tspan></text>
<text x="427.7" y="438.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">затем</tspan><tspan x="469.3" font-family="PT Mono, monospace" font-weight="bold">fsync</tspan></text>
</g>
<!-- self a2a -->
<path d="M 385.7 467 L 415.7 467 L 415.7 516 L 392.7 516" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a2a" data-to="a2a" data-edge="m7"/>
<polygon points="386.7,516 396.7,520.5 396.7,511.5" fill="#3a3f47"/>
<rect x="423.7" y="471" width="118.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m7">
<circle cx="436.7" cy="481.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="433" y="486.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="451.7" y="486.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">курсор после</tspan></text>
<text x="451.7" y="505.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сброса</tspan></text>
</g>
