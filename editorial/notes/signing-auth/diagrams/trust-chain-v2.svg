<svg xmlns="http://www.w3.org/2000/svg" width="681.6" height="674.9" viewBox="0 0 681.6 674.9">
<title>От закреплённых корней к ключам разных назначений</title>
<rect width="681.6" height="674.9" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- group carriers -->
<rect x="363.8" y="328.4" width="293.8" height="234" rx="16" fill="none" stroke="#d9690f" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="carriers"/>
<!-- node root -->
<rect x="0" y="474" width="257.8" height="70.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="root"/>
<text x="56.1" y="500.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Корень оператора</tspan></text>
<text x="29.5" y="528.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">аппаратный ключ у владельца</tspan></text>
<!-- node km -->
<rect x="0" y="201.3" width="257.8" height="94.3" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="km"/>
<text x="54" y="227.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Корень аттестаций</tspan></text>
<text x="90.1" y="250.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ключника</tspan></text>
<text x="42.1" y="279.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">только аттестации агентов</tspan></text>
<!-- node registry -->
<rect x="0" y="318" width="257.8" height="70.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="registry"/>
<text x="74.3" y="344.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ реестра</tspan></text>
<text x="49" y="372.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">снимки отзывов агентов</tspan></text>
<!-- node grantroot -->
<rect x="0" y="63" width="257.8" height="70.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="grantroot"/>
<text x="66.9" y="89.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Корень грантов</tspan></text>
<text x="89.2" y="117.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">у владельца</tspan></text>
<!-- node device -->
<rect x="381.8" y="580" width="257.8" height="70.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="device"/>
<text x="443.9" y="606.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ устройства</tspan></text>
<text x="413.7" y="634.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Secure Enclave: P-256 с low-S</tspan></text>
<!-- node master -->
<rect x="381.8" y="381" width="257.8" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="master"/>
<text x="457" y="407.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix master</tspan></text>
<text x="397.8" y="435.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">cross-signing: self-signing</tspan><tspan x="569.3" font-family="PT Mono, monospace">→</tspan><tspan x="582.3" font-family="PT Sans, sans-serif">device</tspan></text>
<!-- node omemo -->
<rect x="381.8" y="474" width="257.8" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="omemo"/>
<text x="452.7" y="500.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">OMEMO device</tspan></text>
<text x="476.6" y="528.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">fingerprint</tspan></text>
<!-- node agent -->
<rect x="381.8" y="209.2" width="257.8" height="90.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agent"/>
<text x="461.6" y="235.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ агента</tspan></text>
<text x="452.9" y="263.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Ed25519, до 24 ч;</tspan></text>
<text x="444" y="283.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">у агента секрета нет</tspan></text>
<!-- node grantsvc -->
<rect x="381.8" y="0" width="257.8" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="grantsvc"/>
<text x="450" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сервис грантов</tspan></text>
<text x="422" y="54.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">под родительским грантом</tspan></text>
<!-- node grants -->
<rect x="381.8" y="93" width="257.8" height="70.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="grants"/>
<text x="482.4" y="119.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Гранты</tspan></text>
<text x="479.2" y="147.6" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">grant/1</tspan></text>
<!-- link root -> device -->
<path d="M 258.2 545.3 C 295.6 555.7 336.6 567.1 374.4 577.7 L 375.6 578" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="root" data-to="device" data-edge="e0"/>
<polygon points="381.4,579.6 373,572.6 370.6,581.3" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="274.3" y="538.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
</g>
<!-- link root -> master -->
<path d="M 258.2 478 C 295.6 468.9 336.6 458.8 374.4 449.6 L 375.6 449.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="root" data-to="master" data-edge="e1"/>
<polygon points="381.4,447.9 370.6,445.9 372.8,454.6" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="286.1" y="442.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
</g>
<!-- link root -> omemo -->
<path d="M 258.2 509.4 C 295.5 509.4 336.2 509.4 373.9 509.4 L 375.4 509.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="root" data-to="omemo" data-edge="e2"/>
<polygon points="381.4,509.4 371.4,504.9 371.4,514" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="279.9" y="498.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
</g>
<!-- link km -> agent -->
<path d="M 258.2 250.5 C 295.5 251.1 336.2 251.7 373.9 252.3 L 375.4 252.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="km" data-to="agent" data-edge="e3"/>
<polygon points="381.4,252.4 371.5,247.8 371.3,256.8" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="279.9" y="239.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
</g>
<!-- link registry -> agent -->
<path d="M 258.2 320 C 295.6 310.3 336.6 299.6 374.4 289.7 L 375.6 289.4" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="registry" data-to="agent" data-edge="e4"/>
<polygon points="381.4,287.9 370.6,286.1 372.9,294.8" fill="#c8285f"/>
<g class="label" data-edge="e4">
<text x="302.6" y="286.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отзыв</tspan></text>
</g>
<!-- link grantroot -> grantsvc -->
<path d="M 258.2 77.2 C 295.6 71 336.6 64.2 374.4 57.9 L 375.5 57.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="grantroot" data-to="grantsvc" data-edge="e5"/>
<polygon points="381.4,56.7 370.8,53.9 372.3,62.8" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="280.2" y="50.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
</g>
<!-- link grantroot -> grants -->
<path d="M 258.2 108.6 C 295.6 111.5 336.6 114.8 374.4 117.8 L 375.4 117.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="grantroot" data-to="grants" data-edge="e6"/>
<polygon points="381.4,118.3 371.8,113 371.1,122" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="288.9" y="100" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подпись</tspan></text>
</g>
<!-- group label carriers -->
<rect x="375.8" y="338.4" width="159.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="381.8" y="352.8" font-size="13" fill="#b9580b" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">КЛЮЧИ НОСИТЕЛЕЙ</tspan></text>
</g>
</svg>
