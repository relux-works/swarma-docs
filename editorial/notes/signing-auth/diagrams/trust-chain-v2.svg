<svg xmlns="http://www.w3.org/2000/svg" width="896.1" height="642.6" viewBox="0 0 896.1 642.6">
<title>От закреплённого корня к ключам разных назначений</title>
<rect width="896.1" height="642.6" fill="#ffffff"/>
<g transform="translate(16 16)">
<!-- group carriers -->
<rect x="8" y="159.9" width="384" height="442.7" rx="16" fill="none" stroke="#d9690f" stroke-width="2" stroke-dasharray="8 6"/>
<!-- node master -->
<rect x="26.2" y="225.7" width="151.5" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2"/>
<text x="48.2" y="251.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix master</tspan></text>
<!-- node selfsigning -->
<rect x="26.4" y="385.8" width="189.3" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2"/>
<text x="48.4" y="411.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix self-signing</tspan></text>
<!-- node device -->
<rect x="43.8" y="513.7" width="154.3" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2"/>
<text x="69" y="539.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix device</tspan></text>
<text x="65.8" y="568.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">участвует в E2EE</tspan></text>
<!-- node omemo -->
<rect x="206.5" y="212.9" width="167" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2"/>
<text x="232" y="239" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">OMEMO device</tspan></text>
<text x="228.5" y="267.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">каждый fingerprint</tspan></text>
<!-- node root -->
<rect x="364.4" y="0" width="205.3" height="109.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2"/>
<text x="394.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Корень оператора</tspan></text>
<text x="418.4" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">FIDO + резерв;</tspan></text>
<text x="386.4" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписывает аттестации</tspan></text>
<text x="387" y="93.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и отзывы, не сообщения</tspan></text>
<!-- node signer -->
<rect x="410" y="193.4" width="232" height="109.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2"/>
<text x="432.2" y="219.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ устройства Signer</tspan></text>
<text x="432" y="248.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Secure Enclave Mac / iPhone:</tspan></text>
<text x="434.6" y="267.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">P-256/ECDSA; назначение +</tspan></text>
<text x="467" y="287.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">срок; присутствие</tspan></text>
<!-- node km -->
<rect x="671.3" y="203.2" width="183.4" height="90.4" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2"/>
<text x="693.3" y="229.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Корень Keymaker</tspan></text>
<text x="709.8" y="257.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">мастер-секрет и</tspan></text>
<text x="702.3" y="277.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">выводимые ключи</tspan></text>
<!-- node agentkey -->
<rect x="661.9" y="363.3" width="202.1" height="90.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2"/>
<text x="713.9" y="389.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ агента</tspan></text>
<text x="683.9" y="417.9" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">swarma-msg</tspan><tspan x="773.9" font-family="PT Sans, sans-serif">: Ed25519;</tspan></text>
<text x="696.3" y="437.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">у агента секрета нет</tspan></text>
<!-- link root -> signer -->
<path d="M 483.8 110.3 C 491 133.9 499.6 161.7 507.1 186.1 L 507.5 187.5" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="509.3,193.2 510.7,182.3 502.1,185" fill="#3a3f47"/>
<text x="500.5" y="144.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
<!-- link root -> km -->
<path d="M 570 108.2 C 598.5 123.8 629 141.7 656 159.9 C 673 171.4 690.6 185 706.5 197.9 L 707.6 198.9" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="712.2,202.7 707.4,192.8 701.6,199.8" fill="#3a3f47"/>
<text x="645.2" y="144.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">удостоверение</tspan></text>
<!-- link km -> agentkey -->
<path d="M 763 293.8 C 763 312.9 763 335.4 763 355.3 L 763 356.8" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="763,362.8 767.5,352.8 758.5,352.8" fill="#3a3f47"/>
<text x="766.9" y="337.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">удостоверяет</tspan></text>
<!-- link root -> master -->
<path d="M 364 83.8 C 310.3 101 244.9 126.3 192 159.9 C 166.1 176.4 141.5 201.2 124.6 220.1 L 124 220.8" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="120,225.3 130,220.8 123.2,214.9" fill="#3a3f47"/>
<text x="252.3" y="144.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
<!-- link master -> selfsigning -->
<path d="M 104.6 271.3 C 108 299.2 113.8 347.4 117.5 378.4 L 117.6 379.5" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="118.3,385.4 121.6,375 112.7,376" fill="#3a3f47"/>
<text x="117.3" y="337.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">cross-signing</tspan></text>
<!-- link selfsigning -> device -->
<path d="M 121 431.5 C 121 451.4 121 481.3 121 505.9 L 121 507.3" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="121,513.3 125.5,503.3 116.5,503.3" fill="#3a3f47"/>
<text x="125.1" y="488.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">cross-signing</tspan></text>
<!-- link root -> omemo -->
<path d="M 416.8 110.3 C 388.3 141.1 353.3 178.9 327.3 207 L 326.3 208.1" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="322.2,212.5 332.3,208.2 325.7,202.1" fill="#3a3f47"/>
<text x="403.6" y="144.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аттестация</tspan></text>
<!-- group label carriers -->
<rect x="20" y="169.9" width="159.6" height="18.9" fill="#ffffff"/>
<text x="26" y="184.3" font-size="13" fill="#b9580b" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">КЛЮЧИ НОСИТЕЛЕЙ</tspan></text>
</g>
</svg>
