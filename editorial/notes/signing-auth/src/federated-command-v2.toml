# Trust boundaries of a command sent through two federated Matrix servers.
# Source: ru/09-federation.md and src/federated-command.puml. Step 4 has two
# outcomes, as in the source: admission with a separate result, or refusal
# (alert colour) when anything fails; both keep the number of the step.
layout = "stack"
alt = "Федерация перевозит событие, получатель устанавливает доверие"

[groups.sender]
label = "Сторона отправителя"
role = "key"

[groups.federation]
label = "Серверы доставки"
role = "external"
note = "Федерация полномочий не даёт."
note_side = "left"

[groups.recipient]
label = "Сторона получателя"
role = "service"

[nodes.signer]
group = "sender"
role = "key"
name = "Signer"
text = "подписывает назначение и тело"

[nodes.alpha]
group = "federation"
role = "external"
name = "alpha.example"
text = "Matrix-сервер отправителя"

[nodes.beta]
group = "federation"
role = "external"
name = "beta.example"
text = "Matrix-сервер получателя; может задержать, скрыть или повторить событие"

[nodes.verifier]
group = "recipient"
role = "service"
name = "Получатель"
text = "корень владельца, отзыв, `iat`/`exp`, `id`, назначение, грант"

[[links]]
from = "signer"
to = "alpha"
step = 1
label = "подписанный конверт"

[[links]]
from = "alpha"
to = "beta"
step = 2
label = "те же байты"
via = "федерация"

[[links]]
from = "beta"
to = "verifier"
step = 3
label = "доставка в комнату адресату `to`"

[[links]]
from = "verifier"
to = "signer"
step = 4
label = "всё проверено: допуск и отдельный результат"

[[links]]
from = "verifier"
to = "signer"
step = 4
label = "задержка, ключи скрыты или иной сбой: отказ; сервер права не добавляет"
color = "alert"
