# One update, part 2 of 5: artifacts, the protected copy, the plan built on
# the protected side and the act content sent to the phone. Content follows
# chapter "Как обновляется Swarma" (sections "Updater на машине", "Акт
# оператора", "Обновление в окне обслуживания"). The updater's preview is
# advisory; the plan the phone signs comes from the applier. Step numbers
# continue update-flow-1.
layout = "sequence"
alt = "Обновление, часть 2: защищённая копия набора, план и содержание акта. Номера сообщений продолжают первую часть."

[theme.space]
seq_node_width = 130
seq_label_width = 150
seq_self_width = 150
seq_column_gap = 20

[groups.host]
label = "Машина владельца"
role = "service"

[nodes.mirror]
role = "external"
name = "Зеркала"

[nodes.updater]
group = "host"
role = "service"
name = "Swarma Updater"

[nodes.applier]
group = "host"
role = "service"
name = "Применитель"

[nodes.phone]
role = "key"
name = "Телефон оператора"

[[seq]]
from = "updater"
to = "mirror"
step = 6
label = "артефакты набора"

[[seq]]
from = "mirror"
to = "updater"
step = 7
label = "байты в пределах длин"

[[seq]]
from = "updater"
to = "applier"
step = 8
label = "номер набора, подсказка"

[[seq]]
from = "applier"
to = "applier"
step = 9
label = "защищённая копия и проверка в пределах ёмкости"

[[seq]]
from = "applier"
to = "applier"
step = 10
label = "план из проверенного набора"

[[seq]]
from = "updater"
to = "updater"
step = 11
label = "предпросмотр владельцу"

[[seq]]
from = "applier"
to = "phone"
step = 12
label = "машина, вид, прежнее состояние, набор, дайджест плана, окно"
