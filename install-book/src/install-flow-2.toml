# Installation flow, part 2 of 4: operator, keyholder, host services and the
# qualification of the machine (installation steps 5-7). Content follows
# chapter "Шаги и результат каждого шага". Message numbers continue part 1.
# The phone talks to the operator account, not to the keyholder, so the
# keyholder's root goes through the installer. The dispatcher, not the
# installer, opens admission on the evidence of the attestation. Density keys
# from editorial/diagram-style.ru.md.
layout = "sequence"
alt = "Установка, часть 2: оператор, ключник, службы хоста и квалификация машины. Номера сообщений продолжают первую часть."

[theme.space]
seq_node_width = 130
seq_label_width = 150
seq_self_width = 150
seq_column_gap = 20

[groups.host]
label = "Машина владельца"
role = "service"

[nodes.phone]
role = "key"
name = "Телефон оператора"

[nodes.installer]
group = "host"
role = "service"
name = "Установщик"

[nodes.keyholder]
group = "host"
role = "key"
name = "Ключник"

[nodes.services]
group = "host"
role = "service"
name = "Службы хоста"

[[seq]]
from = "installer"
to = "phone"
step = 10
label = "сопряжение ключа оператора"

[[seq]]
from = "installer"
to = "keyholder"
step = 11
label = "запустить ключника"

[[seq]]
from = "keyholder"
to = "installer"
step = 12
label = "публичный корень"

[[seq]]
from = "installer"
to = "phone"
step = 13
label = "корень на подтверждение"

[[seq]]
from = "installer"
to = "services"
step = 14
label = "запустить службы, допуск закрыт"

[[seq]]
from = "phone"
to = "services"
step = 15
label = "грант диспетчера"

[[seq]]
from = "installer"
to = "installer"
step = 16
label = "проверить привязки и запрет сети"

[[seq]]
from = "installer"
to = "services"
step = 17
label = "подписанная аттестация"

[[seq]]
note = "Диспетчер открывает допуск по свидетельствам аттестации."
on = "services"
