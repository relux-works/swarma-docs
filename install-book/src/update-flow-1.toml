# One update, part 1 of 5: fetch, pre-check and metadata acceptance. Content
# follows chapter "Как обновляется Swarma" (section "Проверка до
# активации"). Each root, snapshot and targets version is stored with its
# inclusion proof and checkpoint; the timestamp is not logged. The metadata
# commit needs no operator act and happens even if the owner never approves;
# a later failure keeps every role already accepted. The whole update does
# not fit one box; it is split by phase (metadata; preparation and act
# content; admission and window; continuation and effects; qualification and
# the admission owner's decision), per diagram-style; step numbers continue
# across the parts.
layout = "sequence"
alt = "Обновление, часть 1: загрузка, предпроверка и фиксация метаданных."

[theme.space]
seq_node_width = 130
seq_label_width = 160
seq_self_width = 170
seq_column_gap = 20

[groups.host]
label = "Машина владельца"
role = "service"

[nodes.mirror]
role = "external"
name = "Зеркала и журнал"

[nodes.updater]
group = "host"
role = "service"
name = "Swarma Updater"

[nodes.committer]
group = "host"
role = "service"
name = "Фиксатор метаданных"

[[seq]]
from = "updater"
to = "mirror"
step = 1
label = "`root`, `timestamp`, `snapshot`, `targets`"

[[seq]]
from = "mirror"
to = "updater"
step = 2
label = "метаданные и доказательства журнала"

[[seq]]
from = "updater"
to = "updater"
step = 3
label = "предпроверка в пределах ресурсов"

[[seq]]
from = "updater"
to = "committer"
step = 4
label = "метаданные на фиксацию"

[[seq]]
from = "committer"
to = "committer"
step = 5
label = "роли с доказательством включения; полные отзывы"
