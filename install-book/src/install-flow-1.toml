# Installation flow, part 1 of 4: from the first-install file to the platform
# root (the stop before step 1 and installation steps 1-4). Content follows
# chapters "Одна команда" and "Шаги и результат каждого шага" and the
# first-install invariant of "Как обновляется Swarma" ("Первая установка и
# каналы пакетов"): the owner compares the digest of the root-only copy
# before the OS installer gets it, and the binding plan is shown and approved
# in the OS-started administrator session, never in the owner's session.
# Messages are numbered in order across all four parts. The whole flow does
# not fit one box; it is split by phase (first install and plan, operator and
# services, profiles and registry, keeper), per diagram-style. Density keys
# from editorial/diagram-style.ru.md.
layout = "sequence"
alt = "Установка, часть 1: от файла первой установки до корня платформы. Сверка дайджеста, план и пароль проходят в сеансе администратора, который запускает ОС."

[theme.space]
seq_node_width = 130
seq_label_width = 150
seq_self_width = 150
seq_column_gap = 20

[groups.host]
label = "Машина владельца"
role = "service"

[nodes.owner]
role = "human"
name = "Владелец"

[nodes.session]
group = "host"
role = "service"
name = "Сеанс администратора ОС"

[nodes.installer]
group = "host"
role = "service"
name = "Установщик"

[nodes.curator]
group = "host"
role = "service"
name = "Swarma Curator"

[[seq]]
from = "owner"
to = "session"
step = 1
label = "пароль, один раз"

[[seq]]
from = "session"
to = "session"
step = 2
label = "копия файла только для root, дайджест"

[[seq]]
from = "owner"
to = "session"
step = 3
label = "дайджест и отпечаток корня сверены"

[[seq]]
from = "session"
to = "installer"
step = 4
label = "установщик ОС ставит копию"

[[seq]]
from = "installer"
to = "installer"
step = 5
label = "манифест по корню обновлений"

[[seq]]
from = "installer"
to = "owner"
step = 6
label = "план в сеансе администратора"

[[seq]]
from = "owner"
to = "installer"
step = 7
label = "одобрение плана"

[[seq]]
from = "installer"
to = "curator"
step = 8
label = "поставить под учёткой владельца"

[[seq]]
from = "installer"
to = "installer"
step = 9
label = "корень, замыкание, учётки, запрет сети"
