<svg xmlns="http://www.w3.org/2000/svg" width="454.4" height="687" viewBox="0 0 454.4 687">
<title>Обновление, часть 4: проверка продолжения, эффекты и смена замыкания. Номера сообщений продолжают третью часть.</title>
<rect width="454.4" height="687" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(104 0)">
<!-- group host -->
<rect x="-87.2" y="0" width="401.9" height="663" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="host"/>
<!-- group label host -->
<rect x="-75.2" y="10" width="172.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="-69.2" y="24.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">МАШИНА ВЛАДЕЛЬЦА</tspan></text>
<line x1="0" y1="83.1" x2="0" y2="655" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="242.4" y1="106.5" x2="242.4" y2="655" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame opt -->
<rect x="-104" y="406.9" width="430.4" height="228.1" rx="10" fill="none" stroke="#868e99" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" class="frame" data-kind="opt"/>
<rect x="-79.2" y="413.9" width="168.3" height="20.2" fill="#ffffff" class="plate"/>
<text x="-73.2" y="428.2" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">набор меняет замыкание</tspan></text>
<!-- node applier -->
<rect x="-69.2" y="37.7" width="138.4" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="applier"/>
<text x="-53.2" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Применитель</tspan></text>
<!-- node admission -->
<rect x="188" y="37.7" width="108.7" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="admission"/>
<text x="204" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Владелец</tspan></text>
<text x="210.6" y="87.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуска</tspan></text>
<!-- self applier -->
<path d="M 2 134.5 L 32 134.5 L 32 222.5 L 9 222.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="applier" data-edge="m0"/>
<polygon points="3,222.5 13,227 13,218" fill="#3a3f47"/>
<rect x="40" y="138.5" width="176.1" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<rect x="44" y="140.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="48.5" y="153.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">18</tspan></text>
<text x="73.7" y="153.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка</tspan></text>
<text x="73.7" y="173.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">продолжения: своя</tspan></text>
<text x="73.7" y="192.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">операция, стоп,</tspan></text>
<text x="73.7" y="212.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ключ, время, отзывы</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="234.5" width="362.4" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="18.6" y="259.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Отказ до первой записи о начале</tspan></text>
<text x="-3.7" y="278" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">окончателен; допуск остаётся закрытым.</tspan></text>
<!-- self applier -->
<path d="M 2 306.9 L 32 306.9 L 32 394.9 L 9 394.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="applier" data-edge="m2"/>
<polygon points="3,394.9 13,399.4 13,390.4" fill="#3a3f47"/>
<rect x="40" y="310.9" width="147.1" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<rect x="44" y="312.6" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="48.5" y="326.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">19</tspan></text>
<text x="73.7" y="326.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">каждый эффект:</tspan></text>
<text x="73.7" y="345.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запись о начале,</tspan></text>
<text x="73.7" y="365.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">исполнение,</tspan></text>
<text x="73.7" y="384.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">наблюдение</tspan></text>
</g>
<!-- self applier -->
<path d="M 2 447.1 L 32 447.1 L 32 554.6 L 9 554.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="applier" data-edge="m3"/>
<polygon points="3,554.6 13,559.1 13,550.1" fill="#3a3f47"/>
<rect x="40" y="451.1" width="176.4" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<rect x="44" y="452.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="48.5" y="466.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">20</tspan></text>
<text x="73.7" y="466.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">изолированная</tspan></text>
<text x="73.7" y="485.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка кандидата,</tspan></text>
<text x="73.7" y="505.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">переключение</tspan></text>
<text x="73.7" y="524.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">последним</tspan></text>
<text x="73.7" y="544.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">эффектом</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="566.6" width="362.4" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="-10.6" y="591.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Операцией владеет выбранное замыкание</tspan></text>
<text x="5.1" y="610.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">после завершения забора уходящего.</tspan></text>
</g>
</g>
</svg>
