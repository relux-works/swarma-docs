<svg xmlns="http://www.w3.org/2000/svg" width="554.5" height="387.1" viewBox="0 0 554.5 387.1">
<title>Установка, часть 3: профили Curator, подписки провайдеров и первый план запуска. Номера сообщений продолжают вторую часть.</title>
<rect width="554.5" height="387.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(54.3 0)">
<!-- group host -->
<rect x="74.3" y="0" width="401.8" height="363.1" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="host"/>
<!-- group label host -->
<rect x="86.3" y="10" width="172.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="92.3" y="24.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">МАШИНА ВЛАДЕЛЬЦА</tspan></text>
<line x1="0" y1="83.1" x2="0" y2="355.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="169.8" y1="83.1" x2="169.8" y2="355.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="386.9" y1="83.1" x2="386.9" y2="355.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node owner -->
<rect x="-54.3" y="37.7" width="108.7" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="owner"/>
<text x="-38.3" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Владелец</tspan></text>
<!-- node curator -->
<rect x="92.3" y="37.7" width="155" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="curator"/>
<text x="108.3" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Curator</tspan></text>
<!-- node services -->
<rect x="315.5" y="37.7" width="142.6" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="services"/>
<text x="331.5" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Службы хоста</tspan></text>
<!-- self curator -->
<path d="M 171.8 111.1 L 201.8 111.1 L 201.8 179.6 L 178.8 179.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="curator" data-edge="m0"/>
<polygon points="172.8,179.6 182.8,184.1 182.8,175.1" fill="#3a3f47"/>
<rect x="209.8" y="115.1" width="151" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<rect x="213.8" y="116.9" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="218.3" y="130.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">18</tspan></text>
<text x="243.6" y="130.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">профили</tspan></text>
<text x="243.6" y="149.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">из закреплённых</tspan></text>
<text x="243.6" y="169.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">источников</tspan></text>
</g>
<!-- message owner -> services -->
<path d="M 2 262.1 L 378.9 262.1" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 5" class="edge" data-from="owner" data-to="services" data-edge="m1"/>
<polygon points="384.9,262.1 374.9,257.6 374.9,266.6" fill="#3a3f47"/>
<rect x="159.5" y="195.6" width="142.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<rect x="163.5" y="197.4" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="168" y="211" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">19</tspan></text>
<text x="193.2" y="210.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписки,</tspan></text>
<text x="193.2" y="230.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подтверждение</tspan></text>
<text x="193.2" y="249.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">телефоном</tspan></text>
</g>
<!-- message curator -> services -->
<path d="M 171.8 329.1 L 378.9 329.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="services" data-edge="m2"/>
<polygon points="384.9,329.1 374.9,324.6 374.9,333.6" fill="#3a3f47"/>
<rect x="216.8" y="282.1" width="123.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<rect x="220.8" y="283.9" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="225.3" y="297.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">20</tspan></text>
<text x="250.6" y="297.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">план запуска</tspan></text>
<text x="250.6" y="316.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">роли</tspan></text>
</g>
</g>
</g>
</svg>
