<rect x="312" y="518.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="316.5" y="531.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">11</tspan></text>
<text x="341.8" y="531.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предпросмотр</tspan></text>
<text x="341.8" y="551.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">владельцу</tspan></text>
</g>
<!-- message applier -> phone -->
<path d="M 485.1 683 L 726.4 683" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="phone" data-edge="m6"/>
<polygon points="732.4,683 722.4,678.5 722.4,687.5" fill="#3a3f47"/>
<rect x="578.3" y="577.5" width="148.1" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<rect x="582.3" y="579.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="586.8" y="592.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">12</tspan></text>
<text x="612.1" y="592.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">машина, вид,</tspan></text>
<text x="612.1" y="612.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">прежнее</tspan></text>
<text x="612.1" y="631.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">состояние,</tspan></text>
<text x="612.1" y="651.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">набор, дайджест</tspan></text>
<text x="612.1" y="670.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">плана, окно</tspan></text>
</g>
</g>
</g>
</svg>
