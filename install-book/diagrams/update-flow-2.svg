<circle cx="307.1" cy="330.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="303.4" y="335.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="322.1" y="335.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">защищённая</tspan></text>
<text x="322.1" y="354.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">копия и проверка</tspan></text>
<text x="322.1" y="374.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в пределах</tspan></text>
<text x="322.1" y="393.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ёмкости</tspan></text>
</g>
<!-- self applier -->
<path d="M 481.1 424 L 451.1 424 L 451.1 492.5 L 474.1 492.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="applier" data-edge="m4"/>
<polygon points="480.1,492.5 470.1,488 470.1,497" fill="#3a3f47"/>
<rect x="294" y="428" width="149.1" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<rect x="298" y="429.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="302.5" y="443.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="327.8" y="443.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">план</tspan></text>
<text x="327.8" y="462.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">из проверенного</tspan></text>
<text x="327.8" y="482.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">набора</tspan></text>
</g>
<!-- self updater -->
<path d="M 270 512.5 L 300 512.5 L 300 561.5 L 277 561.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="updater" data-to="updater" data-edge="m5"/>
<polygon points="271,561.5 281,566 281,557" fill="#3a3f47"/>
<rect x="308" y="516.5" width="133" height="41" fill="#ffffff" class="plate"/>
