<text x="699.6" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Телефон</tspan></text>
<text x="693" y="87.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">оператора</tspan></text>
<!-- message updater -> mirror -->
<path d="M 266 158 L 8 158" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="updater" data-to="mirror" data-edge="m0"/>
<polygon points="2,158 12,162.5 12,153.5" fill="#3a3f47"/>
<rect x="8" y="130.5" width="154.5" height="21.5" fill="#ffffff" class="plate"/>
