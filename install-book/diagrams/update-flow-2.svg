<circle cx="27" cy="188.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="23.3" y="193.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="42" y="193.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">байты</tspan></text>
<text x="42" y="212.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в пределах длин</tspan></text>
</g>
<!-- message updater -> applier -->
<path d="M 270 292 L 475.1 292" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="updater" data-to="applier" data-edge="m2"/>
<polygon points="481.1,292 471.1,287.5 471.1,296.5" fill="#3a3f47"/>
<rect x="311.5" y="245" width="128.2" height="41" fill="#ffffff" class="plate"/>
