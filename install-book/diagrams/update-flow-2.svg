<circle cx="324.5" cy="255.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="320.8" y="260.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="339.5" y="260.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">номер набора,</tspan></text>
<text x="339.5" y="279.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подсказка</tspan></text>
</g>
<!-- self applier -->
<path d="M 481.1 316 L 451.1 316 L 451.1 404 L 474.1 404" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="applier" data-to="applier" data-edge="m3"/>
<polygon points="480.1,404 470.1,399.5 470.1,408.5" fill="#3a3f47"/>
<rect x="294.1" y="320" width="149.1" height="80" fill="#ffffff" class="plate"/>
