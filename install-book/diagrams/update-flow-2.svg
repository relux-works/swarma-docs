<circle cx="21" cy="141.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="17.3" y="145.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="36" y="145.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">артефакты набора</tspan></text>
</g>
<!-- message mirror -> updater -->
<path d="M 2 225 L 260 225" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mirror" data-to="updater" data-edge="m1"/>
<polygon points="266,225 256,220.5 256,229.5" fill="#3a3f47"/>
<rect x="14" y="178" width="142.5" height="41" fill="#ffffff" class="plate"/>
