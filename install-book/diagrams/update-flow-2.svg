<svg xmlns="http://www.w3.org/2000/svg" width="865.9" height="741" viewBox="0 0 865.9 741">
<title>Обновление, часть 2: защищённая копия набора, план и содержание акта. Номера сообщений продолжают первую часть.</title>
<rect width="865.9" height="741" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(50 0)">
<!-- group host -->
<rect x="170.5" y="0" width="399.9" height="717" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="host"/>
<!-- group label host -->
<rect x="182.5" y="10" width="172.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="188.5" y="24.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">МАШИНА ВЛАДЕЛЬЦА</tspan></text>
<line x1="0" y1="83.1" x2="0" y2="709" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="268" y1="83.1" x2="268" y2="709" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="483.1" y1="83.1" x2="483.1" y2="709" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="734.4" y1="106.5" x2="734.4" y2="709" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node mirror -->
<rect x="-50" y="37.7" width="100" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="mirror"/>
<text x="-32.1" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Зеркала</tspan></text>
<!-- node updater -->
<rect x="188.5" y="37.7" width="159.1" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="updater"/>
<text x="204.5" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Updater</tspan></text>
