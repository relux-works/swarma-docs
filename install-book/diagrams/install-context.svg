<svg xmlns="http://www.w3.org/2000/svg" width="949.7" height="395.7" viewBox="0 0 949.7 395.7">
<title>Машина владельца и то, с чем она работает вне себя.</title>
<rect width="949.7" height="395.7" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node owner -->
<rect x="215.6" y="0" width="218.4" height="90.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="owner"/>
<text x="286.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Владелец</tspan></text>
<text x="247.3" y="54.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ставит машину, сверяет</tspan></text>
<text x="231.6" y="74.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">отпечаток корня и дайджест</tspan></text>
<!-- node phone -->
<rect x="568.6" y="0" width="220.4" height="90.4" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="phone"/>
<text x="600.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Телефон оператора</tspan></text>
<text x="586.6" y="54.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписывает расширяющие</tspan></text>
<text x="584.6" y="74.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">действия и акты обновления</tspan></text>
<!-- node release -->
<rect x="0" y="150.4" width="231.5" height="90.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="release"/>
<text x="38.7" y="176.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Источники выпуска</tspan></text>
<text x="16" y="205" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">зеркала, метаданные выпуска,</tspan></text>
<text x="44.4" y="224.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">журнал прозрачности</tspan></text>
<!-- node host -->
<rect x="425" y="150.4" width="185.6" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="441" y="176.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Машина владельца</tspan></text>
<text x="461.7" y="205" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Swarma Runtime,</tspan></text>
<text x="460.4" y="224.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Curator и Updater</tspan></text>
<!-- node trustnode -->
<rect x="740.5" y="150.4" width="156.5" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="trustnode"/>
<text x="764.9" y="176.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Узел доверия</tspan></text>
<text x="760.5" y="205" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">реестр владельца</tspan></text>
<text x="756.5" y="224.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и свидетель отката</tspan></text>
<!-- node carrier -->
<rect x="175" y="300.8" width="225.5" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="carrier"/>
<text x="221.1" y="326.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сервер носителя</tspan></text>
<text x="191" y="355.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">регистратор и учётки агентов</tspan></text>
<!-- node codehost -->
<rect x="422.4" y="300.8" width="190.7" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="codehost"/>
<text x="465.4" y="326.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хостинг кода</tspan></text>
<text x="438.4" y="355.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">репозитории и раннеры</tspan></text>
<!-- node providers -->
<rect x="634.7" y="300.8" width="252.2" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="providers"/>
<text x="670.9" y="326.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Провайдеры и службы</tspan></text>
<text x="650.7" y="355.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">модели и службы работы агентов</tspan></text>
<!-- link owner -> phone -->
<path d="M 434.4 45.2 C 474.5 45.2 520 45.2 560.9 45.2 L 562.2 45.2" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 5" class="edge" data-from="owner" data-to="phone" data-edge="e0"/>
<polygon points="568.2,45.2 558.2,40.7 558.2,49.7" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="448.3" y="33.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подтверждение</tspan></text>
</g>
<!-- link owner -> host -->
<path d="M 350.9 90.5 C 361 105.1 373.6 120.7 387.8 132.4 C 397.1 140.1 407.6 147.2 418.4 153.5 L 419.6 154.2" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 5" class="edge" data-from="owner" data-to="host" data-edge="e1"/>
<polygon points="424.8,157.2 418.3,148.3 413.9,156.1" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="391.6" y="124.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">установка, сверка дайджеста</tspan></text>
</g>
<!-- link phone -> host -->
<path d="M 635.8 90.9 C 622.3 104.5 607.1 119.3 592.8 132.4 C 588.1 136.7 583.2 141 578.2 145.3 L 577.3 146.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="phone" data-to="host" data-edge="e2"/>
<polygon points="572.8,150 583.3,146.9 577.4,140.1" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="620.8" y="124.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписанные действия и акты</tspan></text>
</g>
<!-- link release -> host -->
<path d="M 231.8 195.6 C 290.4 195.6 360.8 195.6 417.1 195.6 L 418.6 195.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="release" data-to="host" data-edge="e3"/>
<polygon points="424.6,195.6 414.6,191.1 414.6,200.1" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="246.6" y="164.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">метаданные, артефакты,</tspan></text>
<text x="246.6" y="184.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доказательства</tspan></text>
</g>
<!-- link host -> trustnode -->
<path d="M 611 195.6 C 650 195.6 695 195.6 733.2 195.6 L 734.2 195.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="trustnode" data-edge="e4"/>
<polygon points="740.2,195.6 730.2,191.1 730.2,200.1" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="625.4" y="184.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записи реестра</tspan></text>
</g>
<!-- link host -> carrier -->
<path d="M 424.5 231.7 C 407.1 239.7 389.5 248.8 373.8 258.8 C 357.4 269.2 341.1 282.7 327.1 295.5 L 326.1 296.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="carrier" data-edge="e5"/>
<polygon points="321.7,300.5 332.1,297 326,290.4" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="359.2" y="289.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сообщения станций</tspan></text>
</g>
<!-- link host -> codehost -->
<path d="M 517.8 241.2 C 517.8 257.9 517.8 276.6 517.8 293 L 517.8 294.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="codehost" data-edge="e6"/>
<polygon points="517.8,300.4 522.3,290.4 513.3,290.4" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="525.8" y="274.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">публикация и приземление</tspan></text>
</g>
<!-- link host -> providers -->
<path d="M 610.9 212.6 C 645.1 221.9 682.6 236.4 711.8 258.8 C 723.9 268.1 733.9 281.4 741.6 294.2 L 742.2 295.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="providers" data-edge="e7"/>
<polygon points="745.2,300.5 744.1,289.6 736.3,294.1" fill="#3a3f47"/>
<g class="label" data-edge="e7">
<text x="737.6" y="275.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">выход агентов через прокси</tspan></text>
</g>
</g>
</svg>
