<svg xmlns="http://www.w3.org/2000/svg" width="853.1" height="794.4" viewBox="0 0 853.1 794.4">
<title>Установка, часть 2: оператор, ключник, службы хоста и квалификация машины. Номера сообщений продолжают первую часть.</title>
