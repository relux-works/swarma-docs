<svg xmlns="http://www.w3.org/2000/svg" width="752.5" height="740.7" viewBox="0 0 752.5 740.7">
<title>После траты печати: проверяющий видит трату на своей ноде и закрывает доверенность в своём журнале, а получатель или арбитр отдельно проверяет ссылку на вердикт.</title>
<rect width="752.5" height="740.7" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(73.4 0)">
<line x1="0" y1="70.9" x2="0" y2="716.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="218" y1="90.4" x2="218" y2="716.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="357.2" y1="113.8" x2="357.2" y2="716.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="593.2" y1="70.9" x2="593.2" y2="716.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node verifier -->
<rect x="-73.4" y="0" width="146.8" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="verifier"/>
<text x="-57.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Проверяющий</tspan></text>
<text x="-41.5" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исполнитель</tspan></text>
<!-- node chain -->
<rect x="163.7" y="0" width="108.5" height="90.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="chain"/>
<text x="179.7" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Namecoin</tspan></text>
<text x="191.1" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">цепочка</tspan></text>
<text x="187.1" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и мемпул</tspan></text>
<!-- node reader -->
<rect x="304.3" y="0" width="105.8" height="113.8" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="reader"/>
<text x="321.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Читатель</tspan></text>
<text x="329.1" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ссылки</tspan></text>
<text x="320.5" y="78.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">получатель</tspan></text>
<text x="320.3" y="97.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">или арбитр</tspan></text>
<!-- node store -->
<rect x="531.2" y="0" width="123.8" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="store"/>
<text x="547.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хранилище</tspan></text>
<text x="559.1" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вердиктов</tspan></text>
<!-- message chain -> verifier -->
<path d="M 216 184.8 L 8 184.8" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="chain" data-to="verifier" data-edge="m0"/>
<polygon points="2,184.8 12,189.3 12,180.3" fill="#c8285f"/>
<rect x="42.5" y="137.8" width="132.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="55.5" cy="148.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="51.8" y="153.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="70.5" y="153.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">трата печати</tspan></text>
<text x="70.5" y="172.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">видна его ноде</tspan></text>
</g>
<!-- self verifier -->
<path d="M 2 199.8 L 32 199.8 L 32 287.8 L 9 287.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="verifier" data-to="verifier" data-edge="m1"/>
<polygon points="3,287.8 13,292.3 13,283.3" fill="#3a3f47"/>
<rect x="40" y="203.8" width="152" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="53" cy="214.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="49.3" y="219.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="68" y="219.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка: печать</tspan></text>
<text x="68" y="238.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">тратит выдавший;</tspan></text>
<text x="68" y="258.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">закрытие в своём</tspan></text>
<text x="68" y="277.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">журнале</tspan></text>
</g>
<!-- message chain -> reader -->
<path d="M 220 341.8 L 349.2 341.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="chain" data-to="reader" data-edge="m2"/>
<polygon points="355.2,341.8 345.2,337.3 345.2,346.3" fill="#3a3f47"/>
<rect x="234" y="294.8" width="107.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="247" cy="305.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="243.3" y="310.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="262" y="310.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">транзакция</tspan></text>
<text x="262" y="329.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">со ссылкой</tspan></text>
</g>
<!-- self reader -->
<path d="M 359.2 356.8 L 389.2 356.8 L 389.2 444.8 L 366.2 444.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="reader" data-to="reader" data-edge="m3"/>
<polygon points="360.2,444.8 370.2,449.3 370.2,440.3" fill="#3a3f47"/>
<rect x="397.2" y="360.8" width="159.6" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="410.2" cy="371.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="406.5" y="376.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="425.2" y="376.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенность и её</tspan></text>
<text x="425.2" y="395.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">печать; транзакция</tspan></text>
<text x="425.2" y="415.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">тратит эту печать,</tspan></text>
<text x="425.2" y="434.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">тратит выдавший</tspan></text>
</g>
<!-- message reader -> store -->
<path d="M 359.2 498.8 L 585.2 498.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="reader" data-to="store" data-edge="m4"/>
<polygon points="591.2,498.8 581.2,494.3 581.2,503.3" fill="#3a3f47"/>
<rect x="407.8" y="451.8" width="134.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="420.8" cy="462.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="417.1" y="467.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="435.8" y="467.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">идентификатор</tspan></text>
<text x="435.8" y="486.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вердикта</tspan></text>
</g>
<!-- message store -> reader -->
<path d="M 591.2 556.8 L 365.2 556.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="store" data-to="reader" data-edge="m5"/>
<polygon points="359.2,556.8 369.2,561.3 369.2,552.3" fill="#3a3f47"/>
<rect x="410.2" y="509.8" width="130" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="423.2" cy="520.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="419.5" y="525.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="438.2" y="525" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вердикт</tspan></text>
<text x="438.2" y="544.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и предыдущие</tspan></text>
</g>
<!-- self reader -->
<path d="M 359.2 571.8 L 389.2 571.8 L 389.2 640.3 L 366.2 640.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="reader" data-to="reader" data-edge="m6"/>
<polygon points="360.2,640.3 370.2,644.8 370.2,635.8" fill="#3a3f47"/>
<rect x="397.2" y="575.8" width="169.9" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="410.2" cy="586.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="406.5" y="591.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="425.2" y="591" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">хэш вердикта, хэш</tspan></text>
<text x="425.2" y="610.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">прекращения, поля,</tspan></text>
<text x="425.2" y="630" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подпись модератора</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="647.3" width="713.2" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="90" y="672.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Закрытие от ссылки не зависит: шаги 1 и 2 идут без шагов с 3 по 7.</tspan></text>
<text x="121.6" y="690.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Если вердикт не получен, свидетельство не установлено.</tspan></text>
</g>
</g>
</svg>
