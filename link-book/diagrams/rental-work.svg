<svg xmlns="http://www.w3.org/2000/svg" width="860.8" height="875.5" viewBox="0 0 860.8 875.5">
<title>Работа в окне: шлюз проверяет доверенность на каждом сообщении, прокси модели считает расход, а трата печати или конец окна завершают слот.</title>
