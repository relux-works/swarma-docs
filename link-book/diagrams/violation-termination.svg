<path d="M 534.9 564.3 L 564.9 564.3 L 564.9 632.8 L 541.9 632.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="signer" data-to="signer" data-edge="m6"/>
<polygon points="535.9,632.8 545.9,637.3 545.9,628.3" fill="#3a3f47"/>
<rect x="572.9" y="568.3" width="117.8" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="585.9" cy="579" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="582.2" y="583.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="600.9" y="583.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сверка</tspan></text>
<text x="600.9" y="603" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с договором,</tspan></text>
<text x="600.9" y="622.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">журнал</tspan></text>
