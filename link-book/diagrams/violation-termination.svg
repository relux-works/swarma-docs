<svg xmlns="http://www.w3.org/2000/svg" width="862.6" height="824.7" viewBox="0 0 862.6 824.7">
<title>Прекращение по нарушению, от запроса до траты печати: модератор подписывает вердикт вне цепочки, подписант сверяет его с договором и тратит печать со ссылкой на вердикт.</title>
