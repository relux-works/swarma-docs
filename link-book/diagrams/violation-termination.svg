<text x="394.8" y="234.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="413.4" y="234.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ответ;</tspan></text>
<text x="413.4" y="253.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписанный</tspan></text>
<text x="413.4" y="273.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вердикт:</tspan></text>
<text x="413.4" y="292.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">хэш запроса,</tspan></text>
<text x="413.4" y="312.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">правило,</tspan></text>
<text x="413.4" y="331.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">хэш ответа</tspan></text>
</g>
<!-- message moderator -> service -->
<path d="M 343.4 376.4 L 174.7 376.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="moderator" data-to="service" data-edge="m3"/>
