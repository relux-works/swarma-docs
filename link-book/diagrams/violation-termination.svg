<text x="-30" y="408.7" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вердикт служит предупреждением</tspan></text>
<rect x="-36" y="490.6" width="193.8" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="504.9" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вердикт прекращает договор</tspan></text>
<!-- node recipient -->
<rect x="-61.9" y="0" width="123.8" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="recipient"/>
<text x="-45.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Получатель</tspan></text>
