<text x="307.5" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">модель или</tspan></text>
<text x="319" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">человек</tspan></text>
