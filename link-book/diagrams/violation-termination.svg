<!-- note -->
<rect x="285.4" y="731.3" width="491.2" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="376" y="756.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Запрос и ответ модератора остаются вне цепочки.</tspan></text>
<text x="336.6" y="774.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">В цепочке лежат хэш прекращения и идентификатор вердикта.</tspan></text>
</g>
</g>
