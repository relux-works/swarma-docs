<rect x="662.4" y="0" width="108.5" height="90.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="chain"/>
<text x="678.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Namecoin</tspan></text>
<text x="689.7" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">цепочка</tspan></text>
