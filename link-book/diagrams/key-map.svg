<svg xmlns="http://www.w3.org/2000/svg" width="471.5" height="685.5" viewBox="0 0 471.5 685.5">
<title>Карта ключей аренды: холодный ключ владеет именами, подписант держит ключ доверенностей, шлюз держит ключ сообщений агента, у арендатора свой ключ.</title>
<rect width="471.5" height="685.5" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(45.5 0)">
<!-- group cold -->
<rect x="0" y="0" width="356.5" height="123" rx="16" fill="none" stroke="#a8740a" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="cold"/>
<!-- group signer -->
<rect x="0" y="173" width="356.5" height="142.5" rx="16" fill="none" stroke="#a8740a" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="signer"/>
<!-- group gateway -->
<rect x="0" y="365.5" width="356.5" height="123" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="gateway"/>
<!-- group renter -->
<rect x="0" y="538.5" width="356.5" height="123" rx="16" fill="none" stroke="#d9690f" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="renter"/>
<!-- node owner -->
<rect x="18" y="37.7" width="320.5" height="70.9" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="owner"/>
<text x="90.1" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ владельца имён</tspan></text>
<text x="50.8" y="92.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">обновляет и передаёт имена</tspan><tspan x="244.5" font-family="PT Mono, monospace">id/</tspan><tspan x="275.5" font-family="PT Sans, sans-serif">и</tspan><tspan x="287.7" font-family="PT Mono, monospace">d/</tspan></text>
<!-- node grantkey -->
<rect x="18" y="210.7" width="320.5" height="90.4" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="grantkey"/>
<text x="94.5" y="236.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ доверенностей</tspan></text>
<text x="34" y="265.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписывает доверенности и хэш договора</tspan></text>
<text x="133.1" y="284.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">тратит печати</tspan></text>
<!-- node agentkey -->
<rect x="18" y="403.2" width="320.5" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agentkey"/>
<text x="82.2" y="429.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ сообщений агента</tspan></text>
<text x="92.2" y="457.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">личные сообщения агента</tspan></text>
<!-- node renterkey -->
<rect x="18" y="576.2" width="320.5" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="renterkey"/>
<text x="108.4" y="602.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ключ арендатора</tspan></text>
<text x="78.3" y="630.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">согласие, сообщения, запросы</tspan></text>
<!-- link owner -> grantkey -->
<path d="M 178.2 108.6 L 178.2 204.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="owner" data-to="grantkey" data-edge="e0"/>
<polygon points="178.2,210.7 182.7,200.7 173.7,200.7" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="190.2" y="152.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записан в имени арендодателя</tspan></text>
</g>
<!-- side link grantkey -> renterkey -->
<path d="M 338.5 255.9 L 374.5 255.9 L 374.5 611.7 L 344.5 611.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="grantkey" data-to="renterkey" data-edge="e2"/>
<polygon points="338.5,611.7 348.5,616.2 348.5,607.2" fill="#3a3f47"/>
<g transform="translate(402 523.7) rotate(-90)" class="label" data-edge="e2">
<text x="0" y="-5.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенность на этот ключ</tspan></text>
</g>
<!-- side link owner -> agentkey -->
<path d="M 18 73.2 L -18 73.2 L -18 438.6 L 12 438.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="owner" data-to="agentkey" data-edge="e1"/>
<polygon points="18,438.6 8,434.1 8,443.1" fill="#3a3f47"/>
<g transform="translate(-26 333.7) rotate(-90)" class="label" data-edge="e1">
<text x="0" y="-5.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записан в имени агента</tspan></text>
</g>
<!-- group label cold -->
<rect x="12" y="10" width="177.9" height="18.9" fill="#ffffff" class="plate"/>
<text x="18" y="24.4" font-size="13" fill="#8f6208" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ХОЛОДНОЕ ХРАНЕНИЕ</tspan></text>
<!-- group label signer -->
<rect x="12" y="183" width="102.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="18" y="197.3" font-size="13" fill="#8f6208" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ПОДПИСАНТ</tspan></text>
<!-- group label gateway -->
<rect x="12" y="375.5" width="56" height="18.9" fill="#ffffff" class="plate"/>
<text x="18" y="389.9" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ШЛЮЗ</tspan></text>
<!-- group label renter -->
<rect x="12" y="548.5" width="213.6" height="18.9" fill="#ffffff" class="plate"/>
<text x="18" y="562.9" font-size="13" fill="#b9580b" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">УСТРОЙСТВО АРЕНДАТОРА</tspan></text>
</g>
</g>
</svg>
