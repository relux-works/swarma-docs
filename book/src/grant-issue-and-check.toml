# Former source: grant-issue-and-check.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Grants: issue, narrowing and check. Content follows grant-issue-and-check.puml;
# a branch keeps the number of the step it replaces. The line break in step 3
# follows the source; the note keeps only the mechanism (the delivery status
# lives in the status chapter). Step 2 has an agent sign a child grant, which
# only the broker v0 contract allows (chapter "Доверенности и полномочия": the
# parent orchestrator signs the new one's caller grant; in the general grant
# language an agent key is never the issuer of a link), so the note scopes the
# figure with those two mechanism sentences.
layout = "sequence"
alt = "Цепочка доверенностей: передать можно только часть прав, а проверяет её исполнитель действия."

[theme.space]
seq_row_gap = 6

[nodes.owner]
role = "human"
name = "Владелец"

[nodes.orch]
role = "agent"
name = "Оркестратор"

[nodes.registry]
role = "store"
name = "Реестр доверенностей и отзывов"

[nodes.executor]
role = "service"
name = "Исполнитель действия"

[[seq]]
from = "owner"
to = "registry"
step = 1
label = "подписанная доверенность оркестратору"

[[seq]]
from = "orch"
to = "registry"
step = 2
label = "подписанная дочерняя доверенность"

[[seq]]
from = "registry"
to = "registry"
step = 3
label = "цепочка до корня; действия и цели: подмножество;\nсрок не длиннее; глубина в пределах"

[[seq]]
alt = "дочерняя доверенность шире родительской"

[[seq]]
from = "registry"
to = "orch"
step = 4
label = "отказ"
color = "alert"

[[seq]]
else = "только ослабление"

[[seq]]
from = "registry"
to = "registry"
step = 4
label = "сохранить цепочку"

[[seq]]
end = true

[[seq]]
from = "orch"
to = "executor"
step = 5
label = "запрос действия с основаниями"

[[seq]]
from = "executor"
to = "registry"
step = 6
label = "подписи, условия, сроки, актуальный отзыв"

[[seq]]
alt = "право подтверждено"

[[seq]]
from = "executor"
to = "executor"
step = 7
label = "выполнить в пределах права"

[[seq]]
else = "право не подтверждено"

[[seq]]
from = "executor"
to = "orch"
step = 7
label = "отказ"
color = "alert"

[[seq]]
end = true

[[seq]]
note = "Дочернюю доверенность оркестратор подписывает по контракту брокера v0;\nв общем языке доверенностей ключ агента издателем звена не бывает.\nВызывающий не выносит вердикт о своём запросе."
over = ["orch", "executor"]
