# Former source: credential-lease-revocation.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Broker: lease and revocation, part 1 of 3: who talks to the broker. Content
# follows credential-lease-revocation.puml and chapter "Учётные данные и
# логины". The whole sequence has six participants and is 985 x 1267 px
# (4.9 pt in the tall box); six participants stay wider than 880 px even with
# the density keys, so the flow is split into three parts by phase (the
# source has no divider; each caption names its part). Step numbers stay those
# of the whole flow.
# Step 3 depends on the credential mode (chapter "Учётные данные и логины"):
# with a readable token the executor under the agent UID asks for the lease;
# in the secret-free mode the credential-spending service (credential gateway
# or action service) asks under its own account. Both branches keep step 3.
layout = "sequence"
alt = "Брокер, подключение: оператор подключает подписку, диспетчер привязывает поколение; аренду просит исполнитель под UID агента в режиме с читаемым токеном или служба под своей учёткой в режиме без секретов у агента."

[theme.space]
seq_node_width = 130
seq_label_width = 200
seq_self_width = 170
seq_column_gap = 16
seq_row_gap = 8

[nodes.operator]
role = "human"
name = "Оператор"

[nodes.dispatcher]
role = "service"
name = "Диспетчер"

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.broker]
role = "service"
name = "Брокер"

[nodes.holder]
role = "service"
name = "Шлюз или служба действий"

[[seq]]
from = "operator"
to = "broker"
step = 1
label = "подключить подписку с подтверждением действия"

[[seq]]
from = "dispatcher"
to = "broker"
step = 2
label = "привязать поколение в пределах цепочек прав"

[[seq]]
alt = "режим с читаемым токеном"

[[seq]]
from = "executor"
to = "broker"
step = 3
label = "собственное соединение после смены UID; аренда"

[[seq]]
else = "режим без секретов у агента"

[[seq]]
from = "holder"
to = "broker"
step = 3
label = "служебная аренда; службу опознаёт ядро ОС"

[[seq]]
end = true
