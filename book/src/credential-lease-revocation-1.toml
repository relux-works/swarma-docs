# Broker: lease and revocation, part 1 of 3: who talks to the broker. Content
# follows credential-lease-revocation.puml and chapter "Учётные данные и
# логины". The whole sequence has six participants and is 985 x 1267 px
# (4.9 pt in the tall box); six participants stay wider than 880 px even with
# the density keys, so the flow is split into three parts by phase (the
# source has no divider; each caption names its part). Step numbers stay those
# of the whole flow.
layout = "sequence"
alt = "Брокер, подключение: оператор подключает подписку, диспетчер привязывает поколение, исполнитель под UID агента просит аренду по собственному соединению."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[nodes.operator]
role = "human"
name = "Оператор"

[nodes.dispatcher]
role = "service"
name = "Диспетчер"

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.broker]
role = "service"
name = "Брокер"

[[seq]]
from = "operator"
to = "broker"
step = 1
label = "подключить подписку с подтверждением действия"

[[seq]]
from = "dispatcher"
to = "broker"
step = 2
label = "привязать поколение в пределах цепочек прав"

[[seq]]
from = "executor"
to = "broker"
step = 3
label = "собственное соединение после смены UID; аренда"
