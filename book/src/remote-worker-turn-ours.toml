# A remote worker's turn, part 2 of 2: our side from the SSH entry onward.
# Split from the whole turn (fixtures/remote-worker-turn-full) along the container boundary; step numbers
# stay those of the whole turn. Density keys from editorial/diagram-style.ru.md.

layout = "sequence"
alt = "Удалённый ход, сторона проекта: вход слота проверяет доверенность, исполнитель работает в границах слота."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[groups.ours]
label = "Сторона проекта"
role = "service"

[nodes.ssh]
group = "ours"
role = "service"
name = "Вход слота и проверка доверенности"

[nodes.executor]
group = "ours"
role = "service"
name = "Исполнитель"

[nodes.workspace]
group = "ours"
role = "neutral"
name = "Слот"

[nodes.mailbox]
group = "ours"
role = "store"
name = "Почтовый ящик"

[[seq]]
from = "ssh"
to = "ssh"
step = 5
label = "проверить доверенность и привязку слота"

[[seq]]
from = "ssh"
to = "executor"
step = 6
label = "допущенный запрос"

[[seq]]
from = "executor"
to = "workspace"
step = 7
label = "команда в границах слота"

[[seq]]
from = "workspace"
to = "executor"
step = 8
label = "вывод"

[[seq]]
from = "executor"
to = "ssh"
step = 9
label = "результат"

[[seq]]
from = "ssh"
to = "mailbox"
step = 14
label = "почтовый обмен"
