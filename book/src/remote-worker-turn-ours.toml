# A remote worker's turn, part 2 of 2: our side from the SSH entry onward.
# Split from the whole turn (fixtures/remote-worker-turn-full) along the container boundary; step numbers
# stay those of the whole turn. Density keys from editorial/diagram-style.ru.md.

layout = "sequence"
alt = "Удалённый ход, сторона проекта: вход SSH проверяет допуск, служебный исполнитель работает вне учётной записи слота, команду исполняет процесс под этой учётной записью."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[groups.ours]
label = "Сторона проекта"
role = "service"

[nodes.ssh]
group = "ours"
role = "service"
name = "Вход SSH и проверка допуска"

[nodes.executor]
group = "ours"
role = "service"
name = "Служебный исполнитель"

[nodes.command]
group = "ours"
role = "neutral"
name = "Процесс команды"
text = "под учётной записью слота"

[nodes.mailbox]
group = "ours"
role = "store"
name = "Почтовый ящик"

[[seq]]
from = "ssh"
to = "ssh"
step = 5
label = "проверить допуск и привязку слота"

[[seq]]
from = "ssh"
to = "executor"
step = 6
label = "допущенный запрос"

[[seq]]
from = "executor"
to = "command"
step = 7
label = "команда"

[[seq]]
from = "command"
to = "executor"
step = 8
label = "вывод"

[[seq]]
from = "executor"
to = "ssh"
step = 9
label = "результат"

[[seq]]
from = "ssh"
to = "mailbox"
step = 14
label = "почтовый обмен"
