# Chapter "Система и её описания", section "Описания". Typed replacement for
# the former three-layers figure. Two groups, each of one stated kind with the
# full member list of the chapter's tables: sets of descriptions on the left,
# systems in operation on the right. A link reads "the system is built to this
# set of descriptions"; it follows the column "Какие системы построены по нему"
# of the descriptions table. Nothing is drawn as a layer that contains things.
layout = "graph"
direction = "LR"
alt = "Системы и их описания: каждая система в работе построена по своим наборам описаний, и ни одно описание не входит в состав системы."

[groups.desc]
label = "Наборы описаний"
role = "neutral"

[groups.sys]
label = "Системы в работе"
role = "service"

