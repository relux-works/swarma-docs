# Former source: sublayers.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Swarma Chain sublayers: the chain orders records, p2p memory carries the
# content, the social graph steers its spread. Content follows sublayers.puml
# and the section "Три подслоя с разными обязательствами" of chapter
# "Цепочка: устройство". Each sublayer is a container: its border is the
# border of an obligation (consensus, no storage guarantee, steering). The
# container roles follow who controls the zone: the chain is a store, the
# social graph is run by participants' programs, p2p memory is outside any
# one owner's control. The guide names a sublayer with its own obligations
# a boundary; history-holders, a list of holders without a common boundary,
# has none.
layout = "graph"
direction = "TB"
same_rank = [["cons", "soc"], ["indexer", "curator"]]
splines = "polyline"
alt = "Цепочка упорядочивает записи, p2p-память переносит контент, а социальный граф направляет его распространение."

[groups.chain]
label = "Цепочка"
role = "store"

[groups.graph]
label = "Социальный граф"
role = "service"

[groups.p2p]
label = "P2P-память"
role = "external"

[nodes.author]
role = "human"
name = "Автор"

[nodes.cons]
group = "chain"
role = "store"
name = "Деньги, имена и личности"
text = "консенсус"

[nodes.soc]
group = "chain"
role = "store"
name = "Социальные записи, аттестации, указатели"
text = "конверт: тип, подпись пачки, оплата"

[nodes.indexer]
group = "graph"
role = "service"
name = "Индексаторы"
text = "граф, ленты, поиск и веса"

[nodes.curator]
group = "graph"
role = "service"
name = "Кураторы и архивисты"
text = "выбор и хранение"

[nodes.p2p]
group = "p2p"
role = "external"
name = "Трекеры и рои раздачи"
text = "тяжёлый контент вне цепочки"
note = "Принятый указатель не гарантирует сохранности файла."

[nodes.reader]
role = "human"
name = "Читатель"

[[links]]
from = "author"
to = "soc"
label = "подписанный указатель"

[[links]]
from = "author"
to = "p2p"
label = "раздача файла"

[[links]]
from = "soc"
to = "indexer"
label = "порядок записей"

[[links]]
from = "indexer"
to = "reader"
label = "лента"

[[links]]
from = "indexer"
to = "curator"
label = "поток и окрестность"

[[links]]
from = "curator"
to = "soc"
label = "категоризации"
constraint = false

[[links]]
from = "curator"
to = "p2p"
label = "раздача выбранного"

[[links]]
from = "reader"
to = "p2p"
label = "скачать и раздавать"
