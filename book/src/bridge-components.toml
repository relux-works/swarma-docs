# Former source: bridge-components.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Bridge components: the carrier provider, trust gates, mailbox and session
# host split the work. Content follows bridge-components.puml; the store's
# description follows the chapter table ("Хранилище": admission records,
# outbox and audit), where the puml said "очереди и аудит".
# Credential custody follows the chapter: the messaging service holds only its
# own carrier credentials; raw leased values never reach the bridge, and it
# matches against them only through a separately approved matching boundary.
# No such boundary is selected, so none is drawn. The custody rule lives in
# the caption: the provider's description keeps to two lines, and a note on a
# node displaces this graph's layout and breaks the fit.
layout = "graph"
direction = "TB"
same_rank = [["mx", "provider"], ["core", "store"], ["mailbox", "host"]]
uniform_width = true   # the main column and the side column each keep one width
alt = "Мост: провайдер носителя, ворота доверия, почтовый ящик и хост сессий разделяют обязанности; служба сообщений держит только учётные данные носителя, а сырых значений арендованных учётных данных мост не получает."

[groups.bridge]
label = "Мост"
role = "service"

[nodes.mx]
role = "external"
name = "Matrix"
text = "носитель"

[nodes.provider]
column = "main"
group = "bridge"
role = "service"
name = "Провайдер носителя"
text = "сохраняет событие до сдвига курсора"

[nodes.core]
column = "main"
group = "bridge"
role = "service"
name = "Ядро моста"
text = "привязки провайдеров к сессиям"

[nodes.gate]
column = "main"
group = "bridge"
role = "service"
name = "Ворота доверия"
text = "детерминированная проверка"

[nodes.guard]
column = "main"
group = "bridge"
role = "service"
name = "Decision guard"
text = "только сужение допуска"

[nodes.mailbox]
column = "main"
group = "bridge"
role = "store"
name = "Почтовый ящик"
text = "тела и записи проверки"

[nodes.store]
group = "bridge"
role = "store"
name = "Хранилище"
text = "записи допуска, исходящие и аудит"

[nodes.host]
column = "side"
role = "service"
name = "Хост сессий"
text = "единственный ввод"

[nodes.agent]
column = "side"
role = "agent"
name = "Агент"
text = "читает тело инструментом"

[[links]]
from = "mx"
to = "provider"
step = 1

[[links]]
from = "provider"
to = "core"
step = 2

[[links]]
from = "core"
to = "gate"
step = 3

[[links]]
from = "gate"
to = "guard"
step = 4
label = "допущенное"

[[links]]
from = "guard"
to = "mailbox"
step = 5
label = "если разрешена доставка"

[[links]]
from = "mailbox"
to = "host"
step = 6
label = "звонок без тела"

[[links]]
from = "host"
to = "agent"
step = 7
label = "уведомление на границе хода"

[[links]]
from = "agent"
to = "mailbox"
step = 8
label = "чтение"
constraint = false

[[links]]
from = "core"
to = "store"

[[links]]
from = "mailbox"
to = "store"
