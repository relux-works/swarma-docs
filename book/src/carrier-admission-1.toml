# Carrier admission, part 1 of 2: on the agent's machine. Content follows
# carrier-admission.puml (steps 1-3) and the chapter "Допуск к носителю".
# Split from the whole sequence along the machine container; the agent is in
# both parts and step numbers stay those of the whole sequence.
layout = "sequence"
alt = "Допуск к носителю на машине агента: помощник подписывает запрос ключом машины, а сам ключ агенту не виден."

[groups.machine]
label = "Машина агента"
role = "key"

[nodes.agent]
group = "machine"
role = "agent"
name = "Агент"

[nodes.helper]
group = "machine"
role = "key"
name = "Помощник"
text = "ключ машины"

[[seq]]
from = "agent"
to = "helper"
step = 1
label = "подпиши запрос на допуск имени `host-a_project_orch`"

[[seq]]
from = "helper"
to = "helper"
step = 2
label = "UID от ядра; имя разрешено этой машине и этому UID"

[[seq]]
from = "helper"
to = "agent"
step = 3
label = "подписанный запрос; ключ агенту не виден"
