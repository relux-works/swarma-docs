# Swarma Protocol: the chain of authority. Content follows authority-ladder.puml
# and chapter "Контракт задачи и правила валидаторов". The chapter's terms win:
# "дифф внутри области записи задачи" for "Диф внутри write scope", "дайджест"
# for "digest", and "декомпозирует полномочия и не создаёт их".
layout = "stack"
alt = "Цепочка полномочий: цель ограничивает оркестратора, задача ограничивает исполнение, ревизия остаётся внутри области записи."

[nodes.goal]
role = "service"
name = "Цель"
text = "подписана кор-нодой; область, класс риска и бюджет"

[nodes.cap]
role = "agent"
name = "Полномочие оркестратора"
text = "пути, типы изменений и лимиты"
note = "Оркестратор декомпозирует полномочия и не создаёт их."

[nodes.task]
role = "service"
name = "Задача"
text = "контракт с версией и план с дайджестом"
note = "Валидаторы проверяют вложенность при переходах. Среда сверяет дайджест плана при вызовах."

[nodes.rev]
role = "agent"
name = "Ревизия и кандидат"
text = "дифф внутри области записи задачи"

[[links]]
from = "goal"
to = "cap"
label = "только сужение"

[[links]]
from = "cap"
to = "task"
label = "только сужение"

[[links]]
from = "task"
to = "rev"
label = "только сужение"
