# Former source: credential-lease-revocation.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Broker: lease and revocation, part 3 of 3: renewal and revocation. Content
# follows credential-lease-revocation.puml and chapter "Учётные данные и
# логины"; split by phase (see part 1), step numbers stay those of the whole
# flow. Of the source note's second sentence the status half ("Брокер не
# реализован") is dropped (book voice: status lives in the state chapter);
# the qualification half stays as a gate in the chapter's words ("Брокерный
# путь квалифицируют отдельно для каждого канала"), as in
# remote-worker-turn-donor.
# Renewal splits by credential mode like the lease in part 1 (both branches
# keep step 7). In the secret-free mode revocation also stops use: the service
# checks current authority at every use and closes its queue and streams with
# a closure record (step 11). The note keeps the revocation limit and that
# revocation does not invalidate the token at the provider; the chapter's
# revocation paragraph names that as a separate containment state.
layout = "sequence"
alt = "Брокер, продление и отзыв: продление повторяет проверки, отзыв прекращает следующие выдачи, а в режиме без секретов у агента и использование у службы; уже переданные байты он не извлекает, а токен у провайдера не аннулирует."

[theme.space]
seq_node_width = 120
seq_label_width = 160
seq_self_width = 140
seq_column_gap = 12
seq_row_gap = 8

[nodes.operator]
role = "human"
name = "Оператор"

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.holder]
role = "service"
name = "Шлюз или служба действий"

[nodes.broker]
role = "service"
name = "Брокер"

[nodes.registry]
role = "store"
name = "Поколения, привязки, гранты и отзывы"

[[seq]]
alt = "режим с читаемым токеном"

[[seq]]
from = "executor"
to = "broker"
step = 7
label = "продлить аренду"

[[seq]]
else = "режим без секретов у агента"

[[seq]]
from = "holder"
to = "broker"
step = 7
label = "продлить служебную аренду"

[[seq]]
end = true

[[seq]]
from = "broker"
to = "registry"
step = 8
label = "повторить проверки"

[[seq]]
from = "operator"
to = "broker"
step = 9
label = "отозвать грант или привязку"

[[seq]]
from = "broker"
to = "broker"
step = 10
label = "прекратить следующие выдачи и продления"

[[seq]]
opt = "режим без секретов у агента"

[[seq]]
from = "holder"
to = "holder"
step = 11
label = "отказ на использовании; закрыть очередь и потоки"
color = "alert"

[[seq]]
end = true

[[seq]]
note = "Отзыв не извлекает уже переданные байты и не аннулирует токен у провайдера.\nБрокерный путь квалифицируют отдельно для каждого канала."
over = ["operator", "registry"]
