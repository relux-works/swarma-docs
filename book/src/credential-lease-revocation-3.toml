# Broker: lease and revocation, part 3 of 3: renewal and revocation. Content
# follows credential-lease-revocation.puml and chapter "Учётные данные и
# логины"; split by phase (see part 1), step numbers stay those of the whole
# flow. The delivery-status sentence of the source's note is dropped (book
# voice: status lives in the state chapter).
layout = "sequence"
alt = "Брокер, продление и отзыв: продление повторяет проверки, отзыв прекращает следующие выдачи, но не извлекает уже переданные байты."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[nodes.operator]
role = "human"
name = "Оператор"

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.broker]
role = "service"
name = "Брокер"

[nodes.registry]
role = "store"
name = "Поколения, привязки, гранты и отзывы"

[nodes.harness]
role = "agent"
name = "Харнес"

[[seq]]
from = "executor"
to = "broker"
step = 7
label = "продлить аренду"

[[seq]]
from = "broker"
to = "registry"
step = 8
label = "повторить проверки"

[[seq]]
from = "operator"
to = "broker"
step = 9
label = "отозвать грант или привязку"

[[seq]]
from = "broker"
to = "broker"
step = 10
label = "прекратить следующие выдачи и продления"

[[seq]]
note = "Отзыв выдачи не извлекает уже переданные байты из процесса."
over = ["executor", "harness"]
