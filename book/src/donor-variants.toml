# Former source: donor-variants.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Donor machine deployment variants. Content follows donor-variants.puml and
# the variant table of chapter "Удалённое рабочее место"; the variant names
# (locked launch, two accounts, sandbox) come from the chapter, which wins.
# Variants are deployment options (role neutral); the model provider is
# external, the project side is ours. Three variants to two targets cannot be
# drawn without crossings, so each egress label names its variant letter.
# The variants are declared B, A, C: with that input order Graphviz stacks
# them A, B, C from the top, the reading order of the chapter's table.
# Credential custody follows the chapter's secret-free paragraph: in B the
# donor's credential holder runs under another UID than the harness, in C it
# stays outside the harness sandbox, A is outside the mode's guarantee. The
# note on the provider names the routing-only case: with a readable token the
# B and C proxy only constrains the route and the harness still gets the
# donor's token.
layout = "graph"
direction = "LR"
same_rank = [["a", "b", "c"], ["provider", "project"]]

alt = "Варианты развёртывания донора: без разделения UID, с отдельными учётками и с песочницей; у каждого своя граница защиты."

[theme.space]
graph_ranksep = 1.6

[nodes.b]
role = "neutral"
name = "B: две учётные записи"
text = "мост под служебным UID, харнес под рабочим, держатель учётных данных под другим UID, чем харнес; файрвол и граница чтения по UID; нужна привилегированная подготовка"

[nodes.a]
role = "neutral"
name = "A: запертый запуск"
text = "без административной установки; один UID донора, границы ОС нет; вне гарантии режима без секретов у агента"

[nodes.c]
role = "neutral"
name = "C: песочница"
text = "без администратора; один UID, харнес в песочнице ОС, держатель учётных данных за её пределами; граница квалифицируется на каждой платформе"

[nodes.provider]
role = "external"
name = "Провайдер модели"
note = "В режиме с читаемым токеном прокси B и C задаёт только маршрут: харнес получает токен донора."

[nodes.project]
role = "service"
name = "Проектная сторона"
text = "изолированное рабочее место; принудительная сеть и квалификация"
note = "Варианты не заменяют квалификацию проектного рабочего места. Неизвестное покрытие границы не считается допуском."

[[links]]
from = "a"
to = "provider"
label = "A: нет гарантии закрытого egress ОС"

[[links]]
from = "b"
to = "provider"
label = "B: только допущенный прокси"

[[links]]
from = "c"
to = "provider"
label = "C: квалифицированный прокси"

[[links]]
from = "a"
to = "project"
label = "SSH от донора"

[[links]]
from = "b"
to = "project"
label = "SSH от донора"

[[links]]
from = "c"
to = "project"
label = "SSH от донора"
