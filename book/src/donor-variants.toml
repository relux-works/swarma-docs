# Former source: donor-variants.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Donor machine deployment variants. Content follows donor-variants.puml and
# the variant table of chapter "Удалённое рабочее место"; the variant names
# (locked launch, two accounts, sandbox) come from the chapter, which wins.
# Variants are deployment options (role neutral); the model provider is
# external, the project side is ours. Three variants to two targets cannot be
# drawn without crossings, so each egress label names its variant letter.
# The variants are declared B, A, C: with that input order Graphviz stacks
# them A, B, C from the top, the reading order of the chapter's table.
# Credential custody follows the chapter's secret-free paragraph: in B the
# bridge and the donor's credential holder run under other UIDs than the
# harness, in C the holder stays outside the harness sandbox. Descriptions keep
# to two lines, so the rest moves out: A being outside the mode's guarantee and
# C's per-platform boundary qualification go to the caption; administrator
# rights, the UID firewall and read boundary stay in the chapter's variant
# table. The note on the provider names the routing-only case: with a readable
# token the B and C proxy only constrains the route and the harness still gets
# the donor's token.
layout = "graph"
direction = "LR"
same_rank = [["a", "b", "c"], ["provider", "project"]]

alt = "Варианты развёртывания донора: без разделения UID, с отдельными учётками и с песочницей; у каждого своя граница защиты, вариант A вне гарантии режима без секретов у агента, а границу C квалифицируют на каждой платформе."

[theme.space]
graph_ranksep = 1.6

[nodes.b]
role = "neutral"
name = "B: две учётные записи"
text = "мост и держатель учётных данных\nне под UID харнеса"

[nodes.a]
role = "neutral"
name = "A: запертый запуск"
text = "без администратора; один UID,\nграницы ОС нет"

[nodes.c]
role = "neutral"
name = "C: песочница"
text = "харнес в песочнице ОС, держатель\nучётных данных вне её"

[nodes.provider]
role = "external"
name = "Провайдер модели"
note = "В режиме с читаемым токеном прокси B и C задаёт только маршрут: харнес получает токен донора."

[nodes.project]
role = "service"
name = "Проектная сторона"
text = "изолированное рабочее место; принудительная сеть и квалификация"
note = "Варианты не заменяют квалификацию проектного рабочего места. Неизвестное покрытие границы не считается допуском."

[[links]]
from = "a"
to = "provider"
label = "A: нет гарантии закрытого egress ОС"

[[links]]
from = "b"
to = "provider"
label = "B: только допущенный прокси"

[[links]]
from = "c"
to = "provider"
label = "C: квалифицированный прокси"

[[links]]
from = "a"
to = "project"
label = "SSH от донора"

[[links]]
from = "b"
to = "project"
label = "SSH от донора"

[[links]]
from = "c"
to = "project"
label = "SSH от донора"
