# Publication, part 1 of 2: working memory. Split from publish-flow-v2 at its
# second divider; step numbers stay those of the whole flow.

layout = "sequence"
alt = "Публикация, рабочая память: указатель идёт в цепочку, кураторы находят и скачивают файл."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[nodes.author]
role = "human"
name = "Автор в браузере"

[nodes.tracker]
role = "external"
name = "Трекер"

[nodes.chain]
role = "store"
name = "Swarma Chain"

[nodes.indexer]
role = "service"
name = "Индексатор"

[nodes.curator]
role = "service"
name = "Куратор"

[[seq]]
divider = "Рабочая память"

[[seq]]
from = "author"
to = "tracker"
step = 1
label = "анонс торрента"

[[seq]]
from = "author"
to = "chain"
step = 2
label = "подписанный указатель с тегами"

[[seq]]
from = "chain"
to = "indexer"
step = 3
label = "запись в блоке"

[[seq]]
from = "indexer"
to = "curator"
step = 4
label = "указатель в потоке"

[[seq]]
from = "curator"
to = "tracker"
step = 5
label = "найти пиров"

[[seq]]
from = "curator"
to = "author"
step = 6
label = "скачать контент"
