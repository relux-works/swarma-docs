# A remote worker's turn, part 1 of 2: the donor's side up to our SSH entry.
# Split from the whole turn (fixtures/remote-worker-turn-full) along the container boundary; step numbers
# stay those of the whole turn. Density keys from editorial/diagram-style.ru.md.
# Two notes of two sentences each: the path limits, then credential custody
# from the donor paragraph of chapter "Удалённое рабочее место": donor
# credentials and their holder stay with the donor, outside the harness
# boundary in B and C; with a readable token the harness gets the donor's
# token. A row gap of 8 keeps the extra note inside the tall box.

layout = "sequence"
alt = "Удалённый ход, сторона донора: запрос инструмента, результат и почта идут по одному исходящему SSH-соединению донора."

[theme.space]
seq_node_width = 130
seq_label_width = 150
seq_self_width = 170
seq_column_gap = 20
seq_row_gap = 8

[groups.donor]
label = "Машина донора"
role = "external"

[groups.ours]
label = "Сторона проекта"
role = "service"

[nodes.harness]
group = "donor"
role = "agent"
name = "Харнес и модель"

[nodes.relay]
group = "donor"
role = "service"
name = "Реле инструментов"

[nodes.bridge]
group = "donor"
role = "service"
name = "Мост донора"

[nodes.ssh]
group = "ours"
role = "service"
name = "Вход SSH и проверка допуска"

[[seq]]
from = "bridge"
to = "ssh"
step = 1
label = "одно исходящее SSH-соединение донора"

[[seq]]
from = "harness"
to = "relay"
step = 2
label = "запрос инструмента"

[[seq]]
from = "relay"
to = "bridge"
step = 3
label = "передать запрос без локального исполнения"

[[seq]]
from = "bridge"
to = "ssh"
step = 4
label = "команда по тому же соединению"

[[seq]]
from = "ssh"
to = "bridge"
step = 10
label = "результат по тому же соединению"

[[seq]]
from = "bridge"
to = "relay"
step = 11
label = "результат"

[[seq]]
from = "relay"
to = "harness"
step = 12
label = "вывод инструмента"

[[seq]]
from = "bridge"
to = "ssh"
step = 13
label = "почта по тому же соединению"

[[seq]]
note = "На доноре нет локальных инструментов харнеса, а наша сторона не подключается к донору обратно. Сквозной путь требует квалификации обеих сторон."
over = ["harness", "ssh"]

[[seq]]
note = "Учётные данные провайдера и их держатель остаются у донора. В режиме без секретов у агента держатель в B и C стоит вне квалифицированной границы харнеса, а в режиме с читаемым токеном харнес получает токен донора."
over = ["harness", "ssh"]
