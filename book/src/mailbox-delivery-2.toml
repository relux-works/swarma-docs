# Mail delivery, part 2 of 2: the decision guard, the queue and delivery.
# Content follows the chapter "Путь сообщения и мост". It opens where part 1
# ends: the gates hand the body to the decision guard, unsigned or admitted.
# A refusing or unavailable guard closes delivery for both. Only inside the
# "guard разрешил" branch does the mailbox ring the session host: one bell
# without the body, which for an unsigned body carries metadata only.
# It keeps the whole sequence's step numbers. Peer mail stays data and grants
# no authority for an effect.
layout = "sequence"
alt = "Доставка почты: после входящего конвейера guard звонок без тела о допущенной почте и звонок только с метаданными о неподписанной идут через одну очередь, а тело агент забирает из ящика инструментом."

[theme.space]
seq_node_width = 104
seq_label_width = 150
seq_self_width = 150
seq_column_gap = 10
seq_row_gap = 4

[nodes.gate]
role = "service"
name = "Ворота доверия"

[nodes.guard]
role = "service"
name = "Decision guard"

[nodes.mailbox]
role = "store"
name = "Почтовый ящик"

[nodes.host]
role = "service"
name = "Хост сессий"

[nodes.agent]
role = "agent"
name = "Агент"

[[seq]]
from = "gate"
to = "guard"
step = 4
label = "тело: неподписанное или допущенное"

[[seq]]
alt = "guard недоступен или отказал"

[[seq]]
from = "guard"
to = "mailbox"
step = 5
label = "отказ;\nзвонка нет"
color = "alert"

[[seq]]
else = "guard разрешил"

[[seq]]
from = "guard"
to = "mailbox"
step = 5
label = "тело и вердикт"

[[seq]]
from = "mailbox"
to = "host"
step = 6
label = "звонок без тела;\nбез подписи:\nтолько метаданные"

[[seq]]
end = true

[[seq]]
opt = "звонок поставлен в очередь"

[[seq]]
from = "host"
to = "host"
step = 7
label = "долговечная очередь; повторный допуск перед доставкой, открытый забор"

[[seq]]
from = "host"
to = "agent"
step = 8
label = "звонок на границе хода"

[[seq]]
from = "agent"
to = "mailbox"
step = 9
label = "забрать тело инструментом"

[[seq]]
end = true

[[seq]]
note = "Почта от другого агента остаётся данными и полномочия на эффект не даёт.\nТипизированное действие оператора требует отдельного допуска."
over = ["mailbox", "agent"]
