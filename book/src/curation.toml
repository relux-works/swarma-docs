# Curation: curator levels, labelers and the archivist's neighbourhood.
# Content follows curation.puml (formerly an upstream copy, now a book figure)
# and the sections "Граф решает, что помнит сеть" and "Окрестность архивиста"
# of chapter "Социальный слой, память сети и экономика". The note on the raw
# stream follows the chapter: labels and weights steer display and storage
# and do not remove a record from the chain. "вес =" became "вес:".
layout = "graph"
direction = "TB"
alt = "Оценки и метки направляют показ и окрестность хранения, не становясь правилами приёма цепочки."

[nodes.raw]
role = "store"
name = "Сырой поток указателей"
text = "всё, что принято цепочкой"
note = "Метки и веса направляют показ и хранение и не исключают записей из цепочки."

[nodes.k0]
role = "service"
name = "Куратор уровня 00"
text = "судит сырой поток, раздаёт одобренное"

[nodes.k1]
role = "service"
name = "Кураторы уровней 01, 10, 11 и выше"
text = "подписаны на теги и их сочетания, добавляют или снимают вес"

[nodes.labeler]
role = "service"
name = "Лейблеры по подписке"
text = "метки с пространствами имён: качество, 18+, спам, ИИ"

[nodes.client]
role = "service"
name = "Клиент читателя"
text = "вес: история куратора, расстояние в графе, подтверждения"

[nodes.archivist]
role = "service"
name = "Архивист"
text = "размерность 1D, 2D и дальше;\nтеги, минимальный вес, порог диска"

[[links]]
from = "raw"
to = "k0"

[[links]]
from = "k0"
to = "k1"
label = "категоризации"

[[links]]
from = "k1"
to = "client"

[[links]]
from = "labeler"
to = "client"
label = "скрыть, размыть, показать"

[[links]]
from = "k1"
to = "archivist"
label = "веса"

[[links]]
from = "client"
to = "archivist"
label = "отметки окрестности"
