# Former source: credential-lease-revocation.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Broker: lease and revocation, part 2 of 3: check and issue. Content follows
# credential-lease-revocation.puml and chapter "Учётные данные и логины";
# split by phase (see part 1), step numbers stay those of the whole flow. A
# branch keeps the number of the step it replaces.
layout = "sequence"
alt = "Брокер, выдача: аренду получает сторона агента после проверки поколения, привязки, грантов и отзывов."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 20

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.broker]
role = "service"
name = "Брокер"

[nodes.registry]
role = "store"
name = "Поколения, привязки, гранты и отзывы"

[nodes.harness]
role = "agent"
name = "Харнес"

[[seq]]
from = "broker"
to = "registry"
step = 4
label = "UID от ядра, активное поколение, привязка, права, отзывы и квалифицированный путь"

[[seq]]
alt = "проверка не пройдена или отзывы нечитаемы"

[[seq]]
from = "broker"
to = "executor"
step = 5
label = "отказ"
color = "alert"

[[seq]]
else = "допуск подтверждён"

[[seq]]
from = "broker"
to = "executor"
step = 5
label = "материал аренды через разрешённый канал"

[[seq]]
from = "executor"
to = "harness"
step = 6
label = "материал без argv, файлов запуска и логов"

[[seq]]
end = true
