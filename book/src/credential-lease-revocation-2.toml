# Former source: credential-lease-revocation.puml, removed from book/src/ in the book
# diagram wave; it remains in the repository history.
# Broker: lease and revocation, part 2 of 3: check and issue. Content follows
# credential-lease-revocation.puml and chapter "Учётные данные и логины";
# split by phase (see part 1), step numbers stay those of the whole flow. A
# branch keeps the number of the step it replaces.
# The admitted branch splits by credential mode, as in the chapter: with a
# readable token the material reaches the harness through the permitted
# channel; in the secret-free mode the credential-spending service holds it,
# checks the original caller's authority at every use (the closing note), and
# the harness has only a placeholder. The refusal goes back to whichever caller
# asked, so it is drawn on the broker's own lifeline.
layout = "sequence"
alt = "Брокер, выдача: после проверки поколения, привязки, грантов и отзывов аренду получает исполнитель под UID агента или, в режиме без секретов у агента, служба, которая проверяет право вызывающего на каждом использовании."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 170
seq_column_gap = 16
seq_row_gap = 8

[nodes.harness]
role = "agent"
name = "Харнес"

[nodes.executor]
role = "service"
name = "Исполнитель под UID агента"

[nodes.holder]
role = "service"
name = "Шлюз или служба действий"

[nodes.broker]
role = "service"
name = "Брокер"

[nodes.registry]
role = "store"
name = "Поколения, привязки, гранты и отзывы"

[[seq]]
from = "broker"
to = "registry"
step = 4
label = "UID от ядра, активное поколение, привязка, права, отзывы и квалифицированный путь"

[[seq]]
alt = "проверка не пройдена или отзывы нечитаемы"

[[seq]]
from = "broker"
to = "broker"
step = 5
label = "отказ вызывающему"
color = "alert"

[[seq]]
else = "допуск, режим с читаемым токеном"

[[seq]]
from = "broker"
to = "executor"
step = 5
label = "материал аренды через разрешённый канал"

[[seq]]
from = "executor"
to = "harness"
step = 6
label = "материал без argv, файлов запуска и логов"

[[seq]]
else = "допуск, режим без секретов у агента"

[[seq]]
from = "broker"
to = "holder"
step = 5
label = "материал служебной аренды"

[[seq]]
end = true

[[seq]]
note = "В режиме без секретов у агента харнес получает только заглушку, а служба тратит материал только после проверки права исходного вызывающего на цель и операцию и текущего полномочия, на каждом использовании."
over = ["harness", "registry"]
