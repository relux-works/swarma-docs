to = "end_reject"

[[links]]
from = "fold"
to = "end_fold"

[[links]]
from = "rstart"
to = "recover"

[[links]]
from = "recover"
to = "tail"

[[links]]
from = "tail"
to = "refold"

[[links]]
from = "refold"
to = "effects"

[[links]]
from = "effects"
to = "notify"

[[links]]
from = "notify"
to = "work"

[[links]]
from = "work"
to = "end_work"
