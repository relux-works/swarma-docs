# Chapter "Внешние эффекты, остановка и федерация", section on the owner
# federation: two owners, each with its runtime, its trust node and its core
# node, a shared project on Swarma Protocol and Matrix federation between the
# owners' homeservers (owner request of 2026-10-25, the picture of two
# companies). One direction is drawn: an agent of owner B acts in owner A's
# runtime, and A checks the envelope against B's registry. The other direction
# is symmetric; the chapter text says so. The project part shows what the
# protocol adds to the pairwise path: a journal signed by a quorum of both
# owners' core nodes, the orchestrator role held by lease and the reviewer
# chosen deterministically. The core nodes are drawn inside the project they
# serve, named by owner. The public pool runs on its own dedicated machines,
# outside the project (CIP-0026); it sits beside owner A's row only to keep
# the figure inside the tall box.
layout = "graph"
direction = "TB"
same_rank = [["tn_b", "rt_b"], ["rt_a", "tn_a", "pool"], ["core_b", "core_a"], ["log", "roles"]]
alt = "Федерация владельцев: у каждого владельца свой рантайм и свой узел доверия, конверт агента B идёт через федерацию Matrix, рантайм A проверяет его по свежему снимку реестра B, а общий проект ведёт журнал с кворумом кор-нод обоих владельцев, оркестратор по аренде и детерминированный выбор ревьювера."

[groups.own_b]
label = "Владелец B"
role = "service"

[groups.own_a]
label = "Владелец A"
role = "service"

[groups.proj]
