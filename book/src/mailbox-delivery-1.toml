# Mail delivery, part 1 of 2: admission at the trust gates. Content follows
# the chapter "Путь сообщения и мост". Split from the whole sequence after
# step 4: both bodies that leave the gates, the unsigned one and the admitted
# one, go to the decision guard, and part 2 starts there. The gates send no
# bell: a bell exists only after the guard allows the body.
layout = "sequence"
alt = "Допуск почты: отказ ворот не доставляется, неподписанное тело удерживается как недоверенные данные, и оба тела, неподписанное и допущенное, идут во входящий конвейер guard."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 140
seq_column_gap = 20

[nodes.provider]
role = "service"
name = "Провайдер носителя"

[nodes.gate]
role = "service"
name = "Ворота доверия"

[nodes.guard]
role = "service"
name = "Decision guard"

[nodes.mailbox]
role = "store"
name = "Почтовый ящик"

[[seq]]
from = "provider"
to = "provider"
step = 1
label = "сохранить событие на диск,\nзатем сдвинуть курсор"

[[seq]]
from = "provider"
to = "gate"
step = 2
label = "точные байты конверта"

[[seq]]
from = "gate"
to = "gate"
step = 3
label = "подпись, класс ключа, доверенность,\nсвежесть, повторы и привязка"

[[seq]]
alt = "нет подписи"

[[seq]]
from = "gate"
to = "guard"
step = 4
label = "тело как недоверенные данные"

[[seq]]
else = "подпись неверна или иная проверка провалена"

[[seq]]
from = "gate"
to = "mailbox"
step = 4
label = "квитанция отказа и аудит; доставки нет"
color = "alert"

[[seq]]
else = "допущено"

[[seq]]
from = "gate"
to = "guard"
step = 4
label = "тело и запись проверки"

[[seq]]
end = true
