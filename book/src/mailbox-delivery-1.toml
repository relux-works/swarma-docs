# Mail delivery, part 1 of 2: admission at the trust gates. Content follows
# the former mailbox-delivery.puml (removed in the book diagram wave) and the
# chapter "Путь сообщения и мост". Split from the whole sequence after step 4:
# part 2 repeats the two branches that reach the session host, the
# metadata-only call of step 5 and the admitted body of step 4, so its queue
# frame covers both calls. The puml title ("Предлагаемая доставка почты")
# carried a status and is dropped.
layout = "sequence"
alt = "Допуск почты: неподписанное тело удерживается в карантине, отказ не доставляется, допущенное тело идёт к decision guard."

[theme.space]
seq_node_width = 130
seq_label_width = 170
seq_self_width = 140
seq_column_gap = 20

[nodes.provider]
role = "service"
name = "Провайдер носителя"

[nodes.gate]
role = "service"
name = "Ворота доверия"

[nodes.guard]
role = "service"
name = "Decision guard"

[nodes.mailbox]
role = "store"
name = "Почтовый ящик"

[nodes.host]
role = "service"
name = "Хост сессий"

[[seq]]
from = "provider"
to = "provider"
step = 1
label = "сохранить событие на диск,\nзатем сдвинуть курсор"

[[seq]]
from = "provider"
to = "gate"
step = 2
label = "точные байты конверта"

[[seq]]
from = "gate"
to = "gate"
step = 3
label = "подпись, класс ключа, доверенность,\nсвежесть, повторы и привязка"

[[seq]]
alt = "нет подписи"

[[seq]]
from = "gate"
to = "mailbox"
step = 4
label = "удержать тело в карантине"

[[seq]]
from = "gate"
to = "host"
step = 5
label = "звонок только с метаданными"

[[seq]]
else = "подпись неверна или иная проверка провалена"

[[seq]]
from = "gate"
to = "mailbox"
step = 4
label = "квитанция отказа и аудит; доставки нет"
color = "alert"

[[seq]]
else = "допущено"

[[seq]]
from = "gate"
to = "guard"
step = 4
label = "тело и запись проверки"

[[seq]]
end = true
