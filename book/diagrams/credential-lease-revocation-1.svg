<svg xmlns="http://www.w3.org/2000/svg" width="874.9" height="508.1" viewBox="0 0 874.9 508.1">
<title>Брокер, подключение: оператор подключает подписку, диспетчер привязывает поколение; аренду просит исполнитель под UID агента в режиме с читаемым токеном или служба под своей учёткой в режиме без секретов у агента.</title>
<rect width="874.9" height="508.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(54.2 0)">
<line x1="0" y1="45.4" x2="0" y2="484.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="128.3" y1="45.4" x2="128.3" y2="484.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="277.2" y1="68.8" x2="277.2" y2="484.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="508.1" y1="45.4" x2="508.1" y2="484.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="741.1" y1="92.2" x2="741.1" y2="484.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="233.2" y="261.7" width="531.9" height="202.4" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="233.2" y1="364.9" x2="765.1" y2="364.9" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="241.2" y="268.7" width="184.8" height="20.2" fill="#ffffff" class="plate"/>
<text x="247.2" y="283" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим с читаемым токеном</tspan></text>
<rect x="241.2" y="369.9" width="189.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="247.2" y="384.2" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим без секретов у агента</tspan></text>
<!-- node operator -->
<rect x="-54.2" y="0" width="108.3" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="operator"/>
<text x="-38.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оператор</tspan></text>
<!-- node dispatcher -->
<rect x="70.2" y="0" width="116.2" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="dispatcher"/>
<text x="86.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Диспетчер</tspan></text>
<!-- node executor -->
<rect x="202.4" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="225.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="218.4" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node broker -->
<rect x="458.1" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="479.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- node holder -->
<rect x="685.5" y="0" width="111.2" height="92.2" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="holder"/>
<text x="701.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Шлюз или</tspan></text>
<text x="712.7" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служба</tspan></text>
<text x="704.5" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действий</tspan></text>
<!-- message operator -> broker -->
<path d="M 2 182.7 L 500.1 182.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="broker" data-edge="m0"/>
<polygon points="506.1,182.7 496.1,178.2 496.1,187.2" fill="#3a3f47"/>
<rect x="165.3" y="116.2" width="177.5" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="178.3" cy="126.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="174.6" y="131.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="193.3" y="131.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подключить подписку</tspan></text>
<text x="193.3" y="150.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с подтверждением</tspan></text>
<text x="193.3" y="170.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действия</tspan></text>
</g>
<!-- message dispatcher -> broker -->
<path d="M 130.3 245.7 L 500.1 245.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="broker" data-edge="m1"/>
<polygon points="506.1,245.7 496.1,241.2 496.1,250.2" fill="#3a3f47"/>
<rect x="218.4" y="198.7" width="199.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="231.4" cy="209.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="227.7" y="214.1" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="246.4" y="213.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязать поколение</tspan></text>
<text x="246.4" y="233.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в пределах цепочек прав</tspan></text>
</g>
<!-- message executor -> broker -->
<path d="M 279.2 344.9 L 500.1 344.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="broker" data-edge="m2"/>
<polygon points="506.1,344.9 496.1,340.4 496.1,349.4" fill="#3a3f47"/>
<rect x="293.2" y="297.9" width="198.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="306.2" cy="308.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="302.5" y="313.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="321.2" y="313.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">собственное соединение</tspan></text>
<text x="321.2" y="332.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">после смены UID; аренда</tspan></text>
</g>
<!-- message holder -> broker -->
<path d="M 739.1 448.1 L 516.1 448.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="holder" data-to="broker" data-edge="m3"/>
<polygon points="510.1,448.1 520.1,452.6 520.1,443.6" fill="#3a3f47"/>
<rect x="524.1" y="401.1" width="201" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="537.1" cy="411.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="533.4" y="416.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="552.1" y="416.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служебная аренда;</tspan></text>
<text x="552.1" y="435.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">службу опознаёт ядро ОС</tspan></text>
</g>
</g>
</g>
</svg>
