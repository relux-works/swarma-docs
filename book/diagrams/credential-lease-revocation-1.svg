<svg xmlns="http://www.w3.org/2000/svg" width="602.6" height="382.3" viewBox="0 0 602.6 382.3">
<title>Брокер, подключение: оператор подключает подписку, диспетчер привязывает поколение, исполнитель под UID агента просит аренду по собственному соединению.</title>
<rect width="602.6" height="382.3" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(54.2 0)">
<line x1="0" y1="45.4" x2="0" y2="358.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="132.3" y1="45.4" x2="132.3" y2="358.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="285.2" y1="68.8" x2="285.2" y2="358.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="474.4" y1="45.4" x2="474.4" y2="358.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node operator -->
<rect x="-54.2" y="0" width="108.3" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="operator"/>
<text x="-38.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оператор</tspan></text>
<!-- node dispatcher -->
<rect x="74.2" y="0" width="116.2" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="dispatcher"/>
<text x="90.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Диспетчер</tspan></text>
<!-- node executor -->
<rect x="210.4" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="233.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="226.4" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node broker -->
<rect x="424.4" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="445.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- message operator -> broker -->
<path d="M 2 159.3 L 466.4 159.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="broker" data-edge="m0"/>
<polygon points="472.4,159.3 462.4,154.8 462.4,163.8" fill="#3a3f47"/>
<rect x="148.5" y="92.8" width="177.5" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="161.5" cy="103.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="157.8" y="108.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="176.5" y="108.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подключить подписку</tspan></text>
<text x="176.5" y="127.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с подтверждением</tspan></text>
<text x="176.5" y="147.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действия</tspan></text>
</g>
<!-- message dispatcher -> broker -->
<path d="M 134.3 245.8 L 466.4 245.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="broker" data-edge="m1"/>
<polygon points="472.4,245.8 462.4,241.3 462.4,250.3" fill="#3a3f47"/>
<rect x="216.7" y="179.3" width="173.3" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="229.7" cy="190.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="226" y="194.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="244.7" y="194.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязать поколение</tspan></text>
<text x="244.7" y="214.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в пределах цепочек</tspan></text>
<text x="244.7" y="233.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">прав</tspan></text>
</g>
<!-- message executor -> broker -->
<path d="M 287.2 332.3 L 466.4 332.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="broker" data-edge="m2"/>
<polygon points="472.4,332.3 462.4,327.8 462.4,336.8" fill="#3a3f47"/>
<rect x="301.2" y="265.8" width="157.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="314.2" cy="276.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="310.5" y="281.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="329.2" y="281.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">собственное</tspan></text>
<text x="329.2" y="300.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">соединение после</tspan></text>
<text x="329.2" y="320.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">смены UID; аренда</tspan></text>
</g>
</g>
</g>
</svg>
