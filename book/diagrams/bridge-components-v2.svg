<svg xmlns="http://www.w3.org/2000/svg" width="847.3" height="825.9" viewBox="0 0 847.3 825.9">
<title>Мост: провайдер носителя, ворота доверия, почтовый ящик и хост сессий разделяют обязанности</title>
<rect width="847.3" height="825.9" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(-8 -8)">
<!-- graphviz 14.0.4 -->
<!-- group bridge -->
<rect x="8" y="8" width="471" height="681" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="bridge"/>
<!-- node mx -->
<rect x="497" y="70.8" width="100" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="mx"/>
<text x="521.9" y="96.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix</tspan></text>
<text x="517.4" y="125.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">носитель</tspan></text>
<!-- node provider -->
<rect x="26.2" y="61" width="251.7" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="provider"/>
<text x="69.9" y="87.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Провайдер носителя</tspan></text>
<text x="89.3" y="115.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">сохраняет событие</tspan></text>
<text x="91.8" y="135.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">до сдвига курсора</tspan></text>
<!-- node core -->
<rect x="26.2" y="209.4" width="251.7" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="core"/>
<text x="106.7" y="235.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ядро моста</tspan></text>
<text x="42.2" y="264.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">привязки провайдеров к сессиям</tspan></text>
<!-- node gate -->
<rect x="26.2" y="338.3" width="251.7" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="gate"/>
<text x="88.3" y="364.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ворота доверия</tspan></text>
<text x="52.3" y="393" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">детерминированная проверка</tspan></text>
<!-- node guard -->
<rect x="26.2" y="469.2" width="251.7" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="guard"/>
<text x="94.9" y="495.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Decision guard</tspan></text>
<text x="72.3" y="523.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">только сужение допуска</tspan></text>
<!-- node mailbox -->
<rect x="26.2" y="600.1" width="251.7" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="mailbox"/>
<text x="89.3" y="626.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Почтовый ящик</tspan></text>
<text x="73.6" y="654.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">тела и записи проверки</tspan></text>
<!-- node store -->
<rect x="321" y="209.4" width="139.9" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="store"/>
<text x="345.1" y="235.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хранилище</tspan></text>
<text x="337" y="264.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">очереди и аудит</tspan></text>
<!-- node host -->
<rect x="496.6" y="600.1" width="204.9" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="552.5" y="626.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий</tspan></text>
<text x="534.4" y="654.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">единственный ввод</tspan></text>
<!-- node agent -->
<rect x="496.6" y="739" width="204.9" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agent"/>
<text x="577" y="765.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Агент</tspan></text>
<text x="512.6" y="793.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">читает тело инструментом</tspan></text>
<!-- link mx -> provider -->
<path d="M 497 106.2 C 444 106.2 358.3 106.2 285.5 106.2 L 284.1 106.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mx" data-to="provider" data-edge="e0"/>
<polygon points="278.1,106.2 288.1,110.7 288.1,101.7" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<circle cx="387.5" cy="91.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="383.8" y="95.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
</g>
<!-- link provider -> core -->
<path d="M 152 151.6 C 152 167.8 152 186.1 152 202.1 L 152 203.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="provider" data-to="core" data-edge="e1"/>
<polygon points="152,209.2 156.5,199.2 147.5,199.2" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<circle cx="169" cy="179.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="165.3" y="184.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
</g>
<!-- link core -> gate -->
<path d="M 152 280.5 C 152 296.1 152 314.5 152 330.8 L 152 332.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="core" data-to="gate" data-edge="e2"/>
<polygon points="152,338.1 156.5,328.1 147.5,328.1" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<circle cx="169" cy="310.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="165.3" y="315.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
</g>
<!-- link gate -> guard -->
<path d="M 152 409.6 C 152 425.5 152 444.5 152 461.2 L 152 462.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gate" data-to="guard" data-edge="e3"/>
<polygon points="152,468.7 156.5,458.7 147.5,458.7" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<circle cx="169" cy="440.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="165.3" y="445.1" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="184" y="444.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допущенное</tspan></text>
</g>
<!-- link guard -> mailbox -->
<path d="M 152 540.5 C 152 556.4 152 575.4 152 592.1 L 152 593.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="guard" data-to="mailbox" data-edge="e4"/>
<polygon points="152,599.6 156.5,589.6 147.5,589.6" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<circle cx="169" cy="571.3" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="165.3" y="576" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="184" y="575.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">если разрешена доставка</tspan></text>
</g>
<!-- link mailbox -> host -->
<path d="M 278.3 635.5 C 344.7 635.5 425.2 635.5 489 635.5 L 490.3 635.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mailbox" data-to="host" data-edge="e5"/>
<polygon points="496.3,635.5 486.3,631 486.3,640" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<circle cx="333.1" cy="619.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="329.4" y="624.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="348.1" y="624.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонок без тела</tspan></text>
</g>
<!-- link host -> agent -->
<path d="M 599 671.5 C 599 689.6 599 712 599 731.2 L 599 732.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="agent" data-edge="e6"/>
<polygon points="599,738.6 603.5,728.6 594.5,728.6" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<circle cx="616" cy="710.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="612.3" y="714.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="631" y="714.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">уведомление на границе хода</tspan></text>
</g>
<!-- link agent -> mailbox -->
<path d="M 496.3 742 C 429.8 721.6 342.9 695 273.1 673.6 L 271.7 673.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="agent" data-to="mailbox" data-edge="e7"/>
<polygon points="265.9,671.5 274.2,678.7 276.8,670.1" fill="#3a3f47"/>
<g class="label" data-edge="e7">
<circle cx="421.2" cy="753.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="417.5" y="758.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="436.2" y="758.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">чтение</tspan></text>
</g>
<!-- link core -> store -->
<path d="M 278 244.9 C 289.9 244.9 301.7 244.9 313.5 244.9 L 314.8 244.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="core" data-to="store" data-edge="e8"/>
<polygon points="320.8,244.9 310.8,240.4 310.8,249.4" fill="#3a3f47"/>
<!-- link mailbox -> store -->
<path d="M 278.2 614.7 C 313.9 606.5 346.3 595.7 358 582.1 C 429.5 498.9 414.1 357.7 400.7 287.8 L 400.4 286.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mailbox" data-to="store" data-edge="e9"/>
<polygon points="399.3,280.8 396.8,291.5 405.6,289.7" fill="#3a3f47"/>
<!-- group label bridge -->
<rect x="20" y="18" width="52" height="18.9" fill="#ffffff" class="plate"/>
<text x="26" y="32.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">МОСТ</tspan></text>
</g>
</g>
</svg>
