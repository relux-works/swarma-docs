<path d="M 158 151.6 C 158 167.8 158 186.1 158 202.1 L 158 203.2" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="158,209.2 162.5,199.2 153.5,199.2" fill="#3a3f47"/>
