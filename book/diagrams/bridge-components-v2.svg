<rect x="513.6" y="739" width="216.9" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2"/>
<text x="600" y="765.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Агент</tspan></text>
<text x="535.6" y="793.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">читает тело инструментом</tspan></text>
