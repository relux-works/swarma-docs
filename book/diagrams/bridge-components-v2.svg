<path d="M 534.5 106.2 C 466.3 106.2 353.9 106.2 269.7 106.2 L 268.4 106.2" fill="none" stroke="#3a3f47" stroke-width="2"/>
<polygon points="262.4,106.2 272.4,110.7 272.4,101.7" fill="#3a3f47"/>
<circle cx="395.6" cy="92.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="392.2" y="96.5" font-size="12" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
