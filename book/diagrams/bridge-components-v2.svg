<svg xmlns="http://www.w3.org/2000/svg" width="886" height="841.9" viewBox="0 0 886 841.9">
<title>Мост: провайдер носителя, ворота доверия, почтовый ящик и хост сессий разделяют обязанности</title>
<rect width="886" height="841.9" fill="#ffffff"/>
<g transform="translate(16 16)">
<!-- group bridge -->
<rect x="8" y="8" width="509" height="681" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6"/>
<!-- node provider -->
<rect x="53.9" y="61" width="208.3" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="75.9" y="87.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Провайдер носителя</tspan></text>
<text x="95.3" y="115.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">сохраняет событие</tspan></text>
<text x="97.8" y="135.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">до сдвига курсора</tspan></text>
<!-- node core -->
<rect x="26.2" y="209.4" width="263.7" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="112.7" y="235.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ядро моста</tspan></text>
<text x="48.2" y="264.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">привязки провайдеров к сессиям</tspan></text>
<!-- node gate -->
<rect x="36.3" y="338.3" width="243.4" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="94.3" y="364.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ворота доверия</tspan></text>
<text x="58.3" y="393" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">детерминированная проверка</tspan></text>
<!-- node guard -->
<rect x="56.3" y="469.2" width="203.4" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="100.9" y="495.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Decision guard</tspan></text>
<text x="78.3" y="523.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">только сужение допуска</tspan></text>
<!-- node mailbox -->
<rect x="57.6" y="600.1" width="200.8" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2"/>
<text x="95.3" y="626.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Почтовый ящик</tspan></text>
<text x="79.6" y="654.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">тела и записи проверки</tspan></text>
<!-- node store -->
<rect x="347" y="209.4" width="151.9" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2"/>
<text x="377.1" y="235.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хранилище</tspan></text>
<text x="369" y="264.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">очереди и аудит</tspan></text>
<!-- node mx -->
<rect x="535" y="70.8" width="120" height="70.9" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2"/>
<text x="569.9" y="96.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix</tspan></text>
<text x="565.4" y="125.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">носитель</tspan></text>
<!-- node host -->
<rect x="535.4" y="600.1" width="173.3" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2"/>
<text x="575.5" y="626.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий</tspan></text>
<text x="557.4" y="654.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">единственный ввод</tspan></text>
