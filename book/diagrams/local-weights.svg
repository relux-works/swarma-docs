<text x="309.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Конфигурация</tspan></text>
<!-- node board -->
<rect x="461.1" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="board"/>
<text x="487.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Доска</tspan></text>
<!-- node router -->
<rect x="638.9" y="0" width="157.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="router"/>
<text x="654.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Маршрутизатор</tspan></text>
<!-- message operator -> engine -->
<path d="M 2 116.4 L 138.4 116.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="engine" data-edge="m0"/>
<polygon points="144.4,116.4 134.4,111.9 134.4,120.9" fill="#3a3f47"/>
<rect x="16" y="69.4" width="114.4" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="29" cy="80.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="84.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="44" y="84.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">импорт</tspan></text>
<text x="44" y="104.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">файла весов</tspan></text>
</g>
<!-- self engine -->
<path d="M 148.4 140.4 L 178.4 140.4 L 178.4 169.9 L 155.4 169.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="engine" data-to="engine" data-edge="m1"/>
<polygon points="149.4,169.9 159.4,174.4 159.4,165.4" fill="#3a3f47"/>
<rect x="186.4" y="144.4" width="134.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="199.4" cy="155.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="195.7" y="159.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="214.4" y="159.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">SHA-256 файла</tspan></text>
</g>
<!-- message engine -> config -->
<path d="M 148.4 252.4 L 359.1 252.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="engine" data-to="config" data-edge="m2"/>
<polygon points="365.1,252.4 355.1,247.9 355.1,256.9" fill="#3a3f47"/>
<rect x="177.9" y="185.9" width="157.8" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="190.9" cy="196.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="187.2" y="201.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="205.9" y="201.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отпечаток</tspan></text>
<text x="205.9" y="220.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">импортированного</tspan></text>
<text x="205.9" y="240.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">файла</tspan></text>
</g>
<!-- message operator -> config -->
<path d="M 2 319.4 L 359.1 319.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="config" data-edge="m3"/>
<polygon points="365.1,319.4 355.1,314.9 355.1,323.9" fill="#3a3f47"/>
<rect x="128.1" y="272.4" width="110.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="141.1" cy="283.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="137.4" y="287.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="156.1" y="287.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ожидаемый</tspan></text>
<text x="156.1" y="307.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отпечаток</tspan></text>
</g>
<!-- message board -> router -->
<path d="M 513.1 386.4 L 709.8 386.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="board" data-to="router" data-edge="m4"/>
<polygon points="715.8,386.4 705.8,381.9 705.8,390.9" fill="#3a3f47"/>
<rect x="537.2" y="339.4" width="154.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="550.2" cy="350.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="546.5" y="354.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="565.2" y="354.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отпечаток, режим</tspan></text>
<text x="565.2" y="374.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">мышления и effort</tspan></text>
</g>
<!-- self router -->
<path d="M 715.8 410.4 L 685.8 410.4 L 685.8 498.4 L 708.8 498.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="router" data-to="router" data-edge="m5"/>
<polygon points="714.8,498.4 704.8,493.9 704.8,502.9" fill="#3a3f47"/>
<rect x="537.1" y="414.4" width="140.8" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="550.1" cy="425.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="546.4" y="429.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="565.1" y="429.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">применять</tspan></text>
<text x="565.1" y="449.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">оценку только</tspan></text>
<text x="565.1" y="468.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">при совпадении</tspan></text>
<text x="565.1" y="488.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">файла и режима</tspan></text>
</g>
<!-- message router -> board -->
<path d="M 715.8 561.4 L 519.1 561.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="router" data-to="board" data-edge="m6"/>
<polygon points="513.1,561.4 523.1,565.9 523.1,556.9" fill="#3a3f47"/>
<rect x="555.6" y="514.4" width="117.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="568.6" cy="525.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="564.9" y="529.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="583.6" y="529.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">выбор или</tspan></text>
<text x="583.6" y="549.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">"без оценки"</tspan></text>
</g>
<!-- message board -> engine -->
<path d="M 509.1 608.9 L 154.4 608.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="board" data-to="engine" data-edge="m7"/>
<polygon points="148.4,608.9 158.4,613.4 158.4,604.4" fill="#3a3f47"/>
<rect x="263.4" y="581.4" width="130.7" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m7">
<circle cx="276.4" cy="592.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="272.7" y="596.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="291.4" y="596.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запрос запуска</tspan></text>
</g>
<!-- self engine -->
<path d="M 148.4 632.9 L 178.4 632.9 L 178.4 740.4 L 155.4 740.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="engine" data-to="engine" data-edge="m8"/>
<polygon points="149.4,740.4 159.4,744.9 159.4,735.9" fill="#3a3f47"/>
<rect x="186.4" y="636.9" width="154.7" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m8">
<circle cx="199.4" cy="647.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="195.7" y="652.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="214.4" y="652.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сверить</tspan></text>
<text x="214.4" y="671.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ожидаемый,</tspan></text>
<text x="214.4" y="691.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">импортированный</tspan></text>
<text x="214.4" y="710.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и фактический</tspan></text>
<text x="214.4" y="730.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отпечатки</tspan></text>
</g>
<!-- message engine -> board -->
<path d="M 148.4 820.1 L 503.1 820.1" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="engine" data-to="board" data-edge="m9"/>
<polygon points="509.1,820.1 499.1,815.6 499.1,824.6" fill="#c8285f"/>
<rect x="292.1" y="792.6" width="73.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m9">
<rect x="296.1" y="794.4" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="300.6" y="808" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="325.8" y="807.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ</tspan></text>
</g>
</g>
</g>
</svg>
