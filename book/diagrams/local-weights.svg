<svg xmlns="http://www.w3.org/2000/svg" width="874.9" height="884.1" viewBox="0 0 874.9 884.1">
<title>Локальные веса: отпечаток связывает оценку с файлом весов, а движок отдельно сверяет фактический файл перед запуском.</title>
<rect width="874.9" height="884.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(54.2 0)">
<line x1="0" y1="45.4" x2="0" y2="860.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="146.4" y1="45.4" x2="146.4" y2="860.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="367.1" y1="45.4" x2="367.1" y2="860.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="511.1" y1="45.4" x2="511.1" y2="860.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="717.8" y1="45.4" x2="717.8" y2="860.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame opt -->
<rect x="102.4" y="756.4" width="432.7" height="83.7" rx="10" fill="none" stroke="#868e99" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" class="frame" data-kind="opt"/>
<rect x="110.4" y="763.4" width="141.8" height="20.2" fill="#ffffff" class="plate"/>
<text x="116.4" y="777.7" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">значения расходятся</tspan></text>
<!-- node operator -->
<rect x="-54.2" y="0" width="108.3" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="operator"/>
<text x="-38.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оператор</tspan></text>
<!-- node engine -->
<rect x="96.4" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="engine"/>
<text x="115.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Движок</tspan></text>
