<svg xmlns="http://www.w3.org/2000/svg" width="864.6" height="840.3" viewBox="0 0 864.6 840.3">
<title>Доставка почты: после входящего конвейера guard звонок без тела о допущенной почте и звонок только с метаданными о неподписанной идут через одну очередь, а тело агент забирает из ящика инструментом.</title>
<rect width="864.6" height="840.3" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(50 0)">
<line x1="0" y1="68.8" x2="0" y2="816.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="174.7" y1="68.8" x2="174.7" y2="816.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="337.8" y1="68.8" x2="337.8" y2="816.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="510.5" y1="45.4" x2="510.5" y2="816.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="730.6" y1="45.4" x2="730.6" y2="816.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="130.7" y="171.3" width="403.7" height="272.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="130.7" y1="270.5" x2="534.5" y2="270.5" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<!-- frame opt -->
<rect x="293.8" y="458.2" width="460.9" height="273.7" rx="10" fill="none" stroke="#868e99" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" class="frame" data-kind="opt"/>
<rect x="138.7" y="178.3" width="197.7" height="20.2" fill="#ffffff" class="plate"/>
<text x="144.7" y="192.6" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">guard недоступен или отказал</tspan></text>
<rect x="138.7" y="275.5" width="110.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="144.7" y="289.8" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">guard разрешил</tspan></text>
<rect x="301.8" y="465.2" width="186.1" height="20.2" fill="#ffffff" class="plate"/>
<text x="307.8" y="479.5" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонок поставлен в очередь</tspan></text>
<!-- node gate -->
<rect x="-50" y="0" width="100" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="gate"/>
<text x="-28.1" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ворота</tspan></text>
<text x="-33.4" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверия</tspan></text>
<!-- node guard -->
<rect x="124.7" y="0" width="100" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="guard"/>
<text x="142.1" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Decision</tspan></text>
<text x="152.6" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">guard</tspan></text>
<!-- node mailbox -->
<rect x="282.3" y="0" width="111" height="68.8" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="mailbox"/>
<text x="298.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Почтовый</tspan></text>
<text x="316.9" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ящик</tspan></text>
<!-- node host -->
<rect x="447.9" y="0" width="125.1" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="463.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий</tspan></text>
<!-- node agent -->
<rect x="680.6" y="0" width="100" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agent"/>
<text x="708.6" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Агент</tspan></text>
<!-- message gate -> guard -->
<path d="M 2 159.3 L 166.7 159.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gate" data-to="guard" data-edge="m0"/>
<polygon points="172.7,159.3 162.7,154.8 162.7,163.8" fill="#3a3f47"/>
<rect x="16" y="92.8" width="142.7" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="29" cy="103.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="108.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="44" y="108.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">тело:</tspan></text>
<text x="44" y="127.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">неподписанное</tspan></text>
<text x="44" y="147.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">или допущенное</tspan></text>
</g>
<!-- message guard -> mailbox -->
<path d="M 176.7 254.5 L 329.8 254.5" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="guard" data-to="mailbox" data-edge="m1"/>
<polygon points="335.8,254.5 325.8,250 325.8,259" fill="#c8285f"/>
<rect x="204.9" y="207.5" width="102.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="217.9" cy="218.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="214.2" y="222.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="232.9" y="222.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ;</tspan></text>
<text x="232.9" y="242.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонка нет</tspan></text>
</g>
<!-- message guard -> mailbox -->
<path d="M 176.7 334.2 L 329.8 334.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="guard" data-to="mailbox" data-edge="m2"/>
<polygon points="335.8,334.2 325.8,329.7 325.8,338.7" fill="#3a3f47"/>
<rect x="190.7" y="306.7" width="131" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="203.7" cy="317.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="200.1" y="322.1" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="218.7" y="321.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">тело и вердикт</tspan></text>
</g>
<!-- message mailbox -> host -->
<path d="M 339.8 432.2 L 502.5 432.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mailbox" data-to="host" data-edge="m3"/>
<polygon points="508.5,432.2 498.5,427.7 498.5,436.7" fill="#3a3f47"/>
<rect x="353.8" y="346.2" width="140.7" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="366.8" cy="356.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="363.1" y="361.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="381.8" y="361.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонок без тела;</tspan></text>
<text x="381.8" y="380.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">без подписи:</tspan></text>
<text x="381.8" y="400.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">только</tspan></text>
<text x="381.8" y="419.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">метаданные</tspan></text>
</g>
<!-- self host -->
<path d="M 512.5 498.4 L 542.5 498.4 L 542.5 605.9 L 519.5 605.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="host" data-edge="m4"/>
<polygon points="513.5,605.9 523.5,610.4 523.5,601.4" fill="#3a3f47"/>
<rect x="550.5" y="502.4" width="154.2" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="563.5" cy="513.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="559.8" y="517.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="578.5" y="517.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">долговечная</tspan></text>
<text x="578.5" y="537.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">очередь;</tspan></text>
<text x="578.5" y="556.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">повторный допуск</tspan></text>
<text x="578.5" y="576.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">перед доставкой,</tspan></text>
<text x="578.5" y="595.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">открытый забор</tspan></text>
</g>
<!-- message host -> agent -->
<path d="M 512.5 660.9 L 722.6 660.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="agent" data-edge="m5"/>
<polygon points="728.6,660.9 718.6,656.4 718.6,665.4" fill="#3a3f47"/>
<rect x="550.4" y="613.9" width="140.4" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="563.4" cy="624.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="559.7" y="629.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="578.4" y="629.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">звонок</tspan></text>
<text x="578.4" y="648.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">на границе хода</tspan></text>
</g>
<!-- message agent -> mailbox -->
<path d="M 728.6 719.9 L 345.8 719.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="agent" data-to="mailbox" data-edge="m6"/>
<polygon points="339.8,719.9 349.8,724.4 349.8,715.4" fill="#3a3f47"/>
<rect x="471.1" y="672.9" width="126.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="484.1" cy="683.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="480.4" y="688.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="499.1" y="688.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">забрать тело</tspan></text>
<text x="499.1" y="707.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">инструментом</tspan></text>
</g>
<!-- note -->
<rect x="277.8" y="745.9" width="512.9" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="298.8" y="771.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Почта от другого агента остаётся данными и полномочия на эффект не даёт.</tspan></text>
<text x="329.2" y="789.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Типизированное действие оператора требует отдельного допуска.</tspan></text>
</g>
</g>
</svg>
