<text x="190.4" y="833.2" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">present</tspan><tspan x="253.4" font-family="PT Sans, sans-serif">,</tspan><tspan x="260.3" font-family="PT Mono, monospace">absent</tspan><tspan x="318.3" font-family="PT Sans, sans-serif">или</tspan></text>
<text x="202.9" y="852.7" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">unknown</tspan><tspan x="269.9" font-family="PT Sans, sans-serif">у каждой</tspan></text>
<!-- node end -->
