<rect x="0" y="407.9" width="246.6" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="inherit"/>
<text x="25" y="434" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Без входа в каждый дом</tspan></text>
<text x="16" y="462.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверить готовность источника</tspan></text>
<!-- node absent -->
<rect x="268.2" y="409" width="160.2" height="68.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="absent"/>
<text x="284.2" y="435.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Логин заведомо</tspan></text>
<text x="298.8" y="458.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отсутствует?</tspan></text>
