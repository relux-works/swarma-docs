<svg xmlns="http://www.w3.org/2000/svg" width="812.5" height="941.9" viewBox="0 0 812.5 941.9">
<title>Подготовка профиля: присутствующий логин сохраняется, неизвестный не считается отсутствующим, вход запускается только для допустимого отдельного дома.</title>
<rect width="812.5" height="941.9" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="235.3" cy="11" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node install -->
<rect x="121.8" y="45" width="227.1" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="install"/>
<text x="190.8" y="71.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Установить</tspan></text>
<text x="137.8" y="94.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отсутствующий профиль</tspan></text>
