<text x="172.9" y="579.5" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">unknown</tspan><tspan x="239.9" font-family="PT Sans, sans-serif">оставить</tspan><tspan x="300.7" font-family="PT Mono, monospace">unknown</tspan></text>
