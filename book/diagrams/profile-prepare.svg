<text x="299.2" y="691.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в управляемом доме</tspan></text>
<text x="317.9" y="719.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без захвата вывода</tspan></text>
<text x="328.8" y="739.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">учётных данных</tspan></text>
