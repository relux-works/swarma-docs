<rect x="111.8" y="136.8" width="247" height="133.3" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="each"/>
<text x="187.7" y="162.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Для каждой</tspan></text>
<text x="155.3" y="186.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">участвующей среды</tspan></text>
<text x="127.8" y="214.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">разрешить источник, хранилище</tspan></text>
<text x="158.7" y="234.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и изоляцию; проверить</tspan></text>
<text x="157.3" y="253.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">метаданные готовности</tspan></text>
<!-- node own -->
<rect x="139.6" y="293.1" width="191.4" height="68.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="own"/>
<text x="198.1" y="319.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Источник</tspan></text>
<text x="155.6" y="342.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">принадлежит дому?</tspan></text>
