<text x="581.5" y="708.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">для</tspan><tspan x="608.3" font-family="PT Mono, monospace">shared</tspan><tspan x="666.3" font-family="PT Sans, sans-serif">инструкция</tspan></text>
<text x="606.5" y="727.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">нативного входа</tspan></text>
