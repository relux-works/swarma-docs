<text x="436" y="552" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">isolated</tspan><tspan x="527" font-family="PT Sans, sans-serif" font-weight="bold">и есть</tspan></text>
<text x="417.7" y="575.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">настоящий терминал?</tspan></text>
