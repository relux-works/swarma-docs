<svg xmlns="http://www.w3.org/2000/svg" width="776" height="990.6" viewBox="0 0 776 990.6">
<title>Порядок разрешения учётных данных: источник, хранилище и допустимость изоляции проверяются до выбора ссылки.</title>
<rect width="776" height="990.6" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="188" cy="11" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node q_home -->
<rect x="92.3" y="59" width="191.4" height="113.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q_home"/>
<text x="150.8" y="85.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Источник</tspan></text>
<text x="108.3" y="108.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">принадлежит дому?</tspan></text>
<text x="118" y="137.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">определить источник</tspan></text>
<text x="134.1" y="156.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">аутентификации</tspan></text>
<!-- node inherited -->
<rect x="0" y="364.6" width="218" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="inherited"/>
<text x="16" y="390.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Наследуемый источник</tspan></text>
<text x="27.2" y="419.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без собственного логина</tspan></text>
<text x="59.2" y="438.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">дома; доставка</tspan></text>
<text x="19.4" y="458.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исполнителю через брокер</tspan></text>
