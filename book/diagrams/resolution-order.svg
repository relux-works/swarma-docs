<text x="22.4" y="419.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без собственного логина дома;</tspan></text>
<text x="16" y="438.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исполнитель извлекает значение</tspan></text>
