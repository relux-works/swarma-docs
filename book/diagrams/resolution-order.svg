<rect x="158" y="232.8" width="218.1" height="113.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q_adapter"/>
<text x="174" y="258.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Адаптер поддерживает</tspan></text>
<text x="218" y="282.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">хранилище?</tspan></text>
<text x="194.7" y="310.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">разрешить машинный</tspan></text>
<text x="207.2" y="330.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">выбор хранилища</tspan></text>
