<rect x="137.9" y="502.3" width="260.1" height="70.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q_iso"/>
<text x="181.2" y="528.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Изоляция допустима?</tspan></text>
<text x="153.9" y="556.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверить допустимость изоляции</tspan></text>
