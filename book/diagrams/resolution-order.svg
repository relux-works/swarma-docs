<text x="472.3" y="547.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">например, Claude на macOS в</tspan><tspan x="672.4" font-family="PT Mono, monospace">shared</tspan><tspan x="726.4" font-family="PT Sans, sans-serif">:</tspan></text>
<text x="466" y="566.7" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">environment_shared_unsupported</tspan></text>
<!-- node link -->
<rect x="141.3" y="642.9" width="247.4" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="link"/>
<text x="195.4" y="669" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Стратегия ссылки</tspan></text>
<text x="157.3" y="697.6" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">shared</tspan><tspan x="211.3" font-family="PT Sans, sans-serif">: ссылка на общий файл;</tspan></text>
<text x="227.4" y="717.1" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">isolated</tspan><tspan x="299.4" font-family="PT Sans, sans-serif">:</tspan></text>
<text x="183.2" y="736.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">собственный логин дома</tspan></text>
<!-- node meta -->
<rect x="18.4" y="789.8" width="199.2" height="113.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="meta"/>
<text x="67.9" y="815.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Метаданные</tspan></text>
<text x="37.5" y="839.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и настройки запуска</tspan></text>
<text x="34.4" y="867.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без миграции и удаления</tspan></text>
<text x="64.5" y="887.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">учётных данных</tspan></text>
