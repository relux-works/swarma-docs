<text x="124.1" y="108.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">принадлежит дому?</tspan></text>
<text x="133.8" y="137.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">определить источник</tspan></text>
<text x="149.9" y="156.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">аутентификации</tspan></text>
