<svg xmlns="http://www.w3.org/2000/svg" width="682" height="529.6" viewBox="0 0 682 529.6">
<title>Тело блока с деньгами, именами и личностями отделено от социального сегмента, который узел вправе не хранить постоянно.</title>
<rect width="682" height="529.6" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- node header -->
<rect x="0" y="0" width="431.3" height="129.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="header"/>
<text x="175" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Заголовок</tspan></text>
<text x="91.7" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">хэш родителя, метка времени, работа</tspan></text>
<text x="36.2" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корень тела, корень сегмента данных, корень фильтра</tspan></text>
<text x="51.1" y="93.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корень состояния: набор UTXO, имена и личности</tspan></text>
<text x="45.9" y="113.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корень MMR над всеми предыдущими заголовками</tspan></text>
<!-- node body -->
<rect x="0" y="151.4" width="431.3" height="129.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="body"/>
<text x="152.3" y="177.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Тело: консенсус</tspan></text>
<text x="163.3" y="206.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">платежи (UTXO)</tspan></text>
<text x="68.9" y="225.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">имена: регистрация, обновление, продление</tspan></text>
<text x="28.9" y="245.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">события личностей: создание, ротация, трата родителем,</tspan></text>
<text x="147.8" y="264.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">приостановка, отзыв</tspan></text>
<!-- node segment -->
<rect x="0" y="302.8" width="431.3" height="109.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="segment"/>
<text x="16" y="328.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сегмент данных: конверт в консенсусе, смысл вне</tspan></text>
<text x="73.3" y="357.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">посты, ответы, отметки, подписки, профили</tspan></text>
<text x="70.9" y="376.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">указатели, категоризации, пачки аттестаций</tspan></text>
<text x="48.8" y="396.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверка: конверт, подпись пачки, оплата, бюджет</tspan></text>
<!-- node filter -->
<rect x="0" y="434.7" width="431.3" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="filter"/>
<text x="101.7" y="460.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Фильтр для лёгких клиентов</tspan></text>
<text x="113.4" y="489.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ключи: тип, автор, ссылка, тема</tspan></text>
<!-- note body -->
<rect x="451.3" y="178.8" width="161.7" height="74.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_body"/>
<text x="480" y="202.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Хранится всегда;</tspan></text>
<text x="467.5" y="220.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">новый узел начинает</tspan></text>
<text x="463.3" y="238.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">с checkpoint и снимка.</tspan></text>
<path d="M 431.3 216.1 L 451.3 216.1" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="body" data-to="note_body"/>
<!-- note segment -->
<rect x="451.3" y="311.4" width="206.7" height="92.8" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_segment"/>
<text x="463.3" y="334.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Узел вправе выбросить после</tspan></text>
<text x="471.7" y="352.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверки; историю держат</tspan></text>
<text x="479" y="371.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">индексаторы, архивисты</tspan></text>
<text x="498.2" y="389.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и сервисные узлы.</tspan></text>
<path d="M 431.3 357.8 L 451.3 357.8" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="segment" data-to="note_segment"/>
</g>
</svg>
