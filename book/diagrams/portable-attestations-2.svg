<svg xmlns="http://www.w3.org/2000/svg" width="742.8" height="639.7" viewBox="0 0 742.8 639.7">
<title>Проект приложения: агент предъявляет ту же личность, а рантайм приложения принимает собственное решение о допуске.</title>
<rect width="742.8" height="639.7" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(52.8 0)">
<line x1="0" y1="90.4" x2="0" y2="615.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="143.4" y1="45.4" x2="143.4" y2="615.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="296.7" y1="45.4" x2="296.7" y2="615.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="600.9" y1="68.8" x2="600.9" y2="615.7" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node agent -->
<rect x="-52.8" y="0" width="105.5" height="90.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agent"/>
<text x="-22" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Агент</tspan></text>
<text x="-36.8" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">устойчивая</tspan></text>
<text x="-29.5" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">личность</tspan></text>
<!-- node chain -->
<rect x="72.8" y="0" width="141.2" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="chain"/>
<text x="88.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Chain</tspan></text>
<!-- node indexer -->
<rect x="234" y="0" width="125.5" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="indexer"/>
<text x="250" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Индексатор</tspan></text>
<!-- node app -->
<rect x="535.8" y="0" width="130.2" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="app"/>
<text x="567.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рантайм</tspan></text>
<text x="551.8" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">приложения</tspan></text>
<!-- divider -->
<line x1="-52.8" y1="128.5" x2="666" y2="128.5" stroke="#868e99" stroke-width="1.2"/>
<rect x="224.6" y="114.4" width="151.7" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="238.6" y="132.7" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Проект приложения</tspan></text>
<!-- message agent -> app -->
<path d="M 2 209.6 L 592.9 209.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="agent" data-to="app" data-edge="m1"/>
<polygon points="598.9,209.6 588.9,205.1 588.9,214.1" fill="#3a3f47"/>
<rect x="194.6" y="162.6" width="211.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="207.6" cy="173.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="203.9" y="178" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="222.6" y="177.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предъявить ту же личность</tspan></text>
<text x="222.6" y="197.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">для новой задачи</tspan></text>
</g>
<!-- message app -> chain -->
<path d="M 598.9 276.6 L 151.4 276.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="chain" data-edge="m2"/>
<polygon points="145.4,276.6 155.4,281.1 155.4,272.1" fill="#3a3f47"/>
<rect x="283.4" y="229.6" width="177.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="296.4" cy="240.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="292.7" y="245" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="311.4" y="244.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверить аттестации</tspan></text>
<text x="311.4" y="264.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и связь с личностью</tspan></text>
</g>
<!-- message app -> indexer -->
<path d="M 598.9 343.6 L 304.7 343.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="indexer" data-edge="m3"/>
<polygon points="298.7,343.6 308.7,348.1 308.7,339.1" fill="#3a3f47"/>
<rect x="355.8" y="296.6" width="186.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="368.8" cy="307.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="365.1" y="312" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="383.8" y="311.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">получить вычисленную</tspan></text>
<text x="383.8" y="331.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">репутацию</tspan></text>
</g>
<!-- self app -->
<path d="M 598.9 367.6 L 568.9 367.6 L 568.9 436.1 L 591.9 436.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="app" data-edge="m4"/>
<polygon points="597.9,436.1 587.9,431.6 587.9,440.6" fill="#3a3f47"/>
<rect x="322.7" y="371.6" width="238.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="335.7" cy="382.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="332" y="387" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="350.7" y="386.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">своя политика допуска,</tspan></text>
<text x="350.7" y="406.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">глубина ревью и обязательные</tspan></text>
<text x="350.7" y="425.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">оси независимости</tspan></text>
</g>
<!-- message app -> agent -->
<path d="M 598.9 499.1 L 8 499.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="agent" data-edge="m5"/>
<polygon points="2,499.1 12,503.6 12,494.6" fill="#3a3f47"/>
<rect x="223.1" y="452.1" width="154.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<rect x="227.1" y="453.9" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="231.6" y="467.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="256.9" y="467.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск или отказ</tspan></text>
<text x="256.9" y="486.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">для новой задачи</tspan></text>
</g>
<!-- note -->
<rect x="83.4" y="519.1" width="577.6" height="78.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="196.2" y="544.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Формула репутации публикуется вместе с индексатором.</tspan></text>
<text x="225.4" y="562.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Аттестация не доказывает правильности ревью.</tspan></text>
<text x="180.7" y="580.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">История не является разрешением работать в любом проекте.</tspan></text>
</g>
</g>
</svg>
