<svg xmlns="http://www.w3.org/2000/svg" width="742.8" height="591.5" viewBox="0 0 742.8 591.5">
<title>Проект приложения: агент предъявляет ту же личность, а рантайм приложения принимает собственное решение о допуске.</title>
<rect width="742.8" height="591.5" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(52.8 0)">
<line x1="0" y1="90.4" x2="0" y2="567.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="143.4" y1="45.4" x2="143.4" y2="567.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="296.7" y1="45.4" x2="296.7" y2="567.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="600.9" y1="68.8" x2="600.9" y2="567.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node agent -->
<rect x="-52.8" y="0" width="105.5" height="90.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="agent"/>
<text x="-22" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Агент</tspan></text>
<text x="-36.8" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">устойчивая</tspan></text>
<text x="-29.5" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">личность</tspan></text>
<!-- node chain -->
<rect x="72.8" y="0" width="141.2" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="chain"/>
<text x="88.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Chain</tspan></text>
<!-- node indexer -->
<rect x="234" y="0" width="125.5" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="indexer"/>
<text x="250" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Индексатор</tspan></text>
<!-- node app -->
<rect x="535.8" y="0" width="130.2" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="app"/>
<text x="567.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рантайм</tspan></text>
<text x="551.8" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">приложения</tspan></text>
<!-- message agent -> app -->
<path d="M 2 161.4 L 592.9 161.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="agent" data-to="app" data-edge="m0"/>
<polygon points="598.9,161.4 588.9,156.9 588.9,165.9" fill="#3a3f47"/>
<rect x="194.6" y="114.4" width="211.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="207.6" cy="125.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="203.9" y="129.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="222.6" y="129.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предъявить ту же личность</tspan></text>
<text x="222.6" y="149.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">для новой задачи</tspan></text>
</g>
<!-- message app -> chain -->
<path d="M 598.9 228.4 L 151.4 228.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="chain" data-edge="m1"/>
<polygon points="145.4,228.4 155.4,232.9 155.4,223.9" fill="#3a3f47"/>
<rect x="283.4" y="181.4" width="177.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="296.4" cy="192.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="292.7" y="196.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="311.4" y="196.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверить аттестации</tspan></text>
<text x="311.4" y="216.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и связь с личностью</tspan></text>
</g>
<!-- message app -> indexer -->
<path d="M 598.9 295.4 L 304.7 295.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="indexer" data-edge="m2"/>
<polygon points="298.7,295.4 308.7,299.9 308.7,290.9" fill="#3a3f47"/>
<rect x="355.8" y="248.4" width="186.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="368.8" cy="259.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="365.1" y="263.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="383.8" y="263.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">получить вычисленную</tspan></text>
<text x="383.8" y="283.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">репутацию</tspan></text>
</g>
<!-- self app -->
<path d="M 598.9 319.4 L 568.9 319.4 L 568.9 387.9 L 591.9 387.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="app" data-edge="m3"/>
<polygon points="597.9,387.9 587.9,383.4 587.9,392.4" fill="#3a3f47"/>
<rect x="322.7" y="323.4" width="238.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="335.7" cy="334.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="332" y="338.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="350.7" y="338.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">своя политика допуска,</tspan></text>
<text x="350.7" y="358.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">глубина ревью и обязательные</tspan></text>
<text x="350.7" y="377.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">оси независимости</tspan></text>
</g>
<!-- message app -> agent -->
<path d="M 598.9 450.9 L 8 450.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="app" data-to="agent" data-edge="m4"/>
<polygon points="2,450.9 12,455.4 12,446.4" fill="#3a3f47"/>
<rect x="223.1" y="403.9" width="154.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<rect x="227.1" y="405.6" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="231.6" y="419.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="256.9" y="419.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск или отказ</tspan></text>
<text x="256.9" y="438.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">для новой задачи</tspan></text>
</g>
<!-- note -->
<rect x="83.4" y="470.9" width="577.6" height="78.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="196.2" y="496.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Формула репутации публикуется вместе с индексатором.</tspan></text>
<text x="225.4" y="514.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Аттестация не доказывает правильности ревью.</tspan></text>
<text x="180.7" y="532.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">История не является разрешением работать в любом проекте.</tspan></text>
</g>
</g>
</svg>
