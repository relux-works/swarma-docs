<svg xmlns="http://www.w3.org/2000/svg" width="667.7" height="582.2" viewBox="0 0 667.7 582.2">
<title>Переход, проверка: доска проверяет версию процесса и правила ядра в одной транзакции и при отказе состояния не меняет.</title>
<rect width="667.7" height="582.2" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(66.3 0)">
<line x1="0" y1="68.8" x2="0" y2="558.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="220.9" y1="45.4" x2="220.9" y2="558.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="500.3" y1="68.8" x2="500.3" y2="558.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="-44" y="345.3" width="568.3" height="192.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="-44" y1="433" x2="524.3" y2="433" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="-36" y="352.3" width="200.2" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="366.6" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ или устаревшая ревизия</tspan></text>
<rect x="-36" y="438" width="110.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="452.3" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">переход принят</tspan></text>
<!-- node proposer -->
<rect x="-66.3" y="0" width="132.6" height="68.8" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="proposer"/>
<text x="-50.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оркестратор</tspan></text>
<text x="-48.8" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">или человек</tspan></text>
<!-- node flow -->
<rect x="139.5" y="0" width="162.8" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="flow"/>
<text x="155.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Движок потоков</tspan></text>
<!-- node kernel -->
<rect x="423.3" y="0" width="154.2" height="68.8" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="kernel"/>
<text x="454.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хранилище</tspan></text>
<text x="439.3" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и правила ядра</tspan></text>
<!-- message proposer -> flow -->
<path d="M 2 120.3 L 212.9 120.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="proposer" data-to="flow" data-edge="m0"/>
<polygon points="218.9,120.3 208.9,115.8 208.9,124.8" fill="#3a3f47"/>
<rect x="16" y="92.8" width="188.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="29" cy="103.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="108.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="44" y="108.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предложение перехода</tspan></text>
</g>
<!-- self flow -->
<path d="M 222.9 144.3 L 252.9 144.3 L 252.9 193.3 L 229.9 193.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="flow" data-to="flow" data-edge="m1"/>
<polygon points="223.9,193.3 233.9,197.8 233.9,188.8" fill="#3a3f47"/>
<rect x="260.9" y="148.3" width="213.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="273.9" cy="159.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="270.2" y="163.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="288.9" y="163.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">версия процесса</tspan></text>
<text x="288.9" y="183.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и настраиваемые проверки</tspan></text>
</g>
<!-- message flow -> kernel -->
<path d="M 222.9 256.3 L 492.3 256.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="flow" data-to="kernel" data-edge="m2"/>
<polygon points="498.3,256.3 488.3,251.8 488.3,260.8" fill="#3a3f47"/>
<rect x="278.3" y="209.3" width="164.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="291.3" cy="220.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="287.6" y="224.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="306.3" y="224.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ожидаемая ревизия</tspan></text>
<text x="306.3" y="244.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и предложение</tspan></text>
</g>
<!-- self kernel -->
<path d="M 498.3 280.3 L 468.3 280.3 L 468.3 329.3 L 491.3 329.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="kernel" data-to="kernel" data-edge="m3"/>
<polygon points="497.3,329.3 487.3,324.8 487.3,333.8" fill="#3a3f47"/>
<rect x="257.2" y="284.3" width="203.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="270.2" cy="295.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="266.5" y="299.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="285.2" y="299.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">правила ядра и право</tspan></text>
<text x="285.2" y="319.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">роли в той же транзакции</tspan></text>
</g>
<!-- message kernel -> proposer -->
<path d="M 498.3 409 L 8 409" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="kernel" data-to="proposer" data-edge="m4"/>
<polygon points="2,409 12,413.5 12,404.5" fill="#c8285f"/>
<rect x="136.7" y="381.5" width="226.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="149.7" cy="392.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="146" y="396.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="164.7" y="396.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ; состояние не меняется</tspan></text>
</g>
<!-- self kernel -->
<path d="M 498.3 473.2 L 468.3 473.2 L 468.3 522.2 L 491.3 522.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="kernel" data-to="kernel" data-edge="m5"/>
<polygon points="497.3,522.2 487.3,517.7 487.3,526.7" fill="#3a3f47"/>
<rect x="276.7" y="477.2" width="183.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="289.7" cy="487.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="286" y="492.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="304.7" y="492.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">статус и намерение</tspan></text>
<text x="304.7" y="511.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">дальнейшего действия</tspan></text>
</g>
</g>
</g>
</svg>
