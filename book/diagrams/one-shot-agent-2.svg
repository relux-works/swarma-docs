<svg xmlns="http://www.w3.org/2000/svg" width="825.6" height="849.4" viewBox="0 0 825.6 849.4">
<title>Разовый запуск, исполнение в режиме с читаемым токеном: запускатель сбрасывает права, аренду исполнитель получает уже под UID агента, диспетчер сверяет эффекты.</title>
<rect width="825.6" height="849.4" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(60 0)">
<line x1="0" y1="45.4" x2="0" y2="825.4" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="225.7" y1="45.4" x2="225.7" y2="825.4" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="444.9" y1="70.9" x2="444.9" y2="825.4" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="661.6" y1="68.8" x2="661.6" y2="825.4" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node disp -->
<rect x="-58.1" y="0" width="116.2" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="disp"/>
<text x="-42.1" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Диспетчер</tspan></text>
<!-- node launcher -->
<rect x="161.2" y="0" width="128.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="launcher"/>
<text x="177.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Запускатель</tspan></text>
<!-- node exec -->
<rect x="377.6" y="0" width="134.5" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="exec"/>
<text x="393.6" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="395.7" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">под UID агента</tspan></text>
<!-- node broker -->
<rect x="581.6" y="0" width="160" height="68.8" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="broker"/>
<text x="597.6" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер учётных</tspan></text>
<text x="631.3" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">данных</tspan></text>
<!-- message disp -> launcher -->
<path d="M 2 141.9 L 217.7 141.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="disp" data-to="launcher" data-edge="m0"/>
<polygon points="223.7,141.9 213.7,137.4 213.7,146.4" fill="#3a3f47"/>
<rect x="21.5" y="94.9" width="182.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="34.5" cy="105.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="30.8" y="110.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="49.5" y="110.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запустить одобренный</tspan></text>
<text x="49.5" y="129.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">исполнитель с планом</tspan></text>
</g>
<!-- self launcher -->
<path d="M 227.7 165.9 L 257.7 165.9 L 257.7 253.9 L 234.7 253.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="launcher" data-to="launcher" data-edge="m1"/>
<polygon points="228.7,253.9 238.7,258.4 238.7,249.4" fill="#3a3f47"/>
<rect x="265.7" y="169.9" width="137.1" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="278.7" cy="180.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="275" y="185.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="293.7" y="185.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">квитанция</tspan></text>
<text x="293.7" y="204.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">старта под root;</tspan></text>
<text x="293.7" y="224.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сброс групп,</tspan></text>
<text x="293.7" y="243.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">GID и UID</tspan></text>
</g>
<!-- message launcher -> exec -->
<path d="M 227.7 316.9 L 436.9 316.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="launcher" data-to="exec" data-edge="m2"/>
<polygon points="442.9,316.9 432.9,312.4 432.9,321.4" fill="#3a3f47"/>
<rect x="241.7" y="269.9" width="187.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="254.7" cy="280.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="251" y="285.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="269.7" y="285.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">план на дескрипторе 3;</tspan></text>
<text x="269.7" y="304.6" font-size="15" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">exec</tspan></text>
</g>
<!-- message exec -> broker -->
<path d="M 446.9 403.4 L 653.6 403.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="exec" data-to="broker" data-edge="m3"/>
<polygon points="659.6,403.4 649.6,398.9 649.6,407.9" fill="#3a3f47"/>
<rect x="487.9" y="336.9" width="130.6" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="500.9" cy="347.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="497.2" y="352.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="515.9" y="352.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">собственное</tspan></text>
<text x="515.9" y="371.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">соединение;</tspan></text>
<text x="515.9" y="391.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запрос аренды</tspan></text>
</g>
<!-- message broker -> exec -->
<path d="M 659.6 470.4 L 452.9 470.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="exec" data-edge="m4"/>
<polygon points="446.9,470.4 456.9,474.9 456.9,465.9" fill="#3a3f47"/>
<rect x="488.6" y="423.4" width="129.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<rect x="492.6" y="425.1" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="497.1" y="438.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="522.4" y="438.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">разрешённый</tspan></text>
<text x="522.4" y="458.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал</tspan></text>
</g>
<!-- note -->
<rect x="384.9" y="490.4" width="336.8" height="78.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="434.9" y="515.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">В режиме без секретов у агента шагов</tspan></text>
<text x="437.2" y="533.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">9 и 10 нет: харнес получает заглушку,</tspan></text>
<text x="435.4" y="552.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">аренду держит шлюз учётных данных.</tspan></text>
<!-- self exec -->
<path d="M 446.9 585 L 476.9 585 L 476.9 614.5 L 453.9 614.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="exec" data-to="exec" data-edge="m6"/>
<polygon points="447.9,614.5 457.9,619 457.9,610" fill="#3a3f47"/>
<rect x="484.9" y="589" width="150.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<rect x="488.9" y="590.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="493.4" y="604.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">11</tspan></text>
<text x="518.6" y="604.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запустить харнес</tspan></text>
</g>
<!-- message exec -> disp -->
<path d="M 442.9 658 L 8 658" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="exec" data-to="disp" data-edge="m7"/>
<polygon points="2,658 12,662.5 12,653.5" fill="#3a3f47"/>
<rect x="130.5" y="630.5" width="183.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m7">
<rect x="134.5" y="632.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="139" y="645.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">12</tspan></text>
<text x="164.3" y="645.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат исполнения</tspan></text>
</g>
<!-- self disp -->
<path d="M 2 682 L 32 682 L 32 731 L 9 731" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="disp" data-to="disp" data-edge="m8"/>
<polygon points="3,731 13,735.5 13,726.5" fill="#3a3f47"/>
<rect x="40" y="686" width="159.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m8">
<rect x="44" y="687.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="48.5" y="701.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">13</tspan></text>
<text x="73.7" y="701.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сверить эффекты</tspan></text>
<text x="73.7" y="720.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и провести уборку</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="747" width="781.6" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="199.8" y="772.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">При потере ответа сверяют тот же эффект.</tspan></text>
<text x="181.9" y="790.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Неизвестный исход не разрешает новый запуск.</tspan></text>
</g>
</g>
</svg>
