<svg xmlns="http://www.w3.org/2000/svg" width="768.3" height="528.8" viewBox="0 0 768.3 528.8">
<title>Передача: ответственность остаётся у прежнего держателя до подтверждения первого действия получателя.</title>
<rect width="768.3" height="528.8" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(116.6 0)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="283.8" cy="11" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node sent -->
<rect x="220.9" y="59" width="125.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="sent"/>
<text x="236.9" y="85.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Отправлена</tspan></text>
