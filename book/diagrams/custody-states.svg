<rect x="213.6" y="164.4" width="190.5" height="111" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_acc"/>
<text x="226.5" y="187.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">"Беру" не является первым</tspan></text>
<text x="247.3" y="205.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">действием. Поздняя</tspan></text>
<text x="225.6" y="224.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">квитанция по неудавшейся</tspan></text>
<text x="258.7" y="242.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">или заменённой</tspan></text>
<text x="239.5" y="260.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">передаче отклоняется.</tspan></text>
<path d="M 169.8 219.9 L 213.6 219.9" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="acc" data-to="note_acc"/>
