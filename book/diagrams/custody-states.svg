<text x="-116.6" y="272.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подтверждено до</tspan><tspan x="4.3" font-family="PT Mono, monospace" font-weight="bold">act_by</tspan></text>
</g>
