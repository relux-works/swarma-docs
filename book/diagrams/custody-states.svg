<text x="473.1" y="240.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отмена или замена</tspan></text>
</g>
<!-- link acc -> fail -->
<path d="M 150.6 242.9 C 165.9 253.4 184.9 265.7 202.8 275.4 C 220.3 284.9 228.9 280.3 243.8 293.4 C 260.6 308.1 253.1 321.6 269.8 336.4 C 276.5 342.3 284.2 347.4 292.2 351.9 L 293.1 352.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="acc" data-to="fail" data-edge="e4"/>
<polygon points="298.4,355.2 291.6,346.5 287.4,354.5" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="273.8" y="309.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">срок действия прошёл;</tspan></text>
<text x="273.8" y="329.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отмена или замена</tspan></text>
</g>
<!-- link done -> end_done -->
<path d="M 59.8 400.1 C 59.8 420.8 59.8 451.5 59.8 471.3 L 59.8 472.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="done" data-to="end_done" data-edge="e5"/>
<polygon points="59.8,478.6 64.3,468.6 55.3,468.6" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="67.8" y="444.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">держатель: новый</tspan></text>
</g>
<!-- link fail -> end_fail -->
<path d="M 358.8 400.1 C 358.8 420.8 358.8 451.5 358.8 471.3 L 358.8 472.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="fail" data-to="end_fail" data-edge="e6"/>
<polygon points="358.8,478.6 363.3,468.6 354.3,468.6" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="366.8" y="434.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">держатель: прежний;</tspan></text>
<text x="366.8" y="454.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">обязательство открыто</tspan></text>
</g>
</g>
</g>
</svg>
