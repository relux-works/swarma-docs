<svg xmlns="http://www.w3.org/2000/svg" width="893.9" height="389.2" viewBox="0 0 893.9 389.2">
<title>Лёгкий клиент получает заголовки и фильтры отдельно от исторических сегментов и услуг индексаторов.</title>
<rect width="893.9" height="389.2" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(16.5 0)">
<!-- graphviz 14.0.4 -->
<!-- node client -->
<rect x="264.8" y="0" width="146.3" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="client"/>
<text x="280.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Лёгкий клиент</tspan></text>
<!-- node full -->
<rect x="412.7" y="124.4" width="192.5" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="full"/>
<text x="456.5" y="150.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Полные узлы</tspan></text>
<text x="428.7" y="179.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">заголовки, тела, снимки;</tspan></text>
<text x="428.7" y="198.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">сегменты только свежие</tspan></text>
<!-- node indexer -->
<rect x="44.4" y="274.8" width="229.1" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="indexer"/>
<text x="105.9" y="300.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Индексаторы</tspan></text>
<text x="67.4" y="329.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вся история и вычисленный</tspan></text>
<text x="60.4" y="349" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">индекс, который они продают</tspan></text>
<!-- node archivist -->
<rect x="564.1" y="274.8" width="239.6" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="archivist"/>
<text x="640.5" y="300.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Архивисты</tspan></text>
<text x="582.6" y="329.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">старые сегменты как торренты</tspan></text>
<text x="580.1" y="349" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">по политике своей окрестности</tspan></text>
<!-- node service -->
<rect x="295.3" y="274.8" width="247.2" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="service"/>
<text x="353.9" y="300.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сервисные узлы</tspan></text>
<text x="311.3" y="329.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вторая фаза: оплата за проверку</tspan></text>
<text x="317.3" y="349" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">хранения случайного сегмента</tspan></text>
<!-- link client -> full -->
<path d="M 363.9 45.7 C 386.9 65.2 421.4 94.5 451 119.5 L 451.9 120.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="client" data-to="full" data-edge="e0"/>
<polygon points="456.4,124.1 451.7,114.3 445.9,121.1" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="437.6" y="79.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">заголовки от checkpoint</tspan></text>
<text x="437.6" y="99.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и фильтры</tspan></text>
</g>
<!-- link client -> archivist -->
<path d="M 411.3 26.1 C 480.1 29.8 576.5 39.2 604.9 63.4 C 664.5 114.1 679.9 208.6 683.4 267.4 L 683.5 268.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="client" data-to="archivist" data-edge="e1"/>
<polygon points="683.8,274.7 687.8,264.5 678.8,265" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="684.8" y="187" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">совпавшие сегменты</tspan></text>
<text x="684.8" y="206.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и доказательство Меркла</tspan></text>
</g>
<!-- link client -> indexer -->
<path d="M 264.6 36.2 C 178.9 52.4 45 83.6 15.9 124.4 C -7.4 157.1 -2.3 179 15.9 214.8 C 27.1 236.7 45.2 255.1 64.9 270.1 L 66 270.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="client" data-to="indexer" data-edge="e2"/>
<polygon points="70.8,274.4 65.4,264.9 60.1,272.1" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="-16.5" y="33.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">поиск, "что обсуждают",</tspan></text>
<text x="-16.5" y="52.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">первая загрузка</tspan></text>
</g>
<!-- link client -> indexer -->
<path d="M 303.4 45.9 C 277.6 64.1 243.2 92.1 221.9 124.4 C 206.2 148.1 185.5 218.3 172.2 267.5 L 171.8 268.9" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 5" class="edge" data-from="client" data-to="indexer" data-edge="e3"/>
<polygon points="170.3,274.7 177.2,266.2 168.5,263.8" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="226.2" y="164.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сверка хэшей состояния</tspan></text>
<text x="226.2" y="183.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">нескольких индексаторов</tspan></text>
</g>
<!-- link full -> indexer -->
<path d="M 412.4 209.2 C 406.8 211.1 401.3 213 395.9 214.8 C 366.6 224.4 357.7 221.8 328.9 232.8 C 300.9 243.6 271.3 257.5 244.9 271.1 L 243.5 271.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="full" data-to="indexer" data-edge="e4"/>
<polygon points="238.2,274.5 249.2,273.9 245,265.9" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="328.4" y="253.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">новые блоки</tspan></text>
</g>
<!-- link full -> archivist -->
<path d="M 531.8 215.1 C 540.7 229.6 552 245 564.9 256.8 C 570.1 261.6 575.8 266.1 581.8 270.3 L 582.8 271.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="full" data-to="archivist" data-edge="e5"/>
<polygon points="587.8,274.5 582.1,265.1 577,272.5" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="568.9" y="249.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">новые блоки</tspan></text>
</g>
<!-- link full -> service -->
<path d="M 448.9 215.3 C 444 220.8 439.5 226.6 435.9 232.8 C 429.9 243.2 425.9 255.3 423.4 267.1 L 423.1 268.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="full" data-to="service" data-edge="e6"/>
<polygon points="421.9,274.4 428.3,265.5 419.4,263.8" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="439.9" y="249.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">новые блоки</tspan></text>
</g>
</g>
</g>
</svg>
