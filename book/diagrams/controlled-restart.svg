<svg xmlns="http://www.w3.org/2000/svg" width="700.3" height="874.7" viewBox="0 0 700.3 874.7">
<title>Контролируемый перезапуск: забор закрыт до сверки исполнения и доставки, неизвестный исход остаётся неизвестным.</title>
<rect width="700.3" height="874.7" fill="#ffffff"/>
