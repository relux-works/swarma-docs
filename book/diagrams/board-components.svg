<svg xmlns="http://www.w3.org/2000/svg" width="845.2" height="672.9" viewBox="0 0 845.2 672.9">
<title>Архитектура доски: плейбук задаёт процесс, правила ядра ограничивают каждое изменение состояния.</title>
<rect width="845.2" height="672.9" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(-8 0)">
<!-- graphviz 14.0.4 -->
<!-- group board -->
<rect x="8" y="95.4" width="650" height="352.7" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="board"/>
<!-- node playbook -->
<rect x="71.9" y="0" width="180.2" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="playbook"/>
<text x="87.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Плейбук с версией</tspan></text>
<!-- node human -->
<rect x="274" y="0" width="100" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="human"/>
<text x="291" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Человек</tspan></text>
<!-- node flow -->
<rect x="161.6" y="148.4" width="162.8" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="flow"/>
<text x="177.6" y="174.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Движок потоков</tspan></text>
<!-- node kernel -->
<rect x="66.5" y="253.8" width="151" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="kernel"/>
<text x="87.1" y="279.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Правила ядра</tspan></text>
<text x="82.5" y="308.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">в каждой мутации</tspan></text>
<!-- node tasks -->
<rect x="26.1" y="384.7" width="219.7" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="tasks"/>
<text x="42.1" y="410.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Задачи, цели и ресурсы</tspan></text>
<!-- node router -->
<rect x="274.4" y="266.5" width="139.1" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="router"/>
<text x="290.4" y="292.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Роутер ролей</tspan></text>
<!-- node spawn -->
<rect x="267.9" y="384.7" width="152.1" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="spawn"/>
<text x="283.9" y="410.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Запрос запуска</tspan></text>
<!-- node goals -->
<rect x="442.4" y="384.7" width="197.3" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="goals"/>
<text x="458.4" y="410.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Клиент целей сессии</tspan></text>
<!-- node dispatcher -->
<rect x="284.9" y="498.1" width="116.2" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="dispatcher"/>
<text x="300.9" y="524.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Диспетчер</tspan></text>
<!-- node host -->
<rect x="479.5" y="498.1" width="125.1" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="495.5" y="524.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий</tspan></text>
<!-- node actor -->
<rect x="453.2" y="603.5" width="177.5" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="actor"/>
<text x="469.2" y="629.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель роли</tspan></text>
<!-- link playbook -> flow -->
<path d="M 174.1 45.6 C 188.3 71.2 211.7 113.5 227.2 141.6 L 227.9 142.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="playbook" data-to="flow" data-edge="e0"/>
<polygon points="230.8,148 229.9,137.1 222,141.5" fill="#3a3f47"/>
<!-- link human -> flow -->
<path d="M 311.9 45.6 C 297.7 71.2 274.3 113.5 258.8 141.6 L 258.1 142.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="human" data-to="flow" data-edge="e1"/>
<polygon points="255.2,148 264,141.5 256.1,137.1" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="303.9" y="79.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подтверждение версии</tspan></text>
</g>
<!-- link flow -> kernel -->
<path d="M 170.2 194.3 C 162.9 199.1 156.2 204.8 151 211.8 C 143.7 221.6 140.5 234.1 139.3 246.1 L 139.2 247.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="flow" data-to="kernel" data-edge="e2"/>
<polygon points="138.9,253.5 144,243.8 135,243.3" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="155.1" y="228.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предложение перехода</tspan></text>
</g>
<!-- link kernel -> tasks -->
<path d="M 140.2 325.1 C 139.3 341.6 138.3 361.2 137.5 377 L 137.4 378.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="kernel" data-to="tasks" data-edge="e3"/>
<polygon points="137.1,384.4 142.1,374.6 133.2,374.2" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="147.4" y="355.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допустимая мутация</tspan></text>
</g>
<!-- link flow -> router -->
<path d="M 295.9 194.1 C 303.7 199.1 311.1 204.9 317 211.8 C 328.4 225.1 335.1 243.6 339 259 L 339.3 260.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="flow" data-to="router" data-edge="e4"/>
<polygon points="340.7,266.3 342.8,255.6 334,257.6" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="347" y="254" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">следующий владелец роли</tspan></text>
</g>
<!-- link router -> spawn -->
<path d="M 344 312.4 C 344 330.7 344 356.9 344 377 L 344 378.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="router" data-to="spawn" data-edge="e5"/>
<polygon points="344,384.4 348.5,374.4 339.5,374.4" fill="#3a3f47"/>
<!-- link router -> goals -->
<path d="M 381.5 312.4 C 414.5 331.8 462.6 360.2 497.3 380.6 L 498.4 381.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="router" data-to="goals" data-edge="e6"/>
<polygon points="503.6,384.4 497.3,375.4 492.7,383.2" fill="#3a3f47"/>
<!-- link spawn -> dispatcher -->
<path d="M 343.4 430.2 C 343.3 438.4 343.1 447.7 343 456.1 C 342.9 467.3 342.9 479.7 342.9 490.5 L 342.9 491.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="spawn" data-to="dispatcher" data-edge="e7"/>
<polygon points="342.9,497.7 347.4,487.7 338.4,487.7" fill="#3a3f47"/>
<g class="label" data-edge="e7">
<text x="351" y="472.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доска сама не исполняет</tspan></text>
</g>
<!-- link goals -> host -->
<path d="M 541.2 430.4 C 541.4 447.6 541.6 471.8 541.7 490.6 L 541.8 491.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="goals" data-to="host" data-edge="e8"/>
<polygon points="541.8,497.8 546.2,487.8 537.2,487.9" fill="#3a3f47"/>
<g class="label" data-edge="e8">
<text x="549.6" y="473.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ревизия цели</tspan></text>
</g>
<!-- link host -> actor -->
<path d="M 542 544 C 542 559.1 542 579.3 542 595.8 L 542 597.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="actor" data-edge="e9"/>
<polygon points="542,603.1 546.5,593.1 537.5,593.1" fill="#3a3f47"/>
<g class="label" data-edge="e9">
<text x="550" y="579.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">цель сессии</tspan></text>
</g>
<!-- link actor -> goals -->
<path d="M 612.2 603.1 C 619.5 598.3 626 592.5 631 585.5 C 689.9 502.7 656.3 482 640 456.1 C 634.5 447.3 626.8 440.1 618.2 434.2 L 617.2 433.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="actor" data-to="goals" data-edge="e10"/>
<polygon points="612.1,430.3 618.1,439.5 622.9,431.9" fill="#3a3f47"/>
<g class="label" data-edge="e10">
<text x="672.3" y="506.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">исход:</tspan></text>
<text x="672.3" y="525.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предложение перехода</tspan></text>
</g>
<!-- group label board -->
<rect x="20" y="105.4" width="61.2" height="18.9" fill="#ffffff" class="plate"/>
<text x="26" y="119.7" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ДОСКА</tspan></text>
</g>
</g>
</svg>
