<svg xmlns="http://www.w3.org/2000/svg" width="730.7" height="801" viewBox="0 0 730.7 801">
<title>Долгая сессия, ввод: раннер под UID агента держит PTY или app-server, а очередью ввода владеет хост сессий.</title>
<rect width="730.7" height="801" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(74 0)">
<line x1="0" y1="70.9" x2="0" y2="777" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="205.7" y1="70.9" x2="205.7" y2="777" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="432.9" y1="70.9" x2="432.9" y2="777" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="582.6" y1="45.4" x2="582.6" y2="777" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="161.7" y="94.9" width="445" height="270.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="161.7" y1="221.6" x2="606.6" y2="221.6" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="169.7" y="101.9" width="184.8" height="20.2" fill="#ffffff" class="plate"/>
<text x="175.7" y="116.2" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим с читаемым токеном</tspan></text>
<rect x="169.7" y="226.6" width="189.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="175.7" y="240.9" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим без секретов у агента</tspan></text>
<!-- node host -->
<rect x="-74" y="0" width="148" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="-46.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий</tspan></text>
<text x="-58" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">служебная учётка</tspan></text>
<!-- node runner -->
<rect x="145.4" y="0" width="120.6" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="runner"/>
<text x="177" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Раннер</tspan></text>
<text x="161.4" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">учётка агента</tspan></text>
<!-- node harness -->
<rect x="353.1" y="0" width="159.5" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="404.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес</tspan></text>
<text x="369.1" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">та же учётка агента</tspan></text>
<!-- node broker -->
<rect x="532.6" y="0" width="100" height="45.4" rx="12" fill="#fff8e1" stroke="#a8740a" stroke-width="2" class="box" data-id="broker"/>
<text x="554" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- message runner -> broker -->
<path d="M 207.7 197.6 L 574.6 197.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="runner" data-to="broker" data-edge="m0"/>
<polygon points="580.6,197.6 570.6,193.1 570.6,202.1" fill="#3a3f47"/>
<rect x="309.2" y="131.1" width="169.8" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="322.2" cy="141.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="318.6" y="146.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="337.2" y="146.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">собственное</tspan></text>
<text x="337.2" y="165.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">соединение для</tspan></text>
<text x="337.2" y="185.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аренды и продления</tspan></text>
</g>
<!-- self runner -->
<path d="M 207.7 261.8 L 237.7 261.8 L 237.7 349.8 L 214.7 349.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="runner" data-to="runner" data-edge="m1"/>
<polygon points="208.7,349.8 218.7,354.3 218.7,345.3" fill="#3a3f47"/>
<rect x="245.7" y="265.8" width="161.2" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="258.7" cy="276.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="255" y="281.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="273.7" y="281.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">только заглушка;</tspan></text>
<text x="273.7" y="300.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аренду держит</tspan></text>
<text x="273.7" y="320.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и продлевает шлюз</tspan></text>
<text x="273.7" y="339.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">учётных данных</tspan></text>
</g>
<!-- message runner -> harness -->
<path d="M 207.7 426.8 L 424.9 426.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="runner" data-to="harness" data-edge="m2"/>
<polygon points="430.9,426.8 420.9,422.3 420.9,431.3" fill="#3a3f47"/>
<rect x="255.2" y="379.8" width="128.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="268.2" cy="390.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="264.5" y="395.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="283.2" y="395.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">держать PTY</tspan></text>
<text x="283.2" y="414.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">или app-server</tspan></text>
</g>
<!-- message runner -> host -->
<path d="M 203.7 493.8 L 8 493.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="runner" data-to="host" data-edge="m3"/>
<polygon points="2,493.8 12,498.3 12,489.3" fill="#3a3f47"/>
<rect x="16" y="446.8" width="173.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="29" cy="457.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="462.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="44" y="462.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">регистрация текущей</tspan></text>
<text x="44" y="481.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">эпохи контроллера</tspan></text>
</g>
<!-- self host -->
<path d="M 2 517.8 L 32 517.8 L 32 566.8 L 9 566.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="host" data-edge="m4"/>
<polygon points="3,566.8 13,571.3 13,562.3" fill="#3a3f47"/>
<rect x="40" y="521.8" width="139.6" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="53" cy="532.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="49.3" y="537.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="68" y="537" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск, очередь</tspan></text>
<text x="68" y="556.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и забор</tspan></text>
</g>
<!-- message host -> runner -->
<path d="M 2 629.8 L 197.7 629.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="runner" data-edge="m5"/>
<polygon points="203.7,629.8 193.7,625.3 193.7,634.3" fill="#3a3f47"/>
<rect x="19.7" y="582.8" width="166.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="32.7" cy="593.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="29" y="598.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="47.7" y="598" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ввод текущей эпохи</tspan></text>
<text x="47.7" y="617.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">на границе хода</tspan></text>
</g>
<!-- message runner -> harness -->
<path d="M 207.7 696.8 L 424.9 696.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="runner" data-to="harness" data-edge="m6"/>
<polygon points="430.9,696.8 420.9,692.3 420.9,701.3" fill="#3a3f47"/>
<rect x="252.8" y="649.8" width="132.9" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<rect x="256.8" y="651.5" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="261.3" y="665.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="286.6" y="665" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">единственный</tspan></text>
<text x="286.6" y="684.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">путь ввода</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="716.8" width="325.7" height="42.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="-35.3" y="742.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Старая эпоха не даёт права доставлять ввод.</tspan></text>
</g>
</g>
</svg>
