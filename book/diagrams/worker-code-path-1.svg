<svg xmlns="http://www.w3.org/2000/svg" width="739.7" height="637" viewBox="0 0 739.7 637">
<title>Путь кода работника, выгрузка: результат выгружается после остановки всех процессов, запрещённые пути отклоняют выгрузку целиком.</title>
<rect width="739.7" height="637" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(60 0)">
<line x1="0" y1="45.4" x2="0" y2="613" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="320.9" y1="45.4" x2="320.9" y2="613" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="557.2" y1="45.4" x2="557.2" y2="613" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="276.9" y="347.9" width="317.1" height="190.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="276.9" y1="435.6" x2="594" y2="435.6" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="284.9" y="354.9" width="289.1" height="20.2" fill="#ffffff" class="plate"/>
<text x="290.9" y="369.2" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запрещённые пути или нарушение пределов</tspan></text>
<rect x="284.9" y="440.6" width="134.2" height="20.2" fill="#ffffff" class="plate"/>
<text x="290.9" y="454.9" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат допустим</tspan></text>
<!-- node worker -->
<rect x="-53.2" y="0" width="106.4" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="worker"/>
<text x="-37.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Работник</tspan></text>
<!-- node dispatcher -->
<rect x="262.8" y="0" width="116.2" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="dispatcher"/>
<text x="278.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Диспетчер</tspan></text>
<!-- node board -->
<rect x="458.8" y="0" width="196.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="board"/>
<text x="474.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оркестратор и доска</tspan></text>
<!-- message dispatcher -> worker -->
<path d="M 318.9 116.4 L 8 116.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="worker" data-edge="m0"/>
<polygon points="2,116.4 12,120.9 12,111.9" fill="#3a3f47"/>
<rect x="69.9" y="69.4" width="181" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="82.9" cy="80.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="79.3" y="84.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="97.9" y="84.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">раскладка точной</tspan></text>
<text x="97.9" y="104.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">базы и области записи</tspan></text>
</g>
<!-- self worker -->
<path d="M 2 140.4 L 32 140.4 L 32 169.9 L 9 169.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="worker" data-to="worker" data-edge="m1"/>
<polygon points="3,169.9 13,174.4 13,165.4" fill="#3a3f47"/>
<rect x="40" y="144.4" width="254.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="53" cy="155.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="49.3" y="159.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="68" y="159.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">изменение дерева в своей учётке</tspan></text>
</g>
<!-- message worker -> dispatcher -->
<path d="M 2 213.4 L 312.9 213.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="worker" data-to="dispatcher" data-edge="m2"/>
<polygon points="318.9,213.4 308.9,208.9 308.9,217.9" fill="#3a3f47"/>
<rect x="61.7" y="185.9" width="197.5" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="74.7" cy="196.7" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="71" y="201.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="89.7" y="201.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">предложение результата</tspan></text>
</g>
<!-- message dispatcher -> worker -->
<path d="M 318.9 280.4 L 8 280.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="worker" data-edge="m3"/>
<polygon points="2,280.4 12,284.9 12,275.9" fill="#3a3f47"/>
<rect x="58.1" y="233.4" width="204.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="71.1" cy="244.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="67.4" y="248.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="86.1" y="248.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">остановка всех процессов</tspan></text>
<text x="86.1" y="268.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и подтверждение тишины</tspan></text>
</g>
<!-- message dispatcher -> worker -->
<path d="M 318.9 327.9 L 8 327.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="worker" data-edge="m4"/>
<polygon points="2,327.9 12,332.4 12,323.4" fill="#3a3f47"/>
<rect x="28.5" y="300.4" width="264" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="41.5" cy="311.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="37.8" y="315.8" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="56.5" y="315.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ограниченная выгрузка изменений</tspan></text>
</g>
<!-- message dispatcher -> board -->
<path d="M 322.9 411.6 L 549.2 411.6" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="dispatcher" data-to="board" data-edge="m5"/>
<polygon points="555.2,411.6 545.2,407.1 545.2,416.1" fill="#c8285f"/>
<rect x="336.9" y="384.1" width="204.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="349.9" cy="394.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="346.2" y="399.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="364.9" y="399.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ в выгрузке целиком</tspan></text>
</g>
<!-- message dispatcher -> board -->
<path d="M 322.9 518.8 L 549.2 518.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="dispatcher" data-to="board" data-edge="m6"/>
<polygon points="555.2,518.8 545.2,514.3 545.2,523.3" fill="#3a3f47"/>
<rect x="339.3" y="471.8" width="199.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="352.3" cy="482.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="348.6" y="487.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="367.3" y="487" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат с дайджестами</tspan></text>
<text x="367.3" y="506.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">заказчику</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="552.8" width="677.2" height="42.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="57.9" y="578.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Дом не удаляют до сохранения результата или явной отмены выгрузки.</tspan></text>
</g>
</g>
</svg>
