<svg xmlns="http://www.w3.org/2000/svg" width="744" height="922.7" viewBox="0 0 744 922.7">
<title>Маршрутизатор по очереди применяет допуск, закрепки, правила, качество и бюджет и возвращает решение или явный отказ.</title>
<rect width="744" height="922.7" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node profile -->
<rect x="28.4" y="0" width="183.2" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="profile"/>
<text x="54.6" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Профиль задачи</tspan></text>
<text x="44.4" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">роль, класс, сложность,</tspan></text>
<text x="61.1" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">бюджет, закрепки</tspan></text>
<!-- node c1 -->
<rect x="0" y="127.4" width="239.9" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c1"/>
<text x="65.8" y="153.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1. Кандидаты</tspan></text>
<text x="62.9" y="182.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">допуск доски для</tspan></text>
<text x="53" y="201.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">роли, пересечённый</tspan></text>
<text x="48.3" y="221.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">с доступными парами</tspan></text>
<!-- node c2 -->
<rect x="0" y="274.3" width="239.9" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c2"/>
<text x="73.3" y="300.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2. Закрепки</tspan></text>
<text x="51.4" y="329" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">явные среда, модель</tspan></text>
<text x="48.1" y="348.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и effort вызывающего</tspan></text>
<!-- node c3 -->
<rect x="0" y="413.4" width="239.9" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c3"/>
<text x="27.3" y="439.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3. Постоянные правила</tspan></text>
<text x="37.1" y="468.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">с областью по сложности</tspan></text>
<text x="69.3" y="487.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и деликатности</tspan></text>
<!-- node c4 -->
<rect x="0" y="552.5" width="239.9" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c4"/>
<text x="74.2" y="578.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4. Качество</tspan></text>
<text x="56.4" y="607.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">индекс кода, замер</tspan></text>
<text x="49.2" y="626.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ревью, общий индекс</tspan></text>
<!-- node q1 -->
<rect x="0" y="725.4" width="239.9" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q1"/>
<text x="42.2" y="751.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Качество известно?</tspan></text>
