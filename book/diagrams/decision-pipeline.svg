<text x="508.4" y="201.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и планка сложности</tspan></text>
<!-- node c6 -->
<rect x="470.8" y="284.1" width="206.4" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c6"/>
<text x="544.4" y="310.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6. Цена</tspan></text>
<text x="486.8" y="338.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">прайс, effort, класс оплаты</tspan></text>
<!-- node c7 -->
<rect x="470.8" y="401.7" width="206.4" height="113.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c7"/>
<text x="500.5" y="427.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7. Цель сложности</tspan></text>
<text x="502.4" y="451.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и режим бюджета</tspan></text>
<text x="506.1" y="479.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">стабильный порядок</tspan></text>
<text x="526.5" y="499.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">при равенстве</tspan></text>
<!-- node q2 -->
<rect x="470.8" y="575" width="206.4" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q2"/>
<text x="500.4" y="601.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Есть подходящие?</tspan></text>
<!-- node decision -->
<rect x="261.7" y="702.9" width="206.5" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="decision"/>
<text x="329.6" y="729" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Решение</tspan></text>
<text x="316.9" y="757.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">конфигурация,</tspan></text>
<text x="277.7" y="777.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">альтернативы, причины, id</tspan></text>
<!-- node refusal -->
<rect x="490" y="712.7" width="230" height="70.9" rx="12" fill="#fdeef3" stroke="#c8285f" stroke-width="2" class="box" data-id="refusal"/>
<text x="582.4" y="738.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Отказ</tspan></text>
<text x="506" y="767.3" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">no_qualified_candidate</tspan></text>
