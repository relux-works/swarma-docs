<rect x="0" y="853.3" width="239.9" height="45.4" rx="12" fill="#fdeef3" stroke="#c8285f" stroke-width="2" class="box" data-id="excluded"/>
<text x="16" y="879.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исключить из автовыбора</tspan></text>
<!-- node c5 -->
<rect x="470.8" y="146.9" width="206.4" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="c5"/>
