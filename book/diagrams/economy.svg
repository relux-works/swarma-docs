<svg xmlns="http://www.w3.org/2000/svg" width="763.7" height="537" viewBox="0 0 763.7 537">
<title>Эмиссия, плата за записи и имена, чаевые и приоритет курации оплачивают разные действия.</title>
<rect width="763.7" height="537" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(0 1.5)">
<!-- graphviz 14.0.4 -->
<!-- node emission -->
<rect x="0" y="254.3" width="255.7" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="emission"/>
<text x="94.5" y="280.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Эмиссия</tspan></text>
<!-- node names -->
<rect x="0" y="327.8" width="255.7" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="names"/>
<text x="67.1" y="353.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Плата за имена</tspan></text>
<text x="47.9" y="382.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">цена по длине и спросу;</tspan></text>
<text x="27.3" y="401.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">пополам: сжигание и майнеры</tspan></text>
<!-- node bytes -->
<rect x="0" y="440.6" width="255.7" height="70.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="bytes"/>
<text x="40.7" y="466.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Базовая плата за байт</tspan></text>
<text x="16" y="495.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">социальных записей и аттестаций</tspan></text>
<!-- node tips -->
<rect x="0" y="168.3" width="255.7" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="tips"/>
<text x="97.9" y="194.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Чаевые</tspan></text>
<!-- node priority -->
<rect x="0" y="1.3" width="255.7" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="priority"/>
<text x="50.5" y="27.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Приоритет курации</tspan></text>
<!-- node miners -->
<rect x="526.7" y="339.3" width="213" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="miners"/>
<text x="596" y="365.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Майнеры</tspan></text>
<!-- node service -->
<rect x="526.7" y="235.6" width="213" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="service"/>
<text x="568.2" y="261.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сервисные узлы</tspan></text>
<text x="593.2" y="290.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вторая фаза</tspan></text>
<!-- node burn -->
<rect x="526.7" y="412.8" width="213" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="burn"/>
<text x="594.8" y="438.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сжигание</tspan></text>
<text x="561" y="467.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">базовая плата за байт</tspan></text>
<text x="542.7" y="487" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и половина платы за имена</tspan></text>
<!-- node authors -->
<rect x="526.7" y="168.3" width="213" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="authors"/>
<text x="603.4" y="194.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Авторы</tspan></text>
<!-- node curators -->
<rect x="526.7" y="1.3" width="213" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="curators"/>
<text x="594.2" y="27.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Кураторы</tspan></text>
<!-- note curators -->
<rect x="539.2" y="89.8" width="188" height="56.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_curators"/>
<text x="552.3" y="113.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Приоритет не гарантирует</tspan></text>
<text x="551.2" y="131.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">одобрения или аудитории.</tspan></text>
<path d="M 633.2 46.7 L 633.2 89.8" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="curators" data-to="note_curators"/>
<!-- link emission -> miners -->
<path d="M 252.1 300.2 C 259.4 301.5 266.6 302.8 273.7 304 C 355.6 318.3 448.4 333.2 519 344.4 L 520.3 344.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="emission" data-to="miners" data-edge="e0"/>
<polygon points="526.2,345.5 517,339.5 515.6,348.4" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="340.5" y="304.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">безопасность</tspan></text>
</g>
<!-- link emission -> service -->
<path d="M 255.8 275.5 C 336.8 274.5 440.8 273.3 519 272.4 L 520.5 272.3" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 5" class="edge" data-from="emission" data-to="service" data-edge="e1"/>
<polygon points="526.5,272.3 516.4,267.9 516.5,276.9" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="278.2" y="261.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверяемый сервис, вторая фаза</tspan></text>
</g>
<!-- link names -> burn -->
<path d="M 255.9 401.6 C 261.9 402.8 267.8 403.9 273.7 405 C 355.5 420.1 448.4 433.7 519.1 443.4 L 520.4 443.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="names" data-to="burn" data-edge="e2"/>
<polygon points="526.4,444.4 517,438.5 515.8,447.5" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="356.3" y="407.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">половина</tspan></text>
</g>
<!-- link names -> miners -->
<path d="M 255.9 375.8 C 329.8 376.8 424.5 376.7 508.7 373 C 512.1 372.9 515.6 372.7 519.1 372.5 L 520.5 372.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="names" data-to="miners" data-edge="e3"/>
<polygon points="526.4,372 516.2,368.1 516.7,377.1" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="303.7" y="362.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">половина, на сутки блоков</tspan></text>
</g>
<!-- link bytes -> burn -->
<path d="M 256 479.9 C 329.9 481.1 424.6 480.9 508.7 475 C 512.1 474.8 515.6 474.5 519.2 474.2 L 520.5 474" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="bytes" data-to="burn" data-edge="e4"/>
<polygon points="526.5,473.5 516.1,469.9 516.9,478.9" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="358.5" y="467.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">сжигается</tspan></text>
</g>
<!-- link tips -> authors -->
<path d="M 255.8 191 C 336.8 191 440.8 191 519 191 L 520.5 191" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="tips" data-to="authors" data-edge="e5"/>
<polygon points="526.5,191 516.5,186.5 516.5,195.5" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="305.7" y="179.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">добровольная поддержка</tspan></text>
</g>
<!-- link priority -> curators -->
<path d="M 255.8 24 C 336.8 24 440.8 24 519 24 L 520.5 24" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="priority" data-to="curators" data-edge="e6"/>
<polygon points="526.5,24 516.5,19.5 516.5,28.5" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="309.4" y="12.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">приоритет рассмотрения</tspan></text>
</g>
</g>
</g>
</svg>
