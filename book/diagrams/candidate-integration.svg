<svg xmlns="http://www.w3.org/2000/svg" width="945.2" height="696.9" viewBox="0 0 945.2 696.9">
<title>Интеграция продвигает точную голову к неизменяемому кандидату только с адресованными ему одобрением и аттестациями.</title>
<rect width="945.2" height="696.9" fill="#ffffff"/>
<g transform="translate(12 12)">
