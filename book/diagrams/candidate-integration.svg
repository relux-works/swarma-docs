<text x="44.9" y="54.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">неизменяемый, над</tspan></text>
<text x="47.1" y="74.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">текущей головой</tspan><tspan x="162.8" font-family="PT Mono, monospace">M</tspan></text>
