<text x="52" y="182" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">после заморозки,</tspan></text>
<text x="17.5" y="201.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">по политике независимости</tspan></text>
