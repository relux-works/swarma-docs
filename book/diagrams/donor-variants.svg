<path d="M 247 303.9 C 268.9 294 291.9 284.8 314.2 277.9 C 421.2 244.9 465.6 294.8 563.2 239.9 C 598.1 220.3 593 199.4 621.2 170.9 C 630.1 162 639.7 152.9 649.4 144.2 L 650.4 143.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="c" data-to="project" data-edge="e5"/>
