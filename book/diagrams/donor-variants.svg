<svg xmlns="http://www.w3.org/2000/svg" width="852.2" height="510.4" viewBox="0 0 852.2 510.4">
<title>Варианты развёртывания донора: без разделения UID, с отдельными учётками и с песочницей; у каждого своя граница защиты, вариант A вне гарантии режима без секретов у агента, а границу C квалифицируют на каждой платформе.</title>
<rect width="852.2" height="510.4" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node b -->
<rect x="1.6" y="138.8" width="258.9" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="b"/>
<text x="42.5" y="164.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">B: две учётные записи</tspan></text>
<text x="17.6" y="193.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">мост и держатель учётных данных</tspan></text>
<text x="66.6" y="212.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">не под UID харнеса</tspan></text>
<!-- node a -->
<rect x="12.6" y="22.8" width="237" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="a"/>
<text x="55.4" y="48.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">A: запертый запуск</tspan></text>
<text x="28.6" y="77.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без администратора; один UID,</tspan></text>
<text x="79.1" y="96.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">границы ОС нет</tspan></text>
<!-- node c -->
<rect x="0" y="258.8" width="262.2" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="c"/>
<text x="79.5" y="284.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">C: песочница</tspan></text>
<text x="16" y="313.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">харнес в песочнице ОС, держатель</tspan></text>
<text x="54.4" y="332.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">учётных данных вне её</tspan></text>
<!-- node provider -->
<rect x="635.5" y="304.3" width="184.5" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="provider"/>
<text x="651.5" y="330.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Провайдер модели</tspan></text>
<!-- node project -->
<rect x="635.9" y="0" width="183.5" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="project"/>
<text x="651.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Проектная сторона</tspan></text>
<text x="657.7" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">изолированный слот;</tspan></text>
<text x="658.8" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">принудительная сеть</tspan></text>
<text x="674.4" y="93.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и квалификация</tspan></text>
<!-- note provider -->
<rect x="627.2" y="393.6" width="201" height="92.8" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_provider"/>
<text x="660.3" y="416.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">В режиме с читаемым</tspan></text>
<text x="639.2" y="435.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">токеном прокси B и C задаёт</tspan></text>
<text x="653.9" y="453.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">только маршрут: харнес</tspan></text>
<text x="655.4" y="471.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">получает токен донора.</tspan></text>
<path d="M 727.7 349.7 L 727.7 393.6" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="provider" data-to="note_provider"/>
<!-- note project -->
<rect x="645.2" y="153.4" width="165" height="129.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_project"/>
<text x="657.3" y="176.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Варианты не заменяют</tspan></text>
<text x="663.4" y="194.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">квалификацию слота</tspan></text>
<text x="666.5" y="213.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">на машине проекта.</tspan></text>
<text x="657.2" y="231.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Неизвестное покрытие</tspan></text>
<text x="661.2" y="249.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">границы не считается</tspan></text>
<text x="696.9" y="267.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">допуском.</tspan></text>
<path d="M 727.7 109.9 L 727.7 153.4" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="project" data-to="note_project"/>
<!-- link a -> provider -->
<path d="M 249.9 84 C 377.2 101.5 563 127.9 569.2 133 C 628 181.2 572.7 240.9 627.2 294 C 629.2 295.9 631.3 297.8 633.6 299.5 L 634.8 300.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a" data-to="provider" data-edge="e0"/>
<polygon points="639.7,303.8 634.1,294.4 628.9,301.7" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="318.4" y="82.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">A: нет гарантии закрытого egress ОС</tspan></text>
</g>
<!-- link b -> provider -->
<path d="M 227.5 229.6 C 256.6 241.9 289.2 254 320.2 262 C 428 289.8 459.5 271 569.2 290 C 588.7 293.3 609.3 297.6 629.1 302.1 L 630.5 302.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="b" data-to="provider" data-edge="e1"/>
<polygon points="636.3,303.8 627.6,297.1 625.5,305.9" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="343.4" y="256.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">B: только допущенный прокси</tspan></text>
</g>
<!-- link c -> provider -->
<path d="M 262.6 312.1 C 281.9 313.1 301.6 314.1 320.2 315 C 425.1 319.6 545.4 322.9 627.7 324.8 L 629.1 324.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="c" data-to="provider" data-edge="e2"/>
<polygon points="635,325 625.2,320.3 624.9,329.3" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="340.7" y="304.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">C: квалифицированный прокси</tspan></text>
</g>
<!-- link a -> project -->
<path d="M 249.9 65.4 C 360.7 63 524.6 59.4 628.4 57.1 L 629.8 57.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="a" data-to="project" data-edge="e3"/>
<polygon points="635.8,56.9 625.7,52.7 625.9,61.7" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="397.3" y="48.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">SSH от донора</tspan></text>
</g>
<!-- link b -> project -->
<path d="M 260.9 183.6 C 368.9 181.9 514 176.2 569.2 158 C 598.6 148.2 627.9 131.6 653 114.4 L 654.1 113.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="b" data-to="project" data-edge="e4"/>
<polygon points="659,110.3 648.2,112.3 653.3,119.7" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="400.4" y="160.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">SSH от донора</tspan></text>
</g>
<!-- link c -> project -->
<path d="M 246.7 258.3 C 270.7 250.1 296 242.4 320.2 237 C 428.7 212.3 470.9 263.1 569.2 211 C 604.6 192.2 599.1 170.6 627.2 142 C 636 133 645.6 123.8 655.3 115 L 656.2 114.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="c" data-to="project" data-edge="e5"/>
<polygon points="660.6,110.2 650.2,113.6 656.2,120.2" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="393.3" y="218.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">SSH от донора</tspan></text>
</g>
</g>
</svg>
