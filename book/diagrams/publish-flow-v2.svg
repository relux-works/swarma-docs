<rect x="264.1" y="355.1" width="137.4" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="277.1" cy="365.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="273.4" y="370.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="292.1" y="370.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">скачать контент</tspan></text>
</g>
