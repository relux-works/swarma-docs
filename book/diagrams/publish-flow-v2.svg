<svg xmlns="http://www.w3.org/2000/svg" width="1407.3" height="1006.9" viewBox="0 0 1407.3 1006.9">
<title>Указатель идёт в цепочку, а файл проходит от браузерной раздачи к кураторам и архивистам по их выбору.</title>
<rect width="1407.3" height="1006.9" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(84.9 0)">
<line x1="0" y1="45.4" x2="0" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="165.8" y1="45.4" x2="165.8" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="314.4" y1="45.4" x2="314.4" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="476.3" y1="45.4" x2="476.3" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="665.6" y1="45.4" x2="665.6" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="926.2" y1="45.4" x2="926.2" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="1238.4" y1="45.4" x2="1238.4" y2="982.9" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node author -->
<rect x="-84.9" y="0" width="169.8" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="author"/>
<text x="-68.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Автор в браузере</tspan></text>
<!-- node tracker -->
<rect x="115.8" y="0" width="100" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="tracker"/>
<text x="137.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Трекер</tspan></text>
<!-- node chain -->
<rect x="243.8" y="0" width="141.2" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="chain"/>
<text x="259.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Chain</tspan></text>
<!-- node indexer -->
<rect x="413.5" y="0" width="125.5" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="indexer"/>
<text x="429.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Индексатор</tspan></text>
