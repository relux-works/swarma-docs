<rect x="634.6" y="597" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="639.1" y="610.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="664.4" y="610.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">лента подписок</tspan></text>
</g>
<!-- self viewer -->
<path d="M 928.2 646.8 L 958.2 646.8 L 958.2 676.3 L 935.2 676.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="viewer" data-to="viewer" data-edge="m12"/>
<polygon points="929.2,676.3 939.2,680.8 939.2,671.8" fill="#3a3f47"/>
<rect x="966.2" y="650.8" width="246.2" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m12">
<rect x="970.2" y="652.5" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="974.7" y="666.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">11</tspan></text>
<text x="1000" y="666" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">раздавать, пока контент в кэше</tspan></text>
</g>
<!-- divider -->
<line x1="-84.9" y1="706.4" x2="1298.4" y2="706.4" stroke="#868e99" stroke-width="1.2"/>
<rect x="529.5" y="692.3" width="179.4" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="543.5" y="710.6" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Долговременная память</tspan></text>
<!-- message indexer -> archivist -->
<path d="M 478.3 768 L 1230.4 768" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="indexer" data-to="archivist" data-edge="m14"/>
<polygon points="1236.4,768 1226.4,763.5 1226.4,772.5" fill="#3a3f47"/>
<rect x="730.3" y="740.5" width="254" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m14">
<rect x="734.3" y="742.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="738.8" y="755.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">12</tspan></text>
<text x="764" y="755.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отметки выбранной окрестности</tspan></text>
</g>
<!-- message archivist -> curator -->
<path d="M 1236.4 815.5 L 673.6 815.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="archivist" data-to="curator" data-edge="m15"/>
<polygon points="667.6,815.5 677.6,820 677.6,811" fill="#3a3f47"/>
<rect x="908.2" y="788" width="87.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m15">
<rect x="912.2" y="789.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="916.7" y="803.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">13</tspan></text>
<text x="941.9" y="803.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">скачать</tspan></text>
</g>
<!-- self archivist -->
<path d="M 1236.4 839.5 L 1206.4 839.5 L 1206.4 888.5 L 1229.4 888.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="archivist" data-to="archivist" data-edge="m16"/>
<polygon points="1235.4,888.5 1225.4,884 1225.4,893" fill="#3a3f47"/>
<rect x="1028.2" y="843.5" width="170.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m16">
<rect x="1032.2" y="845.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="1036.7" y="858.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">14</tspan></text>
<text x="1061.9" y="858.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">хранить до предела</tspan></text>
<text x="1061.9" y="878.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">диска по политике</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="904.5" width="1358.4" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="439" y="929.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Без заинтересованных держателей файл может исчезнуть.</tspan></text>
<text x="431.9" y="948" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Запись в цепочке не является обещанием вечного хранения.</tspan></text>
</g>
</g>
</svg>
