<circle cx="718.6" cy="469.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="714.9" y="474.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="733.6" y="474.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">просмотреть и одобрить</tspan></text>
</g>
<!-- message curator -> chain -->
<path d="M 663.6 527.8 L 322.4 527.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="chain" data-edge="m9"/>
<polygon points="316.4,527.8 326.4,532.3 326.4,523.3" fill="#3a3f47"/>
<rect x="425.7" y="500.3" width="128.7" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m9">
<circle cx="438.7" cy="511" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="435" y="515.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="453.7" y="515.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">категоризация</tspan></text>
</g>
<!-- message curator -> viewer -->
<path d="M 667.6 575.3 L 918.2 575.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="viewer" data-edge="m10"/>
