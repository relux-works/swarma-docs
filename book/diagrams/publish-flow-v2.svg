<circle cx="29" cy="128.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="133" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="44" y="132.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">анонс торрента</tspan></text>
</g>
<!-- message author -> chain -->
<path d="M 2 192.6 L 306.4 192.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="author" data-to="chain" data-edge="m2"/>
