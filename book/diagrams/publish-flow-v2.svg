<circle cx="45.5" cy="175.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="41.9" y="180.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="60.5" y="180.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписанный указатель с тегами</tspan></text>
</g>
<!-- message chain -> indexer -->
<path d="M 316.4 240.1 L 468.3 240.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="chain" data-to="indexer" data-edge="m3"/>
<polygon points="474.3,240.1 464.3,235.6 464.3,244.6" fill="#3a3f47"/>
