<line x1="-84.9" y1="83.5" x2="1298.4" y2="83.5" stroke="#868e99" stroke-width="1.2"/>
<rect x="556.2" y="69.4" width="126.1" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="570.2" y="87.7" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рабочая память</tspan></text>
