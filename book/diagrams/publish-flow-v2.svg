<circle cx="717.6" cy="558.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="713.9" y="563.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="732.6" y="563" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">раздавать одобренное</tspan></text>
</g>
<!-- message indexer -> viewer -->
<path d="M 478.3 622.8 L 918.2 622.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="indexer" data-to="viewer" data-edge="m11"/>
<polygon points="924.2,622.8 914.2,618.3 914.2,627.3" fill="#3a3f47"/>
