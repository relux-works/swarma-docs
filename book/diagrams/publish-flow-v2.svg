<circle cx="343.4" cy="223.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="339.7" y="228" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="358.4" y="227.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запись в блоке</tspan></text>
</g>
<!-- message indexer -> curator -->
<path d="M 478.3 287.6 L 657.6 287.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="indexer" data-to="curator" data-edge="m4"/>
<polygon points="663.6,287.6 653.6,283.1 653.6,292.1" fill="#3a3f47"/>
<rect x="492.3" y="260.1" width="157.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="505.3" cy="270.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="501.6" y="275.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="520.3" y="275.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">указатель в потоке</tspan></text>
</g>
<!-- message curator -> tracker -->
<path d="M 663.6 335.1 L 173.8 335.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="tracker" data-edge="m5"/>
<polygon points="167.8,335.1 177.8,339.6 177.8,330.6" fill="#3a3f47"/>
<rect x="358.8" y="307.6" width="113.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="371.8" cy="318.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="368.1" y="323" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="386.8" y="322.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">найти пиров</tspan></text>
</g>
<!-- message curator -> author -->
<path d="M 663.6 382.6 L 8 382.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="author" data-edge="m6"/>
