<svg xmlns="http://www.w3.org/2000/svg" width="804.9" height="889" viewBox="0 0 804.9 889">
<title>Федерация владельцев: у каждого владельца свой рантайм и свой узел доверия, конверт агента B идёт через федерацию Matrix, рантайм A проверяет его по свежему снимку реестра B, а общий проект ведёт журнал с кворумом кор-нод обоих владельцев, оркестратор по аренде и детерминированный выбор ревьювера.</title>
