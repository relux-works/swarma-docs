<svg xmlns="http://www.w3.org/2000/svg" width="820" height="889" viewBox="0 0 820 889">
<title>Работающая федерация: у каждого владельца свой рантайм и свой узел доверия, конверт агента B идёт через федерацию Matrix, рантайм A проверяет его по свежему снимку реестра B, а общий проект ведёт журнал с кворумом кор-нод обоих владельцев.</title>
<rect width="820" height="889" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(-8 -8)">
<!-- graphviz 14.0.4 -->
<!-- group own_b -->
<rect x="245" y="8" width="460" height="161.4" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="own_b"/>
<!-- group own_a -->
<rect x="8" y="359.8" width="553" height="161.4" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="own_a"/>
<!-- group proj -->
<rect x="334" y="561.2" width="470" height="311.8" rx="16" fill="none" stroke="#8b929c" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="proj"/>
<!-- node tn_b -->
<rect x="262.5" y="70.8" width="225" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="tn_b"/>
<text x="313.6" y="96.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Узел доверия B</tspan></text>
<text x="278.5" y="125.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">реестр, подписант, свидетель</tspan></text>
<!-- node rt_b -->
<rect x="509.1" y="61" width="177.9" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="rt_b"/>
<text x="556.8" y="87.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рантайм B</tspan></text>
<text x="525.1" y="115.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ключник подписывает</tspan></text>
<text x="542.3" y="135.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">конверт агента B</tspan></text>
<!-- node mx -->
<rect x="504.4" y="219.4" width="197.2" height="90.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="mx"/>
<text x="577.9" y="245.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Matrix</tspan></text>
<text x="539.1" y="274.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">домашние серверы</tspan></text>
<text x="520.4" y="293.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">владельцев в федерации</tspan></text>
<!-- node rt_a -->
<rect x="339.3" y="412.8" width="203.4" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="rt_a"/>
<text x="399.7" y="438.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рантайм A</tspan></text>
<text x="380.8" y="467.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ворота проверяют</tspan></text>
<text x="355.3" y="487" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подпись, грант и свежесть</tspan></text>
<!-- node tn_a -->
<rect x="25.5" y="422.6" width="225" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="tn_a"/>
<text x="76.4" y="448.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Узел доверия A</tspan></text>
<text x="41.5" y="477.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">реестр, подписант, свидетель</tspan></text>
<!-- node log -->
<rect x="352.4" y="614.2" width="177.1" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="log"/>
<text x="376.4" y="640.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Журнал проекта</tspan></text>
<text x="368.4" y="668.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">кворум кор-нод A и B,</tspan></text>
<text x="371.2" y="688.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">аренда оркестратора</tspan></text>
<!-- node env -->
<rect x="352" y="764.6" width="174.1" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="env"/>
<text x="381" y="790.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Среда проекта</tspan></text>
<text x="384" y="819.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">контракт задачи,</tspan></text>
<text x="368" y="838.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">правила валидаторов</tspan></text>
<!-- node pool -->
<rect x="624.1" y="764.6" width="161.8" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="pool"/>
<text x="644" y="790.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Публичный пул</tspan></text>
<text x="640.1" y="819.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исполняет в ВМ без</tspan></text>
<text x="641.2" y="838.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ключей платформы</tspan></text>
<!-- link rt_b -> mx -->
<path d="M 599.4 151.6 C 600 170.4 600.7 192.3 601.3 211.8 L 601.4 213.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="rt_b" data-to="mx" data-edge="e0"/>
<polygon points="601.6,219.1 605.8,209 596.8,209.3" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="608.9" y="195.2" font-size="15" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">swarm-envelope/2</tspan></text>
</g>
<!-- link mx -> rt_a -->
<path d="M 565.4 310 C 540.9 339 508.8 376.9 483.3 407 L 482.5 407.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mx" data-to="rt_a" data-edge="e1"/>
<polygon points="478.6,412.5 488.5,407.8 481.7,402" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="550" y="344.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">конверт агента B</tspan></text>
</g>
<!-- link tn_b -> rt_a -->
<path d="M 373.4 142 C 372.4 182.7 372.9 251.9 385 309.8 C 391.9 342.6 405 377.8 416.8 405.5 L 417.4 406.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="tn_b" data-to="rt_a" data-edge="e2"/>
<polygon points="419.8,412.4 420,401.4 411.7,405" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="389.7" y="265.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">свежий снимок</tspan></text>
<text x="389.7" y="285.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">реестра B</tspan></text>
</g>
<!-- link tn_a -> rt_a -->
<path d="M 250.8 458 C 277.3 458 305.4 458 331.7 458 L 333.1 458" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="tn_a" data-to="rt_a" data-edge="e3"/>
<polygon points="339.1,458 329.1,453.5 329.1,462.5" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="266" y="446.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">гранты A</tspan></text>
</g>
<!-- link rt_a -> log -->
<path d="M 441 503.3 C 441 533.9 441 574.7 441 606.8 L 441 607.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="rt_a" data-to="log" data-edge="e4"/>
<polygon points="441,613.9 445.5,603.9 436.5,603.9" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="449" y="548.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подпись кор-ноды A</tspan></text>
</g>
<!-- link log -> env -->
<path d="M 440.4 704.9 C 440.2 721.4 439.9 740.1 439.7 757.1 L 439.7 758.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="log" data-to="env" data-edge="e5"/>
<polygon points="439.6,764.3 444.2,754.4 435.2,754.3" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="448.2" y="738" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">совершённые записи</tspan></text>
</g>
<!-- link env -> pool -->
<path d="M 526.5 809.8 C 555.4 809.8 587.5 809.8 616.5 809.8 L 617.8 809.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="env" data-to="pool" data-edge="e6"/>
<polygon points="623.8,809.8 613.8,805.3 613.8,814.3" fill="#3a3f47"/>
<g class="label" data-edge="e6">
<text x="541.5" y="798.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">чужой код</tspan></text>
</g>
<!-- group label own_b -->
<rect x="257" y="18" width="104.9" height="18.9" fill="#ffffff" class="plate"/>
<text x="263" y="32.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ВЛАДЕЛЕЦ B</tspan></text>
<!-- group label own_a -->
<rect x="20" y="369.8" width="105" height="18.9" fill="#ffffff" class="plate"/>
<text x="26" y="384.2" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ВЛАДЕЛЕЦ A</tspan></text>
<!-- group label proj -->
<rect x="661.9" y="571.2" width="130.1" height="18.9" fill="#ffffff" class="plate"/>
<text x="667.9" y="585.6" font-size="13" fill="#5f6670" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ОБЩИЙ ПРОЕКТ</tspan></text>
</g>
</g>
</svg>
