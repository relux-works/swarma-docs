<svg xmlns="http://www.w3.org/2000/svg" width="864.6" height="838.6" viewBox="0 0 864.6 838.6">
<title>Брокер, продление и отзыв: продление повторяет проверки, отзыв прекращает следующие выдачи, а в режиме без секретов у агента и использование у службы; уже переданные байты он не извлекает, а токен у провайдера не аннулирует.</title>
<rect width="864.6" height="838.6" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(60 0)">
<line x1="0" y1="45.4" x2="0" y2="814.6" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="141" y1="68.8" x2="141" y2="814.6" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="283.4" y1="92.2" x2="283.4" y2="814.6" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="510.5" y1="45.4" x2="510.5" y2="814.6" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="709" y1="115.6" x2="709" y2="814.6" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="97" y="139.6" width="437.5" height="182.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="97" y1="223.3" x2="534.5" y2="223.3" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<!-- frame opt -->
<rect x="239.4" y="566.5" width="269.1" height="159.7" rx="10" fill="none" stroke="#868e99" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" class="frame" data-kind="opt"/>
<rect x="105" y="146.6" width="184.8" height="20.2" fill="#ffffff" class="plate"/>
<text x="111" y="160.9" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим с читаемым токеном</tspan></text>
<rect x="105" y="228.3" width="189.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="111" y="242.6" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим без секретов у агента</tspan></text>
<rect x="247.4" y="573.5" width="189.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="253.4" y="587.8" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">режим без секретов у агента</tspan></text>
<!-- node operator -->
<rect x="-54.2" y="0" width="108.3" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="operator"/>
<text x="-38.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оператор</tspan></text>
<!-- node executor -->
<rect x="66.2" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="89.7" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="82.2" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node holder -->
<rect x="227.8" y="0" width="111.2" height="92.2" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="holder"/>
<text x="243.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Шлюз или</tspan></text>
<text x="255" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служба</tspan></text>
<text x="246.8" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действий</tspan></text>
<!-- node broker -->
<rect x="460.5" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="481.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- node registry -->
<rect x="637.5" y="0" width="143.1" height="115.6" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="registry"/>
<text x="663.7" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Поколения,</tspan></text>
<text x="670.2" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязки,</tspan></text>
<text x="653.5" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенности</tspan></text>
<text x="672.2" y="96.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и отзывы</tspan></text>
<!-- message executor -> broker -->
<path d="M 143 203.3 L 502.5 203.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="broker" data-edge="m0"/>
<polygon points="508.5,203.3 498.5,198.8 498.5,207.8" fill="#3a3f47"/>
<rect x="253.3" y="175.8" width="144.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="266.3" cy="186.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="262.6" y="191.2" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="281.3" y="191.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">продлить аренду</tspan></text>
</g>
<!-- message holder -> broker -->
<path d="M 285.4 306.5 L 502.5 306.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="holder" data-to="broker" data-edge="m1"/>
<polygon points="508.5,306.5 498.5,302 498.5,311" fill="#3a3f47"/>
<rect x="318.7" y="259.5" width="156.4" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="331.7" cy="270.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="328" y="274.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="346.7" y="274.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">продлить</tspan></text>
<text x="346.7" y="294.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служебную аренду</tspan></text>
</g>
<!-- message broker -> registry -->
<path d="M 512.5 364 L 701 364" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="registry" data-edge="m2"/>
<polygon points="707,364 697,359.5 697,368.5" fill="#3a3f47"/>
<rect x="526.5" y="336.5" width="166.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="539.5" cy="347.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="535.8" y="351.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="554.5" y="351.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">повторить проверки</tspan></text>
</g>
<!-- message operator -> broker -->
<path d="M 2 446.5 L 502.5 446.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="broker" data-edge="m3"/>
<polygon points="508.5,446.5 498.5,442 498.5,451" fill="#3a3f47"/>
<rect x="193.4" y="380" width="123.8" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="206.4" cy="390.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="202.7" y="395.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="221.4" y="395.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отозвать</tspan></text>
<text x="221.4" y="414.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенность</tspan></text>
<text x="221.4" y="434.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">или привязку</tspan></text>
</g>
<!-- self broker -->
<path d="M 512.5 466.5 L 542.5 466.5 L 542.5 554.5 L 519.5 554.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="broker" data-edge="m4"/>
<polygon points="513.5,554.5 523.5,559 523.5,550" fill="#3a3f47"/>
<rect x="550.5" y="470.5" width="121.5" height="80" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<rect x="554.5" y="472.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="559" y="485.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="584.2" y="485.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">прекратить</tspan></text>
<text x="584.2" y="505.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">следующие</tspan></text>
<text x="584.2" y="524.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">выдачи</tspan></text>
<text x="584.2" y="544.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и продления</tspan></text>
</g>
<!-- self holder -->
<path d="M 285.4 606.7 L 315.4 606.7 L 315.4 714.2 L 292.4 714.2" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="holder" data-to="holder" data-edge="m5"/>
<polygon points="286.4,714.2 296.4,718.7 296.4,709.7" fill="#c8285f"/>
<rect x="323.4" y="610.7" width="161.1" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<rect x="327.4" y="612.5" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="331.9" y="626.1" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">11</tspan></text>
<text x="357.1" y="626" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ</tspan></text>
<text x="357.1" y="645.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">на использовании;</tspan></text>
<text x="357.1" y="665" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">закрыть</tspan></text>
<text x="357.1" y="684.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">очередь</tspan></text>
<text x="357.1" y="704" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и потоки</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="740.2" width="829" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="104.9" y="765.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Отзыв не извлекает уже переданные байты и не аннулирует токен у провайдера.</tspan></text>
<text x="160.5" y="783.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Брокерный путь квалифицируют отдельно для каждого канала.</tspan></text>
</g>
</g>
</svg>
