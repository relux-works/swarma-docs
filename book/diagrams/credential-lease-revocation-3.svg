<svg xmlns="http://www.w3.org/2000/svg" width="828.8" height="474.3" viewBox="0 0 828.8 474.3">
<title>Брокер, продление и отзыв: продление повторяет проверки, отзыв прекращает следующие выдачи, но не извлекает уже переданные байты.</title>
<rect width="828.8" height="474.3" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(54.2 0)">
<line x1="0" y1="45.4" x2="0" y2="450.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="149" y1="68.8" x2="149" y2="450.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="325.8" y1="45.4" x2="325.8" y2="450.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="559.3" y1="115.6" x2="559.3" y2="450.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="690.6" y1="45.4" x2="690.6" y2="450.3" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node operator -->
<rect x="-54.2" y="0" width="108.3" height="45.4" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="operator"/>
<text x="-38.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оператор</tspan></text>
<!-- node executor -->
<rect x="74.2" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="97.7" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="90.2" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node broker -->
<rect x="275.8" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="297.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- node registry -->
<rect x="497.9" y="0" width="122.7" height="115.6" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="registry"/>
<text x="513.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Поколения,</tspan></text>
<text x="520.4" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязки,</tspan></text>
<text x="531.7" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">гранты</tspan></text>
<text x="522.4" y="96.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и отзывы</tspan></text>
<!-- node harness -->
<rect x="640.6" y="0" width="100" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="662.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес</tspan></text>
<!-- message executor -> broker -->
<path d="M 151 167.1 L 317.8 167.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="broker" data-edge="m0"/>
<polygon points="323.8,167.1 313.8,162.6 313.8,171.6" fill="#3a3f47"/>
<rect x="165" y="139.6" width="144.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="178" cy="150.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="174.3" y="155" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="193" y="154.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">продлить аренду</tspan></text>
</g>
<!-- message broker -> registry -->
<path d="M 327.8 214.6 L 551.3 214.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="registry" data-edge="m1"/>
<polygon points="557.3,214.6 547.3,210.1 547.3,219.1" fill="#3a3f47"/>
<rect x="359.3" y="187.1" width="166.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="372.3" cy="197.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="368.6" y="202.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="387.3" y="202.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">повторить проверки</tspan></text>
</g>
<!-- message operator -> broker -->
<path d="M 2 281.6 L 317.8 281.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="operator" data-to="broker" data-edge="m2"/>
<polygon points="323.8,281.6 313.8,277.1 313.8,286.1" fill="#3a3f47"/>
<rect x="98.5" y="234.6" width="128.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="111.5" cy="245.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="107.8" y="250" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="126.5" y="249.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отозвать грант</tspan></text>
<text x="126.5" y="269.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">или привязку</tspan></text>
</g>
<!-- self broker -->
<path d="M 327.8 305.6 L 357.8 305.6 L 357.8 374.1 L 334.8 374.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="broker" data-edge="m3"/>
<polygon points="328.8,374.1 338.8,378.6 338.8,369.6" fill="#3a3f47"/>
<rect x="365.8" y="309.6" width="167.4" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<rect x="369.8" y="311.4" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="374.3" y="325" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="399.6" y="324.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">прекратить</tspan></text>
<text x="399.6" y="344.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">следующие выдачи</tspan></text>
<text x="399.6" y="363.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и продления</tspan></text>
</g>
<!-- note -->
<rect x="89" y="390.1" width="661.7" height="42.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="221.1" y="415.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Отзыв выдачи не извлекает уже переданные байты из процесса.</tspan></text>
</g>
</g>
</svg>
