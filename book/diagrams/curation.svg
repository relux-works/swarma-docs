<svg xmlns="http://www.w3.org/2000/svg" width="562.9" height="720.1" viewBox="0 0 562.9 720.1">
<title>Оценки и метки направляют показ и окрестность хранения, не становясь правилами приёма цепочки.</title>
<rect width="562.9" height="720.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node raw -->
<rect x="17.4" y="1.9" width="226.2" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="raw"/>
<text x="33.4" y="28" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сырой поток указателей</tspan></text>
<text x="43.4" y="56.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">всё, что принято цепочкой</tspan></text>
<!-- node k0 -->
<rect x="39.2" y="111.6" width="182.6" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="k0"/>
<text x="55.2" y="137.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Куратор уровня 00</tspan></text>
<text x="67.9" y="166.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">судит сырой поток,</tspan></text>
<text x="63" y="185.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">раздаёт одобренное</tspan></text>
<!-- node k1 -->
<rect x="0" y="262" width="261.1" height="113.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="k1"/>
<text x="56.4" y="288.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Кураторы уровней</tspan></text>
<text x="59.6" y="311.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">01, 10, 11 и выше</tspan></text>
<text x="16" y="340.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписаны на теги и их сочетания,</tspan></text>
<text x="37.9" y="359.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">добавляют или снимают вес</tspan></text>
<!-- node labeler -->
<rect x="282.7" y="273.7" width="227.8" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="labeler"/>
<text x="304.8" y="299.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Лейблеры по подписке</tspan></text>
<text x="316.8" y="328.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">метки с пространствами</tspan></text>
<text x="298.7" y="347.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">имён: качество, 18+, спам, ИИ</tspan></text>
<!-- node client -->
<rect x="189.6" y="435.8" width="257.9" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="client"/>
<text x="252.8" y="461.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Клиент читателя</tspan></text>
<text x="205.6" y="490.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вес: история куратора, расстояние</tspan></text>
<text x="238.7" y="510" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">в графе, подтверждения</tspan></text>
<!-- node archivist -->
<rect x="34" y="586.2" width="231.1" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="archivist"/>
<text x="112.5" y="612.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Архивист</tspan></text>
<text x="50" y="640.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">размерность 1D, 2D и дальше;</tspan></text>
<text x="86.4" y="660.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">теги, минимальный</tspan></text>
<text x="95.4" y="679.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вес, порог диска</tspan></text>
<!-- note raw -->
<rect x="286.7" y="0" width="219.6" height="74.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_raw"/>
<text x="298.7" y="23.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Метки и веса направляют показ</tspan></text>
<text x="311.1" y="41.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и хранение и не исключают</tspan></text>
<text x="334.2" y="59.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">записей из цепочки.</tspan></text>
<path d="M 243.6 37.3 L 286.7 37.3" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="raw" data-to="note_raw"/>
<!-- link raw -> k0 -->
<path d="M 130.5 73.2 C 130.5 82.8 130.5 93.4 130.5 103.7 L 130.5 105.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="raw" data-to="k0" data-edge="e0"/>
<polygon points="130.5,111.2 135,101.2 126,101.2" fill="#3a3f47"/>
<!-- link k0 -> k1 -->
<path d="M 130.5 202.4 C 130.5 218.4 130.5 236.8 130.5 254.2 L 130.5 255.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="k0" data-to="k1" data-edge="e1"/>
<polygon points="130.5,261.5 135,251.5 126,251.5" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="138.5" y="237.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">категоризации</tspan></text>
</g>
<!-- link k1 -> client -->
<path d="M 196.6 376.1 C 217.4 393.9 240.4 413.4 260.6 430.7 L 261.7 431.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="k1" data-to="client" data-edge="e2"/>
<polygon points="266.3,435.5 261.6,425.6 255.8,432.4" fill="#3a3f47"/>
<!-- link labeler -> client -->
<path d="M 374.8 364.5 C 365.1 384.5 353.6 408.1 343.5 428.8 L 342.9 430" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="labeler" data-to="client" data-edge="e3"/>
<polygon points="340.3,435.4 348.7,428.3 340.6,424.4" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="363.9" y="410.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">скрыть, размыть, показать</tspan></text>
</g>
<!-- link k1 -> archivist -->
<path d="M 133.3 376 C 135.4 417.5 138.4 475.4 141.5 526.2 C 142.6 543.3 143.8 561.8 145 578.8 L 145.1 580" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="k1" data-to="archivist" data-edge="e4"/>
<polygon points="145.6,586 149.3,575.7 140.4,576.3" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="147.4" y="487.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">веса</tspan></text>
</g>
<!-- link client -> archivist -->
<path d="M 271 526.5 C 253 543.4 232.2 562.8 212.9 580.9 L 211.9 581.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="client" data-to="archivist" data-edge="e5"/>
<polygon points="207.5,585.9 217.9,582.4 211.8,575.8" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="253" y="560.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отметки окрестности</tspan></text>
</g>
</g>
</svg>
