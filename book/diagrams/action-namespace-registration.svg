<svg xmlns="http://www.w3.org/2000/svg" width="837" height="876.2" viewBox="0 0 837 876.2">
<title>Реестр действий: имя действия связывается со схемой и обработчиком до того, как его можно использовать в доверенности или команде.</title>
<rect width="837" height="876.2" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(63.5 0)">
<line x1="0" y1="45.4" x2="0" y2="852.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="166.2" y1="92.2" x2="166.2" y2="852.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="401.7" y1="68.8" x2="401.7" y2="852.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="669.8" y1="45.4" x2="669.8" y2="852.2" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="122.2" y="320.7" width="507.5" height="180.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="122.2" y1="423.9" x2="629.8" y2="423.9" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="130.2" y="327.7" width="157.4" height="20.2" fill="#ffffff" class="plate"/>
<text x="136.2" y="342" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">регистрация допустима</tspan></text>
<rect x="130.2" y="428.9" width="113.6" height="20.2" fill="#ffffff" class="plate"/>
<text x="136.2" y="443.2" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вне полномочий</tspan></text>
<!-- node handler -->
<rect x="-63.5" y="0" width="126.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="handler"/>
<text x="-47.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Обработчик</tspan></text>
<!-- node owner -->
<rect x="83.5" y="0" width="165.6" height="92.2" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="owner"/>
<text x="111.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Владелец или</tspan></text>
<text x="99.5" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">делегированный</tspan></text>
<text x="105.6" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">администратор</tspan></text>
<!-- node registry -->
<rect x="349.1" y="0" width="105.2" height="68.8" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="registry"/>
<text x="374.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Реестр</tspan></text>
<text x="365.1" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действий</tspan></text>
<!-- node gate -->
<rect x="590.1" y="0" width="159.4" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="gate"/>
<text x="606.1" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Ворота доверия</tspan></text>
<!-- message handler -> registry -->
<path d="M 2 163.2 L 393.7 163.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="handler" data-to="registry" data-edge="m0"/>
<polygon points="399.7,163.2 389.7,158.7 389.7,167.7" fill="#3a3f47"/>
<rect x="117.8" y="116.2" width="166.2" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="130.8" cy="126.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="127.1" y="131.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="145.8" y="131.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">манифест: действия</tspan></text>
<text x="145.8" y="150.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и схемы аргументов</tspan></text>
</g>
<!-- message owner -> registry -->
<path d="M 168.2 224.2 L 393.7 224.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="owner" data-to="registry" data-edge="m1"/>
<polygon points="399.7,224.2 389.7,219.7 389.7,228.7" fill="#3a3f47"/>
<rect x="182.2" y="177.2" width="203.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="195.2" cy="187.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="191.6" y="192.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="210.2" y="192.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписанная регистрация</tspan></text>
<text x="210.2" y="211.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">пространства имён</tspan></text>
</g>
<!-- self registry -->
<path d="M 403.7 242.2 L 433.7 242.2 L 433.7 310.7 L 410.7 310.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="registry" data-to="registry" data-edge="m2"/>
<polygon points="404.7,310.7 414.7,315.2 414.7,306.2" fill="#3a3f47"/>
<rect x="441.7" y="246.2" width="186.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="454.7" cy="256.9" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="451" y="261.6" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="469.7" y="261.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверить полномочия</tspan></text>
<text x="469.7" y="280.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и допустимый префикс</tspan></text>
<text x="469.7" y="300.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">регистрирующего</tspan></text>
</g>
<!-- self registry -->
<path d="M 403.7 360.9 L 433.7 360.9 L 433.7 409.9 L 410.7 409.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="registry" data-to="registry" data-edge="m3"/>
<polygon points="404.7,409.9 414.7,414.4 414.7,405.4" fill="#3a3f47"/>
<rect x="441.7" y="364.9" width="164" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="454.7" cy="375.6" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="451" y="380.3" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="469.7" y="380.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">связать имя,</tspan></text>
<text x="469.7" y="399.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">схему и обработчик</tspan></text>
</g>
<!-- message registry -> owner -->
<path d="M 399.7 487.6 L 174.2 487.6" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="registry" data-to="owner" data-edge="m4"/>
<polygon points="168.2,487.6 178.2,492.1 178.2,483.1" fill="#c8285f"/>
<rect x="250.2" y="460.1" width="67.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="263.2" cy="470.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="259.5" y="475.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="278.2" y="475.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ</tspan></text>
</g>
<!-- message owner -> registry -->
<path d="M 168.2 582.1 L 393.7 582.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="owner" data-to="registry" data-edge="m5"/>
<polygon points="399.7,582.1 389.7,577.6 389.7,586.6" fill="#3a3f47"/>
<rect x="192.7" y="515.6" width="182.6" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="205.7" cy="526.3" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="202" y="531" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="220.7" y="530.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенность</tspan></text>
<text x="220.7" y="550.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">с зарегистрированным</tspan></text>
<text x="220.7" y="569.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действием</tspan></text>
</g>
<!-- message gate -> registry -->
<path d="M 667.8 643.1 L 409.7 643.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gate" data-to="registry" data-edge="m6"/>
<polygon points="403.7,643.1 413.7,647.6 413.7,638.6" fill="#3a3f47"/>
<rect x="443.4" y="596.1" width="184.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="456.4" cy="606.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="452.7" y="611.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="471.4" y="611.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">найти схему</tspan></text>
<text x="471.4" y="630.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и обработчик команды</tspan></text>
</g>
<!-- self gate -->
<path d="M 667.8 661.1 L 637.8 661.1 L 637.8 710.1 L 660.8 710.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gate" data-to="gate" data-edge="m7"/>
<polygon points="666.8,710.1 656.8,705.6 656.8,714.6" fill="#3a3f47"/>
<rect x="427.7" y="665.1" width="202.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m7">
<circle cx="440.7" cy="675.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="437" y="680.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="455.7" y="680.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверить аргументы</tspan></text>
<text x="455.7" y="699.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и цепочку доверенностей</tspan></text>
</g>
<!-- message gate -> handler -->
<path d="M 667.8 747.6 L 8 747.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gate" data-to="handler" data-edge="m8"/>
<polygon points="2,747.6 12,752.1 12,743.1" fill="#3a3f47"/>
<rect x="247.5" y="720.1" width="174.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m8">
<circle cx="260.5" cy="730.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="256.8" y="735.5" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="275.5" y="735.3" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допущенная команда</tspan></text>
</g>
<!-- note -->
<rect x="341.7" y="761.6" width="388.1" height="78.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="434.5" y="786.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Незарегистрированное действие</tspan></text>
<text x="453.3" y="805.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">не получает доверенность.</tspan></text>
<text x="392.7" y="823.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Текст просьбы не создаёт нового полномочия.</tspan></text>
</g>
</g>
</svg>
