<text x="440.3" y="606.7" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">skipped_to</tspan></text>
<text x="393.9" y="635.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без передачи ответственности</tspan></text>
