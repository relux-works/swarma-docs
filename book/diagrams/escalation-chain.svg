<svg xmlns="http://www.w3.org/2000/svg" width="688.6" height="977.1" viewBox="0 0 688.6 977.1">
<title>Эскалация: идёт вверх по цепочке, пропускает недоступных и останавливается у человека, оставляя работу открытой.</title>
<rect width="688.6" height="977.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="139.3" cy="11" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node trigger -->
<rect x="33.3" y="39" width="212" height="92.2" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="trigger"/>
<text x="85.4" y="65.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Срок прошёл,</tspan></text>
<text x="49.3" y="88.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">держатель пропал или</tspan></text>
<text x="56.7" y="111.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">передача не удалась</tspan></text>
