<text x="370.9" y="803.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">к сроку шага?</tspan></text>
<text x="350.5" y="832" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подтверждение "вижу"</tspan></text>
<text x="347.9" y="851.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">решением не считается</tspan></text>
