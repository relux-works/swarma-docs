<text x="235.4" y="376.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">первая над держателем; ступени:</tspan></text>
<text x="248.2" y="395.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">оркестратор, кипер продукта,</tspan></text>
<text x="244.3" y="415.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">мета-кипер, человек-владелец</tspan></text>
