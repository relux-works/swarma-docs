<text x="40.9" y="259.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Добавить причину</tspan></text>
<text x="16" y="288.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">второй подъём не начинается</tspan></text>
<!-- node open -->
<rect x="250.2" y="234.7" width="190.1" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="open"/>
