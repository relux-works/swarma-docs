<svg xmlns="http://www.w3.org/2000/svg" width="692.3" height="606" viewBox="0 0 692.3 606">
<title>Брокер, выдача: аренду получает сторона агента после проверки поколения, привязки, грантов и отзывов.</title>
<rect width="692.3" height="606" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(74.8 0)">
<line x1="0" y1="68.8" x2="0" y2="582" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="196.7" y1="45.4" x2="196.7" y2="582" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="412.1" y1="115.6" x2="412.1" y2="582" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="543.5" y1="45.4" x2="543.5" y2="582" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="-44" y="265.1" width="611.5" height="296.9" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="-44" y1="352.8" x2="567.5" y2="352.8" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="-36" y="272.1" width="299.1" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="286.4" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка не пройдена или отзывы нечитаемы</tspan></text>
<rect x="-36" y="357.8" width="140.9" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="372.1" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск подтверждён</tspan></text>
<!-- node executor -->
<rect x="-74.8" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="-51.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="-58.8" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node broker -->
<rect x="146.7" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="168" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- node registry -->
<rect x="350.8" y="0" width="122.7" height="115.6" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="registry"/>
<text x="366.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Поколения,</tspan></text>
<text x="373.3" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязки,</tspan></text>
<text x="384.5" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">гранты</tspan></text>
<text x="375.3" y="96.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и отзывы</tspan></text>
<!-- node harness -->
<rect x="493.5" y="0" width="100" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="515.2" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес</tspan></text>
<!-- message broker -> registry -->
<path d="M 198.7 245.1 L 404.1 245.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="registry" data-edge="m0"/>
<polygon points="410.1,245.1 400.1,240.6 400.1,249.6" fill="#3a3f47"/>
<rect x="212.7" y="139.6" width="183.5" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="225.7" cy="150.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="222" y="155" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="240.7" y="154.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">UID от ядра, активное</tspan></text>
<text x="240.7" y="174.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">поколение, привязка,</tspan></text>
<text x="240.7" y="193.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">права, отзывы</tspan></text>
<text x="240.7" y="213.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и квалифицированный</tspan></text>
<text x="240.7" y="232.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">путь</tspan></text>
</g>
<!-- message broker -> executor -->
<path d="M 194.7 328.8 L 8 328.8" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="broker" data-to="executor" data-edge="m1"/>
<polygon points="2,328.8 12,333.3 12,324.3" fill="#c8285f"/>
<rect x="64.6" y="301.3" width="67.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="77.6" cy="312.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="73.9" y="316.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="92.6" y="316.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ</tspan></text>
</g>
<!-- message broker -> executor -->
<path d="M 194.7 455.5 L 8 455.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="executor" data-edge="m2"/>
<polygon points="2,455.5 12,460 12,451" fill="#3a3f47"/>
<rect x="16" y="389" width="164.7" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="29" cy="399.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="404.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="44" y="404.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал аренды</tspan></text>
<text x="44" y="423.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">через разрешённый</tspan></text>
<text x="44" y="443.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">канал</tspan></text>
</g>
<!-- message executor -> harness -->
<path d="M 2 542 L 535.5 542" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="harness" data-edge="m3"/>
<polygon points="541.5,542 531.5,537.5 531.5,546.5" fill="#3a3f47"/>
<rect x="204.2" y="475.5" width="135.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="217.2" cy="486.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="213.5" y="490.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="232.2" y="490.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал без</tspan></text>
<text x="232.2" y="510.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">argv, файлов</tspan></text>
<text x="232.2" y="529.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запуска и логов</tspan></text>
</g>
</g>
</g>
</svg>
