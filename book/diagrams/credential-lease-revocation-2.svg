<svg xmlns="http://www.w3.org/2000/svg" width="874.4" height="783.1" viewBox="0 0 874.4 783.1">
<title>Брокер, выдача: после проверки поколения, привязки, доверенностей и отзывов аренду получает исполнитель под UID агента или, в режиме без секретов у агента, служба, которая проверяет право вызывающего на каждом использовании.</title>
<rect width="874.4" height="783.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(60 0)">
<line x1="0" y1="45.4" x2="0" y2="759.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="167.2" y1="68.8" x2="167.2" y2="759.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="313.6" y1="92.2" x2="313.6" y2="759.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="503.4" y1="45.4" x2="503.4" y2="759.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="718.8" y1="115.6" x2="718.8" y2="759.1" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- frame alt -->
<rect x="-44" y="261.1" width="741.1" height="409.6" rx="10" fill="none" stroke="#868e99" stroke-width="1.5" stroke-dasharray="7 5" class="frame" data-kind="alt"/>
<line x1="-44" y1="366.3" x2="697.1" y2="366.3" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="-44" y1="571.5" x2="697.1" y2="571.5" stroke="#868e99" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="-36" y="268.1" width="299.1" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="282.4" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка не пройдена или отзывы нечитаемы</tspan></text>
<rect x="-36" y="371.3" width="234.1" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="385.6" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск, режим с читаемым токеном</tspan></text>
<rect x="-36" y="576.5" width="238.9" height="20.2" fill="#ffffff" class="plate"/>
<text x="-30" y="590.8" font-size="14" fill="#868e99"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допуск, режим без секретов у агента</tspan></text>
<!-- node harness -->
<rect x="-50" y="0" width="100" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="-28.3" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес</tspan></text>
<!-- node executor -->
<rect x="92.4" y="0" width="149.6" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="115.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<text x="108.4" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">под UID агента</tspan></text>
<!-- node holder -->
<rect x="258" y="0" width="111.2" height="92.2" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="holder"/>
<text x="274" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Шлюз или</tspan></text>
<text x="285.2" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служба</tspan></text>
<text x="276.9" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">действий</tspan></text>
<!-- node broker -->
<rect x="453.4" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="broker"/>
<text x="474.7" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Брокер</tspan></text>
<!-- node registry -->
<rect x="647.3" y="0" width="143.1" height="115.6" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="registry"/>
<text x="673.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Поколения,</tspan></text>
<text x="680" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязки,</tspan></text>
<text x="663.3" y="72.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">доверенности</tspan></text>
<text x="682" y="96.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и отзывы</tspan></text>
<!-- message broker -> registry -->
<path d="M 505.4 245.1 L 710.8 245.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="registry" data-edge="m0"/>
<polygon points="716.8,245.1 706.8,240.6 706.8,249.6" fill="#3a3f47"/>
<rect x="519.4" y="139.6" width="183.5" height="99.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="532.4" cy="150.4" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="528.7" y="155" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="547.4" y="154.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">UID от ядра, активное</tspan></text>
<text x="547.4" y="174.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">поколение, привязка,</tspan></text>
<text x="547.4" y="193.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">права, отзывы</tspan></text>
<text x="547.4" y="213.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и квалифицированный</tspan></text>
<text x="547.4" y="232.9" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">путь</tspan></text>
</g>
<!-- self broker -->
<path d="M 505.4 301.3 L 535.4 301.3 L 535.4 350.3 L 512.4 350.3" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="broker" data-to="broker" data-edge="m1"/>
<polygon points="506.4,350.3 516.4,354.8 516.4,345.8" fill="#c8285f"/>
<rect x="543.4" y="305.3" width="129.7" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="556.4" cy="316.1" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="552.7" y="320.7" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="571.4" y="320.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">отказ</tspan></text>
<text x="571.4" y="340.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вызывающему</tspan></text>
</g>
<!-- message broker -> executor -->
<path d="M 501.4 469 L 175.2 469" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="executor" data-edge="m2"/>
<polygon points="169.2,469 179.2,473.5 179.2,464.5" fill="#3a3f47"/>
<rect x="252.9" y="402.5" width="164.7" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="265.9" cy="413.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="262.2" y="417.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="280.9" y="417.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал аренды</tspan></text>
<text x="280.9" y="437.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">через разрешённый</tspan></text>
<text x="280.9" y="456.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">канал</tspan></text>
</g>
<!-- message executor -> harness -->
<path d="M 165.2 551.5 L 8 551.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="harness" data-edge="m3"/>
<polygon points="2,551.5 12,556 12,547" fill="#3a3f47"/>
<rect x="16" y="485" width="135.2" height="60.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="29" cy="495.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="500.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="44" y="500.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал без</tspan></text>
<text x="44" y="519.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">argv, файлов</tspan></text>
<text x="44" y="539.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запуска и логов</tspan></text>
</g>
<!-- message broker -> holder -->
<path d="M 501.4 654.7 L 321.6 654.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="broker" data-to="holder" data-edge="m4"/>
<polygon points="315.6,654.7 325.6,659.2 325.6,650.2" fill="#3a3f47"/>
<rect x="329.6" y="607.7" width="157.8" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="342.6" cy="618.5" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="338.9" y="623.1" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="357.6" y="623" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материал</tspan></text>
<text x="357.6" y="642.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">служебной аренды</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="684.7" width="838.8" height="60.4" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="32.7" y="710" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">В режиме без секретов у агента харнес получает только заглушку, а служба тратит материал только после</tspan></text>
<text x="7.3" y="728.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверки права исходного вызывающего на цель и операцию и текущего полномочия, на каждом использовании.</tspan></text>
</g>
</g>
</svg>
