<svg xmlns="http://www.w3.org/2000/svg" width="1775" height="1004.1" viewBox="0 0 1775 1004.1">
<title>Удалённый ход: модель работает у донора, а команды и почта идут по одному SSH-каналу к исполнителю на нашей стороне.</title>
<rect width="1775" height="1004.1" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(101.3 0)">
<!-- group donor -->
<rect x="-101.3" y="0" width="606.8" height="889.5" rx="16" fill="none" stroke="#d9690f" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="donor"/>
<!-- group ours -->
<rect x="786.1" y="0" width="863.6" height="889.5" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="ours"/>
<!-- group label donor -->
<rect x="-89.3" y="10" width="144.9" height="18.9" fill="#ffffff" class="plate"/>
<text x="-83.3" y="24.4" font-size="13" fill="#b9580b" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">МАШИНА ДОНОРА</tspan></text>
<!-- group label ours -->
<rect x="798.1" y="10" width="129.4" height="18.9" fill="#ffffff" class="plate"/>
<text x="804.1" y="24.4" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">НАША СТОРОНА</tspan></text>
<line x1="0" y1="83.1" x2="0" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="199.4" y1="83.1" x2="199.4" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="420.6" y1="83.1" x2="420.6" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="898.7" y1="106.5" x2="898.7" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="1175" y1="83.1" x2="1175" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="1372.1" y1="83.1" x2="1372.1" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="1553" y1="83.1" x2="1553" y2="881.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node harness -->
<rect x="-83.3" y="37.7" width="166.7" height="45.4" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="-67.3" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес и модель</tspan></text>
<!-- node relay -->
<rect x="142" y="37.7" width="114.9" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="relay"/>
<text x="158" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Stdio relay</tspan></text>
<!-- node bridge -->
<rect x="353.7" y="37.7" width="133.8" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="bridge"/>
<text x="369.7" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Мост донора</tspan></text>
<!-- node ssh -->
<rect x="804.1" y="37.7" width="189.2" height="68.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="ssh"/>
<text x="861" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Вход SSH</tspan></text>
<text x="820.1" y="87.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и проверка допуска</tspan></text>
<!-- node executor -->
<rect x="1107.7" y="37.7" width="134.5" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="executor"/>
<text x="1123.7" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исполнитель</tspan></text>
<!-- node workspace -->
<rect x="1297.8" y="37.7" width="148.6" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="workspace"/>
<text x="1313.8" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рабочее место</tspan></text>
<!-- node mailbox -->
<rect x="1474.4" y="37.7" width="157.3" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="mailbox"/>
<text x="1490.4" y="63.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Почтовый ящик</tspan></text>
<!-- message bridge -> ssh -->
<path d="M 422.6 177.5 L 890.7 177.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="bridge" data-to="ssh" data-edge="m0"/>
<polygon points="896.7,177.5 886.7,173 886.7,182" fill="#3a3f47"/>
<rect x="549.1" y="130.5" width="193.5" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m0">
<circle cx="562.1" cy="141.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="558.4" y="145.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="577.1" y="145.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">одно исходящее</tspan></text>
<text x="577.1" y="165.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">SSH-соединение донора</tspan></text>
</g>
<!-- message harness -> relay -->
<path d="M 2 225 L 191.4 225" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="harness" data-to="relay" data-edge="m1"/>
<polygon points="197.4,225 187.4,220.5 187.4,229.5" fill="#3a3f47"/>
<rect x="17.7" y="197.5" width="164" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="30.7" cy="208.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="27" y="212.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="45.7" y="212.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запрос инструмента</tspan></text>
</g>
<!-- message relay -> bridge -->
<path d="M 201.4 292 L 412.6 292" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="relay" data-to="bridge" data-edge="m2"/>
<polygon points="418.6,292 408.6,287.5 408.6,296.5" fill="#3a3f47"/>
<rect x="215.4" y="245" width="189.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="228.4" cy="255.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="224.8" y="260.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="243.4" y="260.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">передать запрос без</tspan></text>
<text x="243.4" y="279.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">локального исполнения</tspan></text>
</g>
<!-- message bridge -> ssh -->
<path d="M 422.6 339.5 L 890.7 339.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="bridge" data-to="ssh" data-edge="m3"/>
<polygon points="896.7,339.5 886.7,335 886.7,344" fill="#3a3f47"/>
<rect x="520.1" y="312" width="251.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="533.1" cy="322.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="529.4" y="327.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="548.1" y="327.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">команда по тому же соединению</tspan></text>
</g>
<!-- self ssh -->
<path d="M 900.7 363.5 L 930.7 363.5 L 930.7 412.5 L 907.7 412.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="ssh" data-to="ssh" data-edge="m4"/>
<polygon points="901.7,412.5 911.7,417 911.7,408" fill="#3a3f47"/>
<rect x="938.7" y="367.5" width="210.3" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="951.7" cy="378.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="948" y="382.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="966.7" y="382.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверить допуск</tspan></text>
<text x="966.7" y="402.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и привязку рабочего места</tspan></text>
</g>
<!-- message ssh -> executor -->
<path d="M 900.7 456 L 1167 456" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="ssh" data-to="executor" data-edge="m5"/>
<polygon points="1173,456 1163,451.5 1163,460.5" fill="#3a3f47"/>
<rect x="953.7" y="428.5" width="166.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="966.7" cy="439.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="963" y="443.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="981.7" y="443.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">допущенный запрос</tspan></text>
</g>
<!-- message executor -> workspace -->
<path d="M 1177 523 L 1364.1 523" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="workspace" data-edge="m6"/>
<polygon points="1370.1,523 1360.1,518.5 1360.1,527.5" fill="#3a3f47"/>
<rect x="1191" y="476" width="165.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="1204" cy="486.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="1200.3" y="491.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">7</tspan></text>
<text x="1219" y="491.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">команда в границах</tspan></text>
<text x="1219" y="510.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">рабочего места</tspan></text>
</g>
<!-- message workspace -> executor -->
<path d="M 1370.1 570.5 L 1183 570.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="workspace" data-to="executor" data-edge="m7"/>
<polygon points="1177,570.5 1187,575 1187,566" fill="#3a3f47"/>
<rect x="1236.4" y="543" width="74.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m7">
<circle cx="1249.4" cy="553.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="1245.7" y="558.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">8</tspan></text>
<text x="1264.4" y="558.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вывод</tspan></text>
</g>
<!-- message executor -> ssh -->
<path d="M 1173 618 L 906.7 618" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="executor" data-to="ssh" data-edge="m8"/>
<polygon points="900.7,618 910.7,622.5 910.7,613.5" fill="#3a3f47"/>
<rect x="988.6" y="590.5" width="96.4" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m8">
<circle cx="1001.6" cy="601.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="997.9" y="605.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">9</tspan></text>
<text x="1016.6" y="605.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат</tspan></text>
</g>
<!-- message ssh -> bridge -->
<path d="M 896.7 665.5 L 428.6 665.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="ssh" data-to="bridge" data-edge="m9"/>
<polygon points="422.6,665.5 432.6,670 432.6,661" fill="#3a3f47"/>
<rect x="513.5" y="638" width="264.7" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m9">
<rect x="517.5" y="639.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="522" y="653.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">10</tspan></text>
<text x="547.2" y="653.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат по тому же соединению</tspan></text>
</g>
<!-- message bridge -> relay -->
<path d="M 418.6 713 L 207.4 713" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="bridge" data-to="relay" data-edge="m10"/>
<polygon points="201.4,713 211.4,717.5 211.4,708.5" fill="#3a3f47"/>
<rect x="258.9" y="685.5" width="102.2" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m10">
<rect x="262.9" y="687.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="267.4" y="700.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">11</tspan></text>
<text x="292.7" y="700.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">результат</tspan></text>
</g>
<!-- message relay -> harness -->
<path d="M 197.4 760.5 L 8 760.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="relay" data-to="harness" data-edge="m11"/>
<polygon points="2,760.5 12,765 12,756" fill="#3a3f47"/>
<rect x="16" y="733" width="167.4" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m11">
<rect x="20" y="734.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="24.5" y="748.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">12</tspan></text>
<text x="49.7" y="748.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">вывод инструмента</tspan></text>
</g>
<!-- message bridge -> ssh -->
<path d="M 422.6 808 L 890.7 808" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="bridge" data-to="ssh" data-edge="m12"/>
<polygon points="896.7,808 886.7,803.5 886.7,812.5" fill="#3a3f47"/>
<rect x="527" y="780.5" width="237.6" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m12">
<rect x="531" y="782.2" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="535.5" y="795.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">13</tspan></text>
<text x="560.8" y="795.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">почта по тому же соединению</tspan></text>
</g>
<!-- message ssh -> mailbox -->
<path d="M 900.7 855.5 L 1545 855.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="ssh" data-to="mailbox" data-edge="m13"/>
<polygon points="1551,855.5 1541,851 1541,860" fill="#3a3f47"/>
<rect x="1152.1" y="828" width="147.5" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m13">
<rect x="1156.1" y="829.8" width="23.7" height="18" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="1160.6" y="843.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">14</tspan></text>
<text x="1185.8" y="843.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">почтовый обмен</tspan></text>
</g>
<!-- note -->
<rect x="-60" y="901.5" width="1673" height="78.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note"/>
<text x="624.8" y="926.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">На доноре нет локальных инструментов харнеса.</tspan></text>
<text x="621.8" y="945" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Наша сторона не подключается обратно к донору.</tspan></text>
<text x="616.1" y="963.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Сквозной путь требует квалификации обеих сторон.</tspan></text>
</g>
</g>
</svg>
