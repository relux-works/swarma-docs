<svg xmlns="http://www.w3.org/2000/svg" width="790.8" height="475.5" viewBox="0 0 790.8 475.5">
<title>Публикация, рабочая память: указатель идёт в цепочку, кураторы находят и скачивают файл.</title>
<rect width="790.8" height="475.5" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(59.2 0)">
<line x1="0" y1="68.8" x2="0" y2="451.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="165.8" y1="45.4" x2="165.8" y2="451.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="306.4" y1="45.4" x2="306.4" y2="451.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="468.3" y1="45.4" x2="468.3" y2="451.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="657.6" y1="45.4" x2="657.6" y2="451.5" stroke="#c3c8cf" stroke-width="1.5" stroke-dasharray="4 5"/>
<!-- node author -->
<rect x="-59.2" y="0" width="118.3" height="68.8" rx="12" fill="#f1f2f4" stroke="#8b929c" stroke-width="2" class="box" data-id="author"/>
<text x="-23.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Автор</tspan></text>
<text x="-43.2" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">в браузере</tspan></text>
<!-- node tracker -->
<rect x="115.8" y="0" width="100" height="45.4" rx="12" fill="#fff2e6" stroke="#d9690f" stroke-width="2" class="box" data-id="tracker"/>
<text x="137.4" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Трекер</tspan></text>
<!-- node chain -->
<rect x="235.8" y="0" width="141.2" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="chain"/>
<text x="251.8" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Swarma Chain</tspan></text>
<!-- node indexer -->
<rect x="405.5" y="0" width="125.5" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="indexer"/>
<text x="421.5" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Индексатор</tspan></text>
<!-- node curator -->
<rect x="607.6" y="0" width="100" height="45.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="curator"/>
<text x="624.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Куратор</tspan></text>
<!-- divider -->
<line x1="-59.2" y1="106.9" x2="707.6" y2="106.9" stroke="#868e99" stroke-width="1.2"/>
<rect x="265.8" y="92.8" width="126.1" height="28.2" rx="14.1" fill="#f6f7f9" stroke="#868e99" stroke-width="1.2" class="plate"/>
<text x="279.8" y="111.1" font-size="14" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Рабочая память</tspan></text>
<!-- message author -> tracker -->
<path d="M 2 168.5 L 157.8 168.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="author" data-to="tracker" data-edge="m1"/>
<polygon points="163.8,168.5 153.8,164 153.8,173" fill="#3a3f47"/>
<rect x="16" y="141" width="133.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m1">
<circle cx="29" cy="151.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="25.3" y="156.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">1</tspan></text>
<text x="44" y="156.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">анонс торрента</tspan></text>
</g>
<!-- message author -> chain -->
<path d="M 2 235.5 L 298.4 235.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="author" data-to="chain" data-edge="m2"/>
<polygon points="304.4,235.5 294.4,231 294.4,240" fill="#3a3f47"/>
<rect x="75.2" y="188.5" width="156.1" height="41" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m2">
<circle cx="88.2" cy="199.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="84.5" y="203.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">2</tspan></text>
<text x="103.2" y="203.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">подписанный</tspan></text>
<text x="103.2" y="223.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">указатель с тегами</tspan></text>
</g>
<!-- message chain -> indexer -->
<path d="M 308.4 283 L 460.3 283" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="chain" data-to="indexer" data-edge="m3"/>
<polygon points="466.3,283 456.3,278.5 456.3,287.5" fill="#3a3f47"/>
<rect x="322.4" y="255.5" width="129.9" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m3">
<circle cx="335.4" cy="266.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="331.7" y="270.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">3</tspan></text>
<text x="350.4" y="270.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">запись в блоке</tspan></text>
</g>
<!-- message indexer -> curator -->
<path d="M 470.3 330.5 L 649.6 330.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="indexer" data-to="curator" data-edge="m4"/>
<polygon points="655.6,330.5 645.6,326 645.6,335" fill="#3a3f47"/>
<rect x="484.3" y="303" width="157.3" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m4">
<circle cx="497.3" cy="313.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="493.6" y="318.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">4</tspan></text>
<text x="512.3" y="318.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">указатель в потоке</tspan></text>
</g>
<!-- message curator -> tracker -->
<path d="M 655.6 378 L 173.8 378" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="tracker" data-edge="m5"/>
<polygon points="167.8,378 177.8,382.5 177.8,373.5" fill="#3a3f47"/>
<rect x="354.8" y="350.5" width="113.8" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m5">
<circle cx="367.8" cy="361.2" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="364.1" y="365.9" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">5</tspan></text>
<text x="382.8" y="365.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">найти пиров</tspan></text>
</g>
<!-- message curator -> author -->
<path d="M 655.6 425.5 L 8 425.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="curator" data-to="author" data-edge="m6"/>
<polygon points="2,425.5 12,430 12,421" fill="#3a3f47"/>
<rect x="260.1" y="398" width="137.4" height="21.5" fill="#ffffff" class="plate"/>
<g class="label" data-edge="m6">
<circle cx="273.1" cy="408.8" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" class="step"/>
<text x="269.4" y="413.4" font-size="13" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">6</tspan></text>
<text x="288.1" y="413.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">скачать контент</tspan></text>
</g>
</g>
</g>
</svg>
